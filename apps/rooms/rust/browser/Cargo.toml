[package]
name = "rooms-browser"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
rooms-application = { path = "../application" }
rooms-glowcap = { path = "../glowcap" }
rooms-runtime = { path = "../runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
glowcap = { workspace = true, features = ["browser"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "sync"] }
web-sys = { version = "0.3", features = ["console", "WebSocket", "CloseEvent", "MessageEvent", "Url", "UrlSearchParams", "Performance", "Crypto", "RtcConfiguration", "RtcIceServer", "AbortController", "AbortSignal", "RequestInit", "RequestMode", "RequestCache", "RequestCredentials", "RequestRedirect", "Response", "Headers", "ReadableStream", "ReadableStreamDefaultReader", "Event", "EventTarget", "DomException", "DomStringList", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "IdbObjectStoreParameters", "IdbIndex", "IdbIndexParameters", "IdbCursor", "IdbCursorWithValue", "IdbKeyRange", "Blob", "BlobPropertyBag"] }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-futures = "0.4"
