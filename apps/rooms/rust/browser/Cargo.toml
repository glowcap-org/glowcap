[package]
name = "rooms-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
rooms-application = { path = "../application" }
rooms-glowcap = { path = "../glowcap" }
rooms-runtime = { path = "../runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
glowcap = { workspace = true, features = ["browser"] }
tokio.workspace = true
web-sys = { workspace = true, features = ["console", "WebSocket", "CloseEvent", "MessageEvent", "Url", "UrlSearchParams", "Performance", "Crypto", "RtcConfiguration", "RtcIceServer", "AbortController", "AbortSignal", "RequestInit", "RequestMode", "RequestCache", "RequestCredentials", "RequestRedirect", "Response", "Headers", "ReadableStream", "ReadableStreamDefaultReader", "Event", "EventTarget", "DomException", "DomStringList", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "IdbObjectStoreParameters", "IdbIndex", "IdbIndexParameters", "IdbCursor", "IdbCursorWithValue", "IdbKeyRange", "Blob", "BlobPropertyBag"] }
wasm-bindgen.workspace = true
js-sys.workspace = true
gloo-timers = { workspace = true, features = ["futures"] }
wasm-bindgen-futures.workspace = true
