[workspace]
members = ["application", "glowcap", "runtime", "platform", "services", "product", "browser", "proofs"]
# Process tests need prepared executables/assets and run through their own
# build gates. Plain workspace tests retain the portable application surface.
default-members = ["application", "glowcap", "runtime", "platform", "services", "browser", "proofs"]
resolver = "3"

[workspace.package]
repository = "https://github.com/glowcap-org/glowcap"
homepage = "https://glowcap.org"
documentation = "https://glowcap.org"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# dep serde: Serializes Rooms records and configuration.
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc", "rc"] }
# dep serde_json: JSON for Rooms records, configuration and the web protocol.
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc", "raw_value"] }
# dep hmac: Signs grant, share and link tokens.
hmac = { version = "=0.13.0", default-features = false }
# dep sha2: SHA-256 for tokens and content history.
sha2 = { version = "=0.11.1", default-features = false }
glowcap = { package = "glowcap", path = "../../../bindings/rust", default-features = false, features = ["async"] }
# dep tokio: The async runtime for the Rooms server, sessions and services.
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "macros", "sync", "time"] }
# dep url: Parses links in messages and link previews.
url = { version = "=2.5.8", default-features = false }
# dep tokio-tungstenite: WebSockets between the Rooms server and its clients.
tokio-tungstenite = { version = "=0.30.0", default-features = false }
# dep futures-util: Stream and sink helpers for WebSockets.
futures-util = { version = "=0.3.34", default-features = false }
# dep tokio-rustls: TLS for the Rooms server and its bootstrap client.
tokio-rustls = { version = "=0.26.6", default-features = false }
# dep bytes: Byte buffers for WebSocket frames.
bytes = "=1.12.1"
# dep wasm-bindgen: Rooms' browser build.
wasm-bindgen = "=0.2.129"
# dep wasm-bindgen-futures: Runs Rust futures on the browser's event loop.
wasm-bindgen-futures = "0.4"
# dep js-sys: JavaScript built-ins for the browser build.
js-sys = "0.3"
# dep web-sys: Browser APIs for the browser build.
web-sys = "0.3"
# dep gloo-timers: Timers in the browser build.
gloo-timers = "0.4"
# dep hyper: The Rooms HTTP server.
hyper = { version = "=1.12.0", default-features = false, features = ["http1"] }
# dep hyper-util: Connection helpers for the HTTP server.
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
# dep http-body-util: Request and response bodies for the HTTP server.
http-body-util = { version = "=0.1.5", default-features = false }
# dep nix: Unix signals, file sync and polling for storage and the server process.
nix = { version = "=0.31.3", default-features = false, features = ["signal", "fs", "poll"] }

# The floor every crate answers to, in the manifest rather than only on the
# command line the gate happens to use. That distinction is the point: with the
# denial passed as `-D warnings` from `tools/build/rooms/rust.zig` alone, a
# contributor running `cargo clippy` by hand and an editor running
# rust-analyzer both saw a weaker standard than CI, and found out at push time.
# Declared here, all three agree.
#
# `unsafe_code` was already forbidden at the root of five of the six crates,
# one fact written five times. `proofs` does not inherit this setting because
# it drives the C ABI directly and must use unsafe at that boundary.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Priority -1 so an individual lint below could be relaxed by name without
# turning the group off; nothing needs that yet, and the shape is here so the
# first exception has to be written down rather than achieved with a flag.
all = { level = "deny", priority = -1 }
# Every unwrap or expect in non-test code is a typed refusal or carries a
# lint-checked reason; `clippy.toml` exempts tests.
unwrap_used = "deny"
expect_used = "deny"
# A `str` sliced by byte index panics inside a multibyte character, and the
# text Rooms slices is a peer's: a media type, a name, a line. Slice the bytes
# or use the `str` methods that find their own boundaries.
string_slice = "deny"

[profile.test]
# Keep source locations for failure backtraces without full variable/type
# debug data in every test binary. CARGO_PROFILE_TEST_DEBUG=2 opts back in.
debug = "line-tables-only"

[profile.browser-proof]
# Contract execution needs optimized loops, without deployment's whole-program
# link. Keep this output separate so proofs cannot replace deployable artifacts.
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16

[profile.release]
lto = true
codegen-units = 1
# A panic means an internal invariant has failed. Ending the process lets its
# supervisor restart one coherent service instead of leaving sibling tasks
# alive around state that can no longer be trusted.
panic = "abort"
