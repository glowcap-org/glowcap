# One `// SAFETY:` comment above a statement covers every unsafe block in it,
# so `check(unsafe { ... })` needs one comment, not one per block.
accept-comment-above-statement = true
# `glowcap::Ref` hashes and compares its immutable identity only, so its
# release flag and guard never move a key inside a set.
ignore-interior-mutability = ["glowcap::Ref"]
