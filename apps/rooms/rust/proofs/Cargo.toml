[package]
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
name = "rooms-contract-proofs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# This crate exists to drive the C ABI directly, so it does not inherit the
# workspace's `unsafe_code = "forbid"`. What it does answer to is
# where the unsafety is written down: at edition 2024 an `unsafe fn` body is no
# longer implicitly unsafe, and Rust only warns when one has not caught up.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# Every unsafe block names the handle, owner, and pointer source it relies on.
# `clippy.toml` lets one comment above a statement cover the blocks inside it.
undocumented_unsafe_blocks = "deny"

[features]
async-host = ["glowcap/browser", "dep:rooms-glowcap", "dep:rooms-runtime", "dep:rooms-browser", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:gloo-timers", "dep:tokio", "dep:web-sys", "dep:futures-util"]

[lib]
# Native tests consume the library. Wasm proof builds explicitly request the
# exported module, so ordinary Cargo tests do not link an unused shared library.
crate-type = ["rlib"]

[dependencies]
rooms-application = { path = "../application" }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Runtime proofs execute in the async embedding. The portable contract must
# not link browser entropy/timers merely because their crate is in the workspace.
rooms-runtime = { path = "../runtime", optional = true }
rooms-glowcap = { path = "../glowcap", features = ["loam"], optional = true }
rooms-browser = { path = "../browser", optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["WebSocket", "RtcDataChannel", "RtcConfiguration"] }
gloo-timers = { workspace = true, features = ["futures"], optional = true }
tokio = { workspace = true, features = ["io-util"], optional = true }
futures-util = { workspace = true, features = ["alloc"], optional = true }
glowcap = { package = "glowcap", path = "../../../../bindings/rust", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glowcap = { workspace = true, features = ["loam"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rooms-services = { path = "../services" }
rooms-platform = { path = "../platform" }
rooms-runtime = { path = "../runtime" }
rooms-glowcap = { path = "../glowcap", features = ["loam"] }
glowcap = { workspace = true, features = ["tcp"] }
tokio.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
