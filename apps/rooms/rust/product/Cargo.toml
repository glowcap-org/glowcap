[package]
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
name = "rooms-product"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rooms-services = { path = "../services", features = ["processes"] }
rooms-platform = { path = "../platform" }
rooms-application = { path = "../application" }
glowcap.workspace = true
tokio = { workspace = true, features = ["signal", "net", "io-util", "fs", "process"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
bytes.workspace = true
url.workspace = true
tokio-rustls.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
http-body-util.workspace = true

[dev-dependencies]
rooms-glowcap = { path = "../glowcap" }
rooms-runtime = { path = "../runtime" }
glowcap = { workspace = true, features = ["tcp"] }
tokio = { workspace = true, features = ["test-util"] }
futures-util = { workspace = true, features = ["async-await", "sink"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
sha2.workspace = true
nix.workspace = true
