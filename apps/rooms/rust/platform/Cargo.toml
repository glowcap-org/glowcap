[package]
name = "rooms-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rooms-application = { path = "../application" }
rooms-glowcap = { path = "../glowcap" }
rooms-runtime = { path = "../runtime" }
glowcap = { workspace = true, features = ["tcp", "iroh", "relay", "onion"] }
tokio = { workspace = true, features = ["net", "io-util", "fs"] }
getrandom = "=0.4.3"
serde = { workspace = true, features = ["std"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { workspace = true, features = ["sink"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
rustls-native-certs = "=0.8.5"
bytes.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
