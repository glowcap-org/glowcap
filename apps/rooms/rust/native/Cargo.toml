[package]
name = "rooms-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
service = ["glowcap/tcp", "glowcap/iroh", "glowcap/relay", "glowcap/onion", "tokio/signal", "tokio/net", "tokio/io-util", "tokio/fs", "tokio/process", "dep:tokio-tungstenite", "dep:futures-util", "dep:tokio-rustls", "dep:rustls-native-certs", "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:base64", "dep:url", "dep:nix"]

[[bin]]
name = "rooms-archive"
path = "src/bin/rooms-archive.rs"
required-features = ["service"]

[[bin]]
name = "rooms-session"
path = "src/bin/rooms-session.rs"
required-features = ["service"]

[[bin]]
name = "rooms-server"
path = "src/bin/rooms-server.rs"
required-features = ["service"]

[[bin]]
name = "rooms-irc-bridge"
path = "src/bin/rooms-irc-bridge.rs"
required-features = ["service"]

[[bin]]
name = "rooms-irc-front"
path = "src/bin/rooms-irc-front.rs"
required-features = ["service"]

[[bin]]
name = "rooms-web"
path = "src/bin/rooms-web.rs"
required-features = ["service"]

[[bin]]
name = "rooms-chat"
path = "src/bin/rooms-chat.rs"
required-features = ["service"]

[dependencies]
rooms-application = { path = "../application" }
tokio.workspace = true
glowcap.workspace = true
rooms-glowcap = { path = "../glowcap" }
rooms-runtime = { path = "../runtime" }
serde_json.workspace = true
serde = { workspace = true, features = ["std"] }
sha2.workspace = true
getrandom = "=0.4.3"
tokio-tungstenite = { version = "=0.30.0", optional = true, default-features = false, features = ["connect"] }
futures-util = { version = "=0.3.34", optional = true, default-features = false, features = ["sink"] }
tokio-rustls = { version = "=0.26.4", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = { version = "=0.8.4", optional = true }
hyper = { version = "=1.11.0", optional = true, default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.20", optional = true, default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.4", optional = true }
bytes = { version = "=1.12.1", optional = true }
base64 = { version = "=0.22.1", optional = true }
url = { version = "=2.5.8", optional = true }
nix = { version = "=0.26.4", optional = true, default-features = false, features = ["signal", "fs", "poll"] }

tokio-postgres = { version = "=0.7.18", optional = true }
tokio-postgres-rustls = { version = "=0.14.0", optional = true, default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
glowcap = { workspace = true, features = ["tcp"] }
