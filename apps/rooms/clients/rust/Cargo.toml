[package]
repository = "https://github.com/glowcap-org/glowcap"
homepage = "https://glowcap.org"
documentation = "https://glowcap.org"
name = "rooms-client"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[bin]]
name = "rooms-client"
path = "client.rs"

[features]
# Dial the room over iroh's encrypted QUIC (an `ocapn://…iroh` locator) in
# addition to TCP, by turning on the binding's iroh transport. Off by default so
# the TCP demo builds without cargo's iroh ABI companion library. With it on the
# client links `libglowcap_net_transport_iroh` alongside the core; off, it links
# only the core, the same "no shipped cost" the archive set gives.
iroh = ["glowcap/iroh"]

# The glowcap binding, with its tokio async layer. Renamed to `glowcap` so the
# application reads against the library, not the dogfood crate's package name.
# `default-features = false` keeps the archive set explicit. This client always
# composes the TCP provider for bare room locators; the optional `iroh` feature
# adds only the iroh provider for `ocapn://…iroh` locators.
[dependencies]
glowcap = { path = "../../../../bindings/rust", package = "glowcap", default-features = false, features = ["async", "tcp"] }
# dep tokio: The async runtime for the Rust Rooms terminal client.
tokio = { version = "1", default-features = false, features = ["net", "rt", "io-util", "macros", "time", "sync"] }
