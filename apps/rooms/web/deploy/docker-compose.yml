# Serve the Rooms browser UI over a WebSocket relay to an iroh room server from
# a light, toolchain-free container, with kept room lines in a PostgreSQL
# service beside it. This tracked base publishes no host port and joins one
# shared Docker network. How this machine reaches the page is the ignored
# docker-compose.override.yml's business, so a host's ports and network names
# never enter the repository. Terminal CapTP peers need neither: they dial
# over iroh Discovery.
#
# `glowcap apps rooms deployment up` installs this template into the selected
# configuration directory, preserves the operator override and database secret,
# selects an immutable product image, and waits for service health. With the
# example override the page is at http://127.0.0.1:8080 on the Docker host.
# Runtime binaries and browser assets are inside the image, never live mounts.

name: glowcap-rooms

services:
  directory:
    image: ${GLOWCAP_ROOMS_IMAGE:?select an image through glowcap apps rooms deployment up}
    container_name: glowcap-rooms-directory
    working_dir: /runtime
    # The web front serves the prepared page and owns its directory child.
    command:
      - --http-port=8080
      - --http-bind=0.0.0.0
      - --transport=iroh
    environment:
      GLOWCAP_LIB_DIR: /runtime/lib
      # One room authority across child and container restarts. This keeps the
      # iroh endpoint id and every issued durable room link stable.
      GLOWCAP_ROOMS_STATE: /state
      # Dial-by-node-id over n0 relays + DNS/pkarr (rooms-peer / cross-container).
      GLOWCAP_ROOMS_REACHABILITY: discovery
      # The web relay's deployment admission. Blank takes the in-process
      # defaults; exporting one before compose starts overrides only the
      # resource its name describes.
      GLOWCAP_RELAY_MAX_SESSIONS: ${GLOWCAP_RELAY_MAX_SESSIONS:-}
      GLOWCAP_RELAY_MAX_REGISTRATIONS: ${GLOWCAP_RELAY_MAX_REGISTRATIONS:-}
      GLOWCAP_RELAY_MAX_REGISTRATIONS_PER_IDENTITY: ${GLOWCAP_RELAY_MAX_REGISTRATIONS_PER_IDENTITY:-}
      GLOWCAP_RELAY_MAX_IROH_SESSIONS: ${GLOWCAP_RELAY_MAX_IROH_SESSIONS:-}
      GLOWCAP_RELAY_MAX_IROH_DIALS_PER_MINUTE: ${GLOWCAP_RELAY_MAX_IROH_DIALS_PER_MINUTE:-}
      # Browser-to-browser WebRTC uses the application's public STUN default.
      # Empty means host candidates only; a comma-separated STUN list replaces it.
      # GLOWCAP_ROOMS_ICE_SERVERS: ""
      # A credential issuer gives restrictive-NAT peers short-lived TURN reach.
      # The bearer token stays in this server; browsers receive only temporary
      # username/password rows from GET /ice. Blank keeps the STUN-only posture.
      GLOWCAP_ROOMS_TURN_CREDENTIALS_URL: ${GLOWCAP_ROOMS_TURN_CREDENTIALS_URL:-}
      GLOWCAP_ROOMS_TURN_BEARER_TOKEN: ${GLOWCAP_ROOMS_TURN_BEARER_TOKEN:-}
      GLOWCAP_ROOMS_TURN_TTL_SECONDS: ${GLOWCAP_ROOMS_TURN_TTL_SECONDS:-86400}
      # Every operator capability, on by default: each swiss number persists in
      # the state volume and prints in the logs; comment one out to withhold
      # that authority from this deployment. Read them any time with
      #   docker exec glowcap-rooms-directory /runtime/bin/glowcap apps rooms directory capabilities
      # Same as starting with --diagnostics: mint inspect.
      GLOWCAP_ROOMS_DIAGNOSTICS: "1"
      # Same as --admin-listeners: mint the listener-admin capability.
      GLOWCAP_ROOMS_ADMIN_LISTENERS: "1"
      # Same as --operator: mint the server-wide authority that gives and
      # revokes room stewardships.
      GLOWCAP_ROOMS_OPERATOR: "1"
      # Same as --peering: mint the directory-peering capability.
      GLOWCAP_ROOMS_PEERING: "1"
      # Same as --trace: serve the live timeline endpoint (default port 9300;
      # GLOWCAP_ROOMS_TRACE_PORT only changes the port) and mint the trace
      # capability it requires of every socket.
      GLOWCAP_ROOMS_TRACE: "1"
      # Same as --irc: mint the IRC gateway capability.
      GLOWCAP_ROOMS_IRC: "1"
      # Same as --history: listed rooms keep their last lines and serve them
      # to members who join later.
      GLOWCAP_ROOMS_HISTORY: "1"
      # Same as --storage=: where kept lines persist. The default is the
      # PostgreSQL service below, reached only over the private compose
      # network, so TLS is off on that leg; the URL names user, host, and
      # database, and the password rides in as a Docker secret through
      # --storage-password-file, never in this environment. Export both of
      # these empty to keep lines in the state volume's files instead, which
      # is a development posture, not a deployment.
      GLOWCAP_ROOMS_STORAGE: ${GLOWCAP_ROOMS_STORAGE-postgres://rooms@postgres:5432/rooms?sslmode=disable}
      GLOWCAP_ROOMS_STORAGE_PASSWORD_FILE: ${GLOWCAP_ROOMS_STORAGE_PASSWORD_FILE-/run/secrets/storage-db-password}
    secrets:
      - storage-db-password
    volumes:
      - directory-state:/state
    # The room server refuses to start until it can open its history store,
    # so it waits for the database to answer before it is started at all.
    depends_on:
      postgres:
        condition: service_healthy
    # Readiness checks both the supervised directory and prepared browser assets.
    healthcheck:
      test: ["CMD", "/runtime/bin/glowcap", "apps", "rooms", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The room server is spawned at startup and announces when it is ready;
      # until then the container is starting rather than unhealthy.
      start_period: 90s
    restart: unless-stopped
    networks:
      - glowcap-rooms-net

  # One durable user workspace, separate from the directory's authority.
  # Its administrator sturdyref never crosses HTTP: deployment up reads the
  # current-start mirror from this container and the intended owner pastes it
  # into the page's explicit session-establishment form. The page's existing
  # relay can dial this iroh identity without a published container port.
  session:
    image: ${GLOWCAP_ROOMS_IMAGE:?select an image through glowcap apps rooms deployment up}
    container_name: glowcap-rooms-session
    working_dir: /runtime
    entrypoint: ["/runtime/bin/glowcap", "apps", "rooms", "session", "serve"]
    command:
      - --dir=/session-state
      - --readiness-file=/run/rooms-session/admin.sturdyref
    environment:
      GLOWCAP_LIB_DIR: /runtime/lib
      GLOWCAP_ROOMS_SESSION_STATE: /session-state
      GLOWCAP_ROOMS_SESSION_TRANSPORT: iroh
      GLOWCAP_ROOMS_SESSION_REACHABILITY: discovery
    volumes:
      - session-state:/session-state
    # Readiness is an incarnation fact, not user state. A tmpfs makes a crash,
    # container restart, or recreation begin without a stale ready marker.
    tmpfs:
      - /run/rooms-session:mode=0700
    healthcheck:
      test: ["CMD", "/runtime/bin/glowcap", "apps", "rooms", "session", "ready", "--file=/run/rooms-session/admin.sturdyref"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - glowcap-rooms-net

  # The history database. The room server reaches it only over the private
  # compose network; nothing publishes it to the host, and its one password
  # is the Docker secret deployment up mints, mounted here as a file the image reads
  # at first start. Data checksums are on from the first initdb, because
  # turning them on later means a dump and restore. The data volume is the
  # deployment's memory: back it up with pg_dump (README, Storage) before
  # recreating or upgrading this service, and never change the major version
  # in place.
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: glowcap-rooms-postgres
    environment:
      POSTGRES_DB: rooms
      POSTGRES_USER: rooms
      POSTGRES_PASSWORD_FILE: /run/secrets/storage-db-password
      POSTGRES_INITDB_ARGS: --data-checksums
    secrets:
      - storage-db-password
    volumes:
      - postgres:/var/lib/postgresql
    # PostgreSQL's shared buffers live in shared memory, and Docker's 64 MiB
    # default is too small for a busy checkpoint.
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rooms -d rooms"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # Give a checkpoint time to finish before the process is killed.
    stop_grace_period: 60s
    restart: unless-stopped
    networks:
      - glowcap-rooms-net

secrets:
  # Minted in the deployment configuration on first use. One file, read by the
  # database at its first start and by the room server at every start.
  storage-db-password:
    file: ./secrets/storage-db-password

networks:
  # Shared fabric with the glowcap devcontainer: a bot there reaches this
  # container's internal CapTP over this network. Fixed name, external so both
  # compose projects use the one network (deployment up creates it once).
  glowcap-rooms-net:
    name: glowcap-rooms-net
    external: true

volumes:
  directory-state:
    name: glowcap-rooms-directory-state
  session-state:
    name: glowcap-rooms-session-state
  postgres:
    name: glowcap-rooms-postgres
