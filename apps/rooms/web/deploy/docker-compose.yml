# Serve the Rooms browser UI over a WebSocket relay to an iroh room server from
# a light, toolchain-free container. This tracked base publishes no host port
# and joins one shared Docker network. How this machine reaches the page is the
# ignored docker-compose.override.yml's business, so a host's ports and network
# names never enter the repository. Terminal CapTP peers need neither: they
# dial over iroh Discovery.
#
# Prerequisites, in the dev container — this produces the shared libraries,
# WebAssembly Host, and browser bundle this image loads:
#
#     zig build rooms-deploy-prep
#
# Then, from this directory, say how the page is reached and bring it up:
#
#     cp docker-compose.override.yml.example docker-compose.override.yml
#     ./up.sh
#
# up.sh waits for both peers to serve and prints the room locator, the operator
# capabilities, and the session administrator capability in one block.
# `./compose.sh up -d --build` is the same start without that handoff. With the
# example override in place the page is at http://127.0.0.1:8000 on the Docker
# host, and the browser peer dials the room through the same-origin /relay
# WebSocket.

services:
  rooms:
    build:
      # No local build context is needed — the image is the official Deno binary on
      # a debian base (see rooms.Dockerfile). Source and .so arrive as runtime mounts.
      context: .
      dockerfile: rooms.Dockerfile
    image: glowcap-rooms:local
    container_name: glowcap-rooms
    working_dir: /repo
    # serve.ts serves the page and /relay WebSocket on 8000, spawns the iroh room
    # server, and publishes GET /locator for CapTP peers. The browser peer dials
    # through the relay; terminal peers dial iroh directly (or through relay).
    command:
      - run
      - -A
      - --unstable-ffi
      # The repo mounts read-only, so deno cannot write deno.lock (which is
      # gitignored and drifts as the workspace gains deps); skip the lockfile
      # entirely. The source is pinned by the read-only mount, and the one npm
      # dep (zod) is version-pinned in the import map, so nothing here needs it.
      - --no-lock
      - apps/rooms/web/serve.ts
      - "8000"
      - --transport=iroh
    environment:
      # Where the binding finds the prebuilt shared libraries (load.ts's first rung).
      GLOWCAP_LIB_DIR: /libs
      DENO_DIR: /deno-dir
      # One room authority across child and container restarts. This keeps the
      # iroh endpoint id and every issued durable room link stable.
      GLOWCAP_ROOMS_STATE: /state
      # Dial-by-node-id over n0 relays + DNS/pkarr (rooms-peer / cross-container).
      GLOWCAP_ROOMS_REACHABILITY: discovery
      # Browser-to-browser WebRTC uses the application's public STUN default.
      # Empty means host candidates only; a comma-separated STUN list replaces it.
      # GLOWCAP_ROOMS_ICE_SERVERS: ""
      # A credential issuer gives restrictive-NAT peers short-lived TURN reach.
      # The bearer token stays in this server; browsers receive only temporary
      # username/password rows from GET /ice. Blank keeps the STUN-only posture.
      GLOWCAP_ROOMS_TURN_CREDENTIALS_URL: ${GLOWCAP_ROOMS_TURN_CREDENTIALS_URL:-}
      GLOWCAP_ROOMS_TURN_BEARER_TOKEN: ${GLOWCAP_ROOMS_TURN_BEARER_TOKEN:-}
      GLOWCAP_ROOMS_TURN_TTL_SECONDS: ${GLOWCAP_ROOMS_TURN_TTL_SECONDS:-86400}
      # Every operator capability, on by default: each swiss number persists in
      # the state volume and prints in the logs; comment one out to withhold
      # that authority from this deployment. Read them any time with
      #   ./compose.sh exec rooms deno run --allow-read --allow-env --no-lock \
      #     /repo/apps/rooms/server/capabilities.ts
      # Same as starting with --diagnostics: mint inspect.
      GLOWCAP_ROOMS_DIAGNOSTICS: "1"
      # Same as --admin-listeners: mint the listener-admin capability.
      GLOWCAP_ROOMS_ADMIN_LISTENERS: "1"
      # Same as --operator: mint the server-wide authority that gives and
      # revokes room stewardships.
      GLOWCAP_ROOMS_OPERATOR: "1"
      # Same as --peering: mint the directory-peering capability.
      GLOWCAP_ROOMS_PEERING: "1"
      # Same as --viz: serve the live timeline endpoint (default port 9300;
      # GLOWCAP_ROOMS_VIZ_PORT only changes the port) and mint the viz
      # capability it requires of every socket.
      GLOWCAP_ROOMS_VIZ: "1"
      # Same as --irc: mint the IRC gateway capability.
      GLOWCAP_ROOMS_IRC: "1"
      # Same as --history: listed rooms keep their last lines in the state
      # volume and serve them to members who join later.
      GLOWCAP_ROOMS_HISTORY: "1"
      # Same as --storage=: one destination whose shape picks where kept
      # lines persist. Empty keeps the state volume's files. To use the
      # managed database below instead, bring it up with
      #   ./compose.sh --profile storage-db up -d
      # and set this to its URL, e.g.
      #   postgres://rooms:${STORAGE_DB_PASSWORD}@rooms-storage-db:5432/rooms
      GLOWCAP_ROOMS_STORAGE: ${GLOWCAP_ROOMS_STORAGE:-}
    volumes:
      # The TypeScript source and the prebuilt .so, both read-only mounts — neither
      # is baked into the image. Build the .so in the dev container first (above).
      - ../../../..:/repo:ro
      - ../../../../zig-out/lib:/libs:ro
      # A writable module cache, since the source mount is read-only.
      - rooms-deno-cache:/deno-dir
      - rooms-state:/state
    # Alive is not the same as serving. `/locator` answers only once the page is
    # being served *and* the room server it supervises has announced itself, so
    # it is the one probe that tells a working deployment from a container that
    # is up and useless — the state an operator otherwise finds out about from
    # somebody in the room. Deno is the only tool in this image, and needs
    # nothing but loopback to ask.
    healthcheck:
      test: ["CMD", "deno", "run", "--allow-net=127.0.0.1:8000", "--allow-env", "/repo/apps/rooms/web/deploy/healthcheck.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The room server is spawned at startup and announces when it is ready;
      # until then the container is starting rather than unhealthy.
      start_period: 90s
    restart: unless-stopped
    networks:
      - rooms-net

  # One durable user workspace, separate from the room directory's authority.
  # Its administrator sturdyref never crosses HTTP: ./up.sh reads the
  # current-start mirror from this container and the intended owner pastes it
  # into the page's explicit session-establishment form. The page's existing
  # relay can dial this iroh identity without a published container port.
  rooms-session:
    image: glowcap-rooms:local
    container_name: glowcap-rooms-session
    working_dir: /repo
    command:
      - run
      # Deno's granular FFI allowlist names files, not directory trees. This
      # session loads the core, Host, driver, and selected provider archives
      # from the read-only /libs mount; `=/libs` grants none of them and makes
      # startup report that --allow-ffi is missing. FFI is the one broad
      # permission here, while reads, writes, environment, and custody remain
      # explicitly scoped below.
      - --allow-ffi
      - --unstable-ffi
      - --allow-read=/repo,/libs,/session-state,/run/rooms-session
      - --allow-write=/session-state,/run/rooms-session
      - --allow-net
      - --allow-env=GLOWCAP_LIB_DIR,GLOWCAP_ROOMS_SESSION_STATE,GLOWCAP_ROOMS_SESSION_TRANSPORT,GLOWCAP_ROOMS_SESSION_REACHABILITY
      - --no-lock
      - apps/rooms/session/main.ts
      - --readiness-file=/run/rooms-session/admin.sturdyref
    environment:
      GLOWCAP_LIB_DIR: /libs
      DENO_DIR: /deno-dir
      GLOWCAP_ROOMS_SESSION_STATE: /session-state
      GLOWCAP_ROOMS_SESSION_TRANSPORT: iroh
      GLOWCAP_ROOMS_SESSION_REACHABILITY: discovery
    volumes:
      - ../../../..:/repo:ro
      - ../../../../zig-out/lib:/libs:ro
      - rooms-session-deno-cache:/deno-dir
      - rooms-session-state:/session-state
    # Readiness is an incarnation fact, not user state. A tmpfs makes a crash,
    # container restart, or recreation begin without a stale ready marker.
    tmpfs:
      - /run/rooms-session:mode=0700
    healthcheck:
      test: ["CMD", "deno", "run", "--allow-read=/run/rooms-session", "--no-lock", "/repo/apps/rooms/web/deploy/session_healthcheck.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - rooms-net

  # The managed storage database, opted into with --profile storage-db. The
  # room server reaches it only over the private compose network; nothing
  # publishes it to the host. Its password is supplied explicitly in the
  # process environment when this profile is requested.
  rooms-storage-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: rooms-storage-db
    profiles: ["storage-db"]
    environment:
      POSTGRES_DB: rooms
      POSTGRES_USER: rooms
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD:-}
    volumes:
      - rooms-storage-db:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - rooms-net

networks:
  # Shared fabric with the glowcap devcontainer: a bot there reaches this
  # container's internal CapTP over this network. Fixed name, external so both
  # compose projects use the one network (create it once with
  # `docker network create rooms-net`).
  rooms-net:
    name: rooms-net
    external: true

volumes:
  rooms-deno-cache:
  rooms-state:
  rooms-session-deno-cache:
  rooms-session-state:
  rooms-storage-db:
