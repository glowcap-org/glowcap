# Serve the rooms browser UI over a WebSocket relay to an iroh room server from
# a light, toolchain-free container, reachable through an existing cloudflared
# tunnel on a shared Docker network. The browser peer dials through the relay;
# terminal CapTP peers dial over iroh Discovery.
#
# Prerequisites, in the dev container — this produces the shared libraries,
# WebAssembly Host, and browser bundle this image loads:
#
#     zig build rooms-deploy-prep
#
# Then, from this directory:
#
#     docker compose up -d --build
#
# The browser reaches the page and its /relay WebSocket over cloudflared. The
# browser peer dials the room through the relay; terminal peers dial over iroh
# Discovery. Cloudflared only needs HTTP 8000. Point one ingress rule at it:
# next to your other services:
#
#     - hostname: rooms.<your-domain>
#       service: http://pancake-rooms:8000
#
# then `cloudflared tunnel route dns <tunnel> rooms.<your-domain>`.

services:
  rooms:
    build:
      # No local build context is needed — the image is the official Deno binary on
      # a debian base (see rooms.Dockerfile). Source and .so arrive as runtime mounts.
      context: .
      dockerfile: rooms.Dockerfile
    image: pancake-rooms:local
    container_name: pancake-rooms
    working_dir: /repo
    # serve.ts serves the page and /relay WebSocket on 8000, spawns the iroh room
    # server, and publishes GET /locator for CapTP peers. The browser peer dials
    # through the relay; terminal peers dial iroh directly (or through relay).
    command:
      - run
      - -A
      - --unstable-ffi
      # The repo mounts read-only, so deno cannot write deno.lock (which is
      # gitignored and drifts as the workspace gains deps); skip the lockfile
      # entirely. The source is pinned by the read-only mount, and the one npm
      # dep (zod) is version-pinned in the import map, so nothing here needs it.
      - --no-lock
      - apps/rooms/web/serve.ts
      - "8000"
      - --transport=iroh
    environment:
      # Where the binding finds the prebuilt shared libraries (load.ts's first rung).
      PANCAKE_LIB_DIR: /libs
      DENO_DIR: /deno-dir
      # One room authority across child and container restarts. This keeps the
      # iroh endpoint id and every issued durable room link stable.
      PANCAKE_ROOMS_STATE: /state
      # Dial-by-node-id over n0 relays + DNS/pkarr (rooms-peer / cross-container).
      PANCAKE_ROOMS_REACHABILITY: discovery
      # Browser-to-browser WebRTC uses public Cloudflare STUN by default. Empty
      # means host candidates only; a comma-separated STUN list replaces it.
      # PANCAKE_ROOMS_ICE_SERVERS: ""
      # A credential issuer gives restrictive-NAT peers short-lived TURN reach.
      # The bearer token stays in this server; browsers receive only temporary
      # username/password rows from GET /ice. Blank keeps the STUN-only posture.
      PANCAKE_ROOMS_TURN_CREDENTIALS_URL: ${PANCAKE_ROOMS_TURN_CREDENTIALS_URL:-}
      PANCAKE_ROOMS_TURN_BEARER_TOKEN: ${PANCAKE_ROOMS_TURN_BEARER_TOKEN:-}
      PANCAKE_ROOMS_TURN_TTL_SECONDS: ${PANCAKE_ROOMS_TURN_TTL_SECONDS:-86400}
      # Every operator capability, on by default: each swiss number persists in
      # the state volume and prints in the logs; comment one out to withhold
      # that authority from this deployment. Read them any time with
      #   docker compose exec rooms deno run --allow-read --allow-env --no-lock \
      #     /repo/apps/rooms/server/capabilities.ts
      # Same as starting with --diagnostics: mint inspect.
      PANCAKE_ROOMS_DIAGNOSTICS: "1"
      # Same as --admin-listeners: mint the listener-admin capability.
      PANCAKE_ROOMS_ADMIN_LISTENERS: "1"
      # Same as --peering: mint the directory-peering capability.
      PANCAKE_ROOMS_PEERING: "1"
      # Same as --viz: serve the live timeline endpoint (default port 9300;
      # PANCAKE_ROOMS_VIZ_PORT only changes the port) and mint the viz
      # capability it requires of every socket.
      PANCAKE_ROOMS_VIZ: "1"
      # Same as --irc: mint the IRC gateway capability.
      PANCAKE_ROOMS_IRC: "1"
      # Same as --history: listed rooms keep their last lines in the state
      # volume and serve them to members who join later.
      PANCAKE_ROOMS_HISTORY: "1"
    volumes:
      # The TypeScript source and the prebuilt .so, both read-only mounts — neither
      # is baked into the image. Build the .so in the dev container first (above).
      - ../../../..:/repo:ro
      - ../../../../zig-out/lib:/libs:ro
      # A writable module cache, since the source mount is read-only.
      - rooms-deno-cache:/deno-dir
      - rooms-state:/state
    # Alive is not the same as serving. `/locator` answers only once the page is
    # being served *and* the room server it supervises has announced itself, so
    # it is the one probe that tells a working deployment from a container that
    # is up and useless — the state an operator otherwise finds out about from
    # somebody in the room. Deno is the only tool in this image, and needs
    # nothing but loopback to ask.
    healthcheck:
      test: ["CMD", "deno", "run", "--allow-net=127.0.0.1:8000", "--allow-env", "/repo/apps/rooms/web/deploy/healthcheck.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The room server is spawned at startup and announces when it is ready;
      # until then the container is starting rather than unhealthy.
      start_period: 90s
    restart: unless-stopped
    networks:
      - rooms-net
      - egress-net

networks:
  # Shared fabric with the pancake devcontainer: a bot there reaches this
  # container's internal CapTP over this network. Fixed name, external so both
  # compose projects use the one network (create it once with
  # `docker network create rooms-net`).
  rooms-net:
    name: rooms-net
    external: true
  # The tunnel network cloudflared reaches this container on for the public web
  # UI (:8000). Host-named via the gitignored .env (EGRESS_NET). The key below
  # is a compose alias, not the host network name.
  egress-net:
    name: ${EGRESS_NET:?Set EGRESS_NET in .env (see .env.example)}
    external: true

volumes:
  rooms-deno-cache:
  rooms-state:
