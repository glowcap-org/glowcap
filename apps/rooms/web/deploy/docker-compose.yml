# The Rooms deployment: the web server with its directory, and one shared
# session. `glowcap apps rooms deployment up` writes this file as compose.yml
# from the installed product on every run, so an edit here does not last. Every
# setting a host chooses lives in docker-compose.override.yml, which `up`
# copies once from docker-compose.override.yml.example and never rewrites. The
# override's `environment` entries add to and replace the ones here.
#
# The deployment binds no host port itself, so the override publishes a
# loopback port or joins the network of a proxy or tunnel container.
# `glowcap apps rooms serve --help` lists the directory's settings, and
# `glowcap apps rooms session serve --help` the session's. Each goes in the
# override as its variable, by the rule the deployment guide's "Settings as
# variables" section states (README.md beside this file).
# Unset, `GLOWCAP_RELAY_ALLOW_ORIGINS` admits the published page
# https://glowcap.org/rooms/app/, and the first page it lists is the one `up`
# prints a link for.

name: glowcap-rooms

services:
  directory:
    image: ${GLOWCAP_ROOMS_IMAGE:?select an image through glowcap apps rooms deployment up}
    container_name: glowcap-rooms-directory
    working_dir: /runtime
    # The web server serves the prepared page and runs the directory as its
    # child. It listens on every container interface, since only the override
    # decides what reaches the container.
    command:
      - --http-port=8080
      - --http-bind=0.0.0.0
    environment:
      GLOWCAP_LIB_DIR: /runtime/lib
      # One directory identity across child and container restarts. This keeps
      # the iroh node id and every issued durable room link stable. Public
      # rooms keep their history in this volume too.
      GLOWCAP_ROOMS_STATE: /state
      # Dial by iroh node id over the iroh relays and DNS discovery, so peers in
      # other containers and on other hosts reach the directory.
      GLOWCAP_ROOMS_REACHABILITY: discovery
      # Every operator capability. Each one's secret persists in the state
      # volume and prints in the logs. To withhold some, list the ones you want
      # in the override, for example GLOWCAP_ROOMS_CAPABILITIES:
      # "admin-listeners,diagnostics,operator,peering,trace" leaves IRC out.
      # Read them any time with
      #   docker exec glowcap-rooms-directory /runtime/bin/glowcap apps rooms directory capabilities
      GLOWCAP_ROOMS_CAPABILITIES: all
      # Rooms keep their last lines and serve them to members who join later.
      GLOWCAP_ROOMS_HISTORY: "1"
    volumes:
      - directory-state:/state
    # Readiness checks both the supervised directory and prepared browser assets.
    healthcheck:
      test: ["CMD", "/runtime/bin/glowcap", "apps", "rooms", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The directory is spawned at startup and announces when it is ready.
      # Until then the container is starting rather than unhealthy.
      start_period: 90s
    restart: unless-stopped
    networks:
      - glowcap-rooms-net

  # One durable shared session, separate from the directory's authority. Its
  # use and management links never cross HTTP: `deployment up` reads them from
  # this container. The page's relay dials the session's iroh identity, so no
  # container port is published for it.
  session:
    image: ${GLOWCAP_ROOMS_IMAGE:?select an image through glowcap apps rooms deployment up}
    container_name: glowcap-rooms-session
    working_dir: /runtime
    entrypoint: ["/runtime/bin/glowcap", "apps", "rooms", "session", "serve"]
    command:
      - --dir=/session-state
      - --readiness-file=/run/rooms-session/use.sturdyref
    environment:
      GLOWCAP_LIB_DIR: /runtime/lib
      GLOWCAP_ROOMS_SESSION_STATE: /session-state
      GLOWCAP_ROOMS_SESSION_TRANSPORT: iroh
      GLOWCAP_ROOMS_SESSION_REACHABILITY: discovery
      # Browser introductions carry a relay locator, including the fallback for
      # WebRTC. The session dials those relay locators through the directory's
      # relay.
      # When public ingress needs a browser login, the override sets
      # GLOWCAP_ROOMS_SESSION_RELAY_ALIAS_URL to the public relay address, and
      # the session reaches it here instead.
      GLOWCAP_ROOMS_SESSION_RELAY_URL: ws://directory:8080/relay
    volumes:
      - session-state:/session-state
    # The readiness file belongs to one start, not to user state. A tmpfs makes
    # a crash, container restart, or recreation begin without a stale marker.
    tmpfs:
      - /run/rooms-session:mode=0700
    healthcheck:
      test: [
        "CMD",
        "/runtime/bin/glowcap",
        "apps",
        "rooms",
        "session",
        "ready",
        "--file=/run/rooms-session/use.sturdyref",
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - glowcap-rooms-net

networks:
  # One network, created by `deployment up` and shared with a proxy or tunnel
  # container and with terminal peers on this host, so it outlives the stack.
  glowcap-rooms-net:
    name: glowcap-rooms-net
    external: true

volumes:
  directory-state:
    name: glowcap-rooms-directory-state
  session-state:
    name: glowcap-rooms-session-state
