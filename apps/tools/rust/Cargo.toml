[package]
name = "tools-agent"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[bin]]
name = "tools-agent"
path = "agent.rs"

# Keep the archive set explicit: this agent composes the tokio driver with the
# TCP provider and pays for no unrelated transport archive.
[dependencies]
glowcap = { path = "../../../bindings/rust", package = "glowcap-rust-dogfood", default-features = false, features = ["async", "tcp"] }
tokio = { version = "1", default-features = false, features = ["net", "rt", "io-util", "macros", "time", "sync"] }
