[package]
name = "tasks-client"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "tasks-client"
path = "client.rs"

# `default-features = false` so this client links only the core archive plus its
# tokio driver: it dials over native sockets and pays for no transport archive.
[dependencies]
pancake = { path = "../../../bindings/rust", package = "pancake-rust-dogfood", default-features = false, features = ["async"] }
tokio = { version = "1", default-features = false, features = ["net", "rt", "io-util", "macros", "time", "sync"] }
