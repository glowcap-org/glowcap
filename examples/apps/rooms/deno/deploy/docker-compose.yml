# Serve the rooms browser UI over iroh from a light, toolchain-free container,
# reachable through an existing cloudflared tunnel on a shared Docker network.
# CapTP peers (rooms-peer) bootstrap the live ocapn:// locator from
# http://pancake-rooms:8000/locator, then dial over iroh Discovery (n0 relays +
# DNS/pkarr) — not CapTP over the HTTP port.
#
# Prerequisites, once, in the dev container — they produce the shared libraries
# this image loads:
#
#     zig build && zig build iroh-abi     # -> zig-out/lib/libpancake_ocapn.so
#                                         #    + libpancake_net_transport_iroh.so
#
# Then, from this directory:
#
#     docker compose up -d --build
#
# The browser reaches the page and its WebSocket over cloudflared; iroh CapTP
# runs inside the container and across Discovery for peers on the shared net.
# Cloudflared only needs HTTP 8000. Point one ingress rule at it, next to your
# other services:
#
#     - hostname: rooms.<your-domain>
#       service: http://pancake-rooms:8000
#
# then `cloudflared tunnel route dns <tunnel> rooms.<your-domain>`.

services:
  rooms:
    build:
      # No local build context is needed — the image is the official Deno binary on
      # a debian base (see rooms.Dockerfile). Source and .so arrive as runtime mounts.
      context: .
      dockerfile: rooms.Dockerfile
    image: pancake-rooms:local
    container_name: pancake-rooms
    working_dir: /repo
    # web.ts serves the page and /ws on 8000, spawns the iroh room directory, and
    # publishes GET /locator for CapTP peers. Discovery reachability announces a
    # bare ocapn://<nodeid>.iroh URI resolved via n0/pkarr.
    command:
      - run
      - -A
      - --unstable-ffi
      - examples/apps/rooms/deno/web.ts
      - "8000"
      - --transport=iroh
    environment:
      # Where the binding finds the prebuilt shared libraries (load.ts's first rung).
      PANCAKE_LIB_DIR: /libs
      DENO_DIR: /deno-dir
      # Dial-by-node-id over n0 relays + DNS/pkarr (rooms-peer / cross-container).
      ROOMS_REACHABILITY: discovery
    volumes:
      # The TypeScript source and the prebuilt .so, both read-only mounts — neither
      # is baked into the image. Build the .so in the dev container first (above).
      - ../../../../..:/repo:ro
      - ../../../../../zig-out/lib:/libs:ro
      # A writable module cache, since the source mount is read-only.
      - rooms-deno-cache:/deno-dir
    restart: unless-stopped
    networks:
      - rooms-net
      - egress-net

networks:
  # Shared fabric with the pancake devcontainer: a bot there reaches this
  # container's internal CapTP over this network. Fixed name, external so both
  # compose projects use the one network (create it once with
  # `docker network create rooms-net`).
  rooms-net:
    name: rooms-net
    external: true
  # The tunnel network cloudflared reaches this container on for the public web
  # UI (:8000). Host-named via the gitignored .env (EGRESS_NET). The key below
  # is a compose alias, not the host network name.
  egress-net:
    name: ${EGRESS_NET:?Set EGRESS_NET in .env (see .env.example)}
    external: true

volumes:
  rooms-deno-cache:
