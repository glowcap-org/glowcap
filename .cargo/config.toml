# The pinned Rust toolchain supplies LLD. Native Linux links use it through
# the C compiler, which still owns platform startup objects and system libraries.
[target.aarch64-unknown-linux-gnu]
linker = ".devcontainer/bin/rust-linker.sh"

[target.x86_64-unknown-linux-gnu]
linker = ".devcontainer/bin/rust-linker.sh"
