<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 350"
  width="640"
  height="350"
  role="img"
  aria-label="Their program hands your program a reference to an object named greeter; holding it, you call its greet method."
>
  <style>text { font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
    .title { font-size: 15px; font-weight: 700; }
    .chip { font-size: 15px; font-weight: 700; }
    .sub { font-size: 13px; fill: var(--ink-soft, #6b5d4d); }
    .label { font-size: 14px; }

    /* Motion: one 9s loop. Phase 1 hands the reference across the top arc;
       phase 2 calls back along the bottom arc. Base styles are the finished
       static diagram, so with animation off nothing is missing. */
    .dot { visibility: hidden; }
    @supports (offset-path: path("M0 0 L1 1")) {
      .dot { visibility: visible; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .dot { visibility: hidden !important; }
    }

    .arc1 {
      stroke-dasharray: 266;
      stroke-dashoffset: 0;
      animation: cap-arc1 9s ease-in-out infinite;
    }
    @keyframes cap-arc1 {
      0%, 5% { stroke-dashoffset: 266; opacity: 0; }
      6% { opacity: 1; }
      27% { stroke-dashoffset: 0; }
      92% { opacity: 1; }
      97%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .arc2 {
      stroke-dasharray: 266;
      stroke-dashoffset: 0;
      animation: cap-arc2 9s ease-in-out infinite;
    }
    @keyframes cap-arc2 {
      0%, 48% { stroke-dashoffset: 266; opacity: 0; }
      49% { opacity: 1; }
      70% { stroke-dashoffset: 0; }
      92% { opacity: 1; }
      97%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .head1 { animation: cap-head1 9s ease-out infinite; }
    @keyframes cap-head1 {
      0%, 27% { opacity: 0; }
      30% { opacity: 1; }
      92% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    .head2 { animation: cap-head2 9s ease-out infinite; }
    @keyframes cap-head2 {
      0%, 70% { opacity: 0; }
      73% { opacity: 1; }
      92% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    .dot1 {
      offset-path: path("M440 118 C 400 58, 240 58, 200 118");
      animation: cap-dot1 9s ease-in-out infinite;
    }
    @keyframes cap-dot1 {
      0%, 5% { offset-distance: 0%; opacity: 0; }
      8% { opacity: 1; }
      24% { opacity: 1; }
      27%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .dot2 {
      offset-path: path("M200 252 C 240 312, 400 312, 440 252");
      animation: cap-dot2 9s ease-in-out infinite;
    }
    @keyframes cap-dot2 {
      0%, 48% { offset-distance: 0%; opacity: 0; }
      51% { opacity: 1; }
      67% { opacity: 1; }
      70%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .refchip { animation: cap-refchip 9s ease-out infinite; }
    @keyframes cap-refchip {
      0%, 28% { opacity: 0; transform: translate(0, 8px); }
      34% { opacity: 1; transform: translate(0, 0); }
      93% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    .greeterbox { animation: cap-greeterbox 9s ease-in-out infinite; }
    @keyframes cap-greeterbox {
      0%, 73% { stroke-width: 1; }
      76% { stroke-width: 3.2; }
      80%, 100% { stroke-width: 1; }
    }
    .lab1 { animation: cap-lab1 9s ease-in-out infinite; }
    @keyframes cap-lab1 {
      0%, 3% { opacity: 0.3; }
      7% { opacity: 1; }
      90% { opacity: 1; }
      96%, 100% { opacity: 0.3; }
    }
    .lab2 { animation: cap-lab2 9s ease-in-out infinite; }
    @keyframes cap-lab2 {
      0%, 44% { opacity: 0.3; }
      48% { opacity: 1; }
      90% { opacity: 1; }
      96%, 100% { opacity: 0.3; }
    }</style>

  <text
    x="320"
    y="50"
    text-anchor="middle"
    class="label lab1"
    fill="var(--accent-deep, #a4560c)"
  >1 &#8212; hands you the reference</text>

  <rect
    x="20"
    y="118"
    width="280"
    height="134"
    rx="16"
    fill="var(--dia-warm-fill, #fdf4e3)"
    stroke="var(--dia-warm-rule, #ead9bb)"
  >
  </rect>
  <rect
    x="340"
    y="118"
    width="280"
    height="134"
    rx="16"
    fill="var(--dia-cool-fill, #edf5f3)"
    stroke="var(--dia-cool-strong, #cfe4e1)"
  >
  </rect>
  <text x="44" y="146" class="title" fill="var(--accent-deep, #a4560c)">Your program</text>
  <text x="364" y="146" class="title" fill="var(--teal-deep, #1b5f66)">Their program</text>

  <g class="refchip">
    <rect
      x="50"
      y="166"
      width="220"
      height="62"
      rx="12"
      fill="var(--dia-card, #ffffff)"
      stroke="var(--accent, #c76f18)"
      stroke-dasharray="5 4"
    >
    </rect>
    <text
      x="160"
      y="193"
      text-anchor="middle"
      class="chip"
      fill="var(--accent-deep, #a4560c)"
    >Ref to greeter</text>
    <text x="160" y="213" text-anchor="middle" class="sub">a capability</text>
  </g>

  <rect
    class="greeterbox"
    x="370"
    y="166"
    width="220"
    height="62"
    rx="12"
    fill="var(--dia-card, #ffffff)"
    stroke="var(--teal, #257f88)"
  >
  </rect>
  <text
    x="480"
    y="193"
    text-anchor="middle"
    class="chip"
    fill="var(--teal-deep, #1b5f66)"
  >greeter</text>
  <text x="480" y="213" text-anchor="middle" class="sub">an object</text>

  <path
    class="arc1"
    d="M440 118 C 400 58, 240 58, 200 118"
    fill="none"
    stroke="var(--accent-deep, #a4560c)"
    stroke-width="2.2"
  >
  </path>
  <g class="head1" transform="translate(200 118) rotate(123.69) scale(1.21)">
    <path d="M-7.5 -5 L2.5 0 L-7.5 5 z" fill="var(--accent-deep, #a4560c)"></path>
  </g>
  <circle class="dot dot1" r="5" fill="var(--accent, #c76f18)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"></circle>

  <path
    class="arc2"
    d="M200 252 C 240 312, 400 312, 440 252"
    fill="none"
    stroke="var(--teal-deep, #1b5f66)"
    stroke-width="2.2"
  >
  </path>
  <g class="head2" transform="translate(440 252) rotate(-56.31) scale(1.21)">
    <path d="M-7.5 -5 L2.5 0 L-7.5 5 z" fill="var(--teal-deep, #1b5f66)"></path>
  </g>
  <circle class="dot dot2" r="5" fill="var(--teal, #257f88)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"></circle>

  <text
    x="320"
    y="330"
    text-anchor="middle"
    class="label lab2"
    fill="var(--teal-deep, #1b5f66)"
  >2 &#8212; you call greet("world")</text>
</svg>
