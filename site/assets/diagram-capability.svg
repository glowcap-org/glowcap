<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="Their program hands your program an unforgeable reference to an object named greeter; holding it, you call its greet method.">
  <defs>
    <marker id="cap-amber" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a4560c"></path>
    </marker>
    <marker id="cap-teal" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1b5f66"></path>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .title { font-size: 15px; font-weight: 700; }
    .chip { font-size: 15px; font-weight: 700; }
    .sub { font-size: 13px; fill: #6b5d4d; }
    .label { font-size: 14px; }
  </style>

  <path d="M500 118 C 460 58, 300 58, 260 118" fill="none" stroke="#a4560c" stroke-width="2.2" marker-end="url(#cap-amber)"></path>
  <text x="380" y="50" text-anchor="middle" class="label" fill="#a4560c">1 &#8212; hands you the reference</text>

  <rect x="80" y="118" width="280" height="134" rx="16" fill="#fdf4e3" stroke="#ead9bb"></rect>
  <rect x="400" y="118" width="280" height="134" rx="16" fill="#edf5f3" stroke="#cfe4e1"></rect>
  <text x="104" y="146" class="title" fill="#a4560c">Your program</text>
  <text x="424" y="146" class="title" fill="#1b5f66">Their program</text>

  <rect x="110" y="166" width="220" height="62" rx="12" fill="#ffffff" stroke="#c76f18" stroke-dasharray="5 4"></rect>
  <text x="220" y="193" text-anchor="middle" class="chip" fill="#a4560c">Ref to greeter</text>
  <text x="220" y="213" text-anchor="middle" class="sub">a capability</text>

  <rect x="430" y="166" width="220" height="62" rx="12" fill="#ffffff" stroke="#257f88"></rect>
  <text x="540" y="193" text-anchor="middle" class="chip" fill="#1b5f66">greeter</text>
  <text x="540" y="213" text-anchor="middle" class="sub">an object</text>

  <path d="M260 252 C 300 312, 460 312, 500 252" fill="none" stroke="#1b5f66" stroke-width="2.2" marker-end="url(#cap-teal)"></path>
  <text x="380" y="330" text-anchor="middle" class="label" fill="#1b5f66">2 &#8212; you call greet("world")</text>
</svg>
