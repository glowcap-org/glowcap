<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 372"
  width="760"
  height="372"
  role="img"
  aria-label="How two peers settle a version and codec. Each peer brings a preference-ordered menu: the CapTP versions and codecs it can speak, best first. Each side sees both menus, in hand when the peers share a process, or set by configuration on each side over a network, and both run the same rule, keeping the most-preferred version and codec the two share. The result, here glowcap-next over Cap'n Proto, is what op:start-session carries, with no extra round trip. If the two menus share no version or codec, no session opens."
>
  <defs>
    <marker
      id="neg-amber"
      viewBox="0 0 10 10"
      refX="7.5"
      refY="5"
      markerWidth="5"
      markerHeight="5"
      orient="auto-start-reverse"
    >
      <path d="M0 0L10 5L0 10z" fill="var(--accent-deep, #a4560c)"></path>
    </marker>
    <marker
      id="neg-teal"
      viewBox="0 0 10 10"
      refX="7.5"
      refY="5"
      markerWidth="5"
      markerHeight="5"
      orient="auto-start-reverse"
    >
      <path d="M0 0L10 5L0 10z" fill="var(--teal-deep, #1b5f66)"></path>
    </marker>
  </defs>
  <style>text { font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
    .node { font-size: 14px; font-weight: 700; }
    .label { font-size: 12.5px; }
    .small { font-size: 11.5px; }
    .muted { fill: var(--ink-soft, #6b5d4d); }
    .result { font-size: 14px; font-weight: 700; }</style>

  <rect
    x="24"
    y="24"
    width="320"
    height="96"
    rx="13"
    fill="var(--paper-raised, #fff9ee)"
    stroke="var(--accent, #c76f18)"
  >
  </rect>
  <text
    x="184"
    y="52"
    text-anchor="middle"
    class="node"
    fill="var(--accent-deep, #a4560c)"
  >glowcap A</text>
  <text
    x="184"
    y="78"
    text-anchor="middle"
    class="label muted"
  >versions: glowcap-next &#183; 1.0</text>
  <text
    x="184"
    y="100"
    text-anchor="middle"
    class="label muted"
  >codecs: Cap'n Proto &#183; Syrup</text>
  <text
    x="184"
    y="150"
    text-anchor="middle"
    class="small muted"
  >its menu, best first</text>

  <rect
    x="416"
    y="24"
    width="320"
    height="96"
    rx="13"
    fill="var(--paper-raised, #fff9ee)"
    stroke="var(--accent, #c76f18)"
  >
  </rect>
  <text
    x="576"
    y="52"
    text-anchor="middle"
    class="node"
    fill="var(--accent-deep, #a4560c)"
  >glowcap B</text>
  <text
    x="576"
    y="78"
    text-anchor="middle"
    class="label muted"
  >versions: glowcap-next &#183; 1.0</text>
  <text
    x="576"
    y="100"
    text-anchor="middle"
    class="label muted"
  >codecs: Cap'n Proto &#183; Syrup</text>
  <text
    x="576"
    y="150"
    text-anchor="middle"
    class="small muted"
  >in hand, or set by configuration</text>

  <path
    d="M184 164 C 184 202 200 230 242 230"
    fill="none"
    stroke="var(--accent-deep, #a4560c)"
    stroke-width="2"
    marker-end="url(#neg-amber)"
  >
  </path>
  <path
    d="M576 164 C 576 202 560 230 518 230"
    fill="none"
    stroke="var(--accent-deep, #a4560c)"
    stroke-width="2"
    marker-end="url(#neg-amber)"
  >
  </path>

  <rect
    x="248"
    y="204"
    width="264"
    height="64"
    rx="12"
    fill="var(--dia-cool-fill, #eef6f1)"
    stroke="var(--teal, #257f88)"
  >
  </rect>
  <text
    x="380"
    y="234"
    text-anchor="middle"
    class="node"
    fill="var(--teal-deep, #1b5f66)"
  >both run the same rule</text>
  <text
    x="380"
    y="255"
    text-anchor="middle"
    class="label muted"
  >keep what both share, best first</text>

  <path
    d="M380 268 L 380 294"
    fill="none"
    stroke="var(--teal-deep, #1b5f66)"
    stroke-width="2"
    marker-end="url(#neg-teal)"
  >
  </path>

  <rect
    x="192"
    y="300"
    width="376"
    height="66"
    rx="12"
    fill="var(--dia-cool-strong, #e3f0ee)"
    stroke="var(--teal, #257f88)"
  >
  </rect>
  <text
    x="380"
    y="330"
    text-anchor="middle"
    class="result"
    fill="var(--teal-deep, #1b5f66)"
  >glowcap-next &#183; Cap'n Proto</text>
  <text
    x="380"
    y="352"
    text-anchor="middle"
    class="label muted"
  >op:start-session carries the result</text>
</svg>
