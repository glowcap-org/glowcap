<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="Six layers from top to bottom. Peers such as Bob and Carol call over CapTP into your Host and Vat. The Host hands calls for durable objects to the Loam attachment, which wakes actors and saves their state before replying. The attachment uses the Store, which keeps records, transactions and a bounded cache, and decides every read and write without doing I/O. The Store hands read requests and write batches to your storage worker, which runs them on your threads against SQLite or LMDB, IndexedDB or memory.">
  <style>
    text { font-family: var(--font-sans, system-ui, sans-serif); fill: var(--ink, #3a3027); paint-order: stroke; stroke: var(--paper-raised, #fff9ee); stroke-width: 3px; stroke-linejoin: round; }
    .title { font-size: 14px; font-weight: 700; }
    .sub { font-size: 11.5px; fill: var(--ink-soft, #6b5d4d); }
    .tag { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .ink-warm { fill: var(--dia-accent-deep, #9d5209); }
    .ink-cool { fill: var(--dia-teal-deep, #1b5f66); }
    .flow { font-size: 11.5px; fill: var(--ink-soft, #6b5d4d); }
  </style>
  <defs>
    <marker id="ll-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-soft, #6b5d4d)"/>
    </marker>
  </defs>

  <!-- Six bands, 64 tall with 14 between, from y=12. Content column x=150..570. -->
  <rect x="150" y="12" width="420" height="60" rx="12" fill="var(--dia-card, #ffffff)" stroke="var(--rule, #e7d4b7)"/>
  <text x="360" y="37" text-anchor="middle" class="title">Peers</text>
  <text x="360" y="56" text-anchor="middle" class="sub">Bob holds a column, Carol keeps a sturdyref to the board</text>

  <rect x="150" y="88" width="420" height="60" rx="12" fill="var(--dia-card, #ffffff)" stroke="var(--rule, #e7d4b7)"/>
  <text x="360" y="113" text-anchor="middle" class="title">Host and Vat</text>
  <text x="360" y="132" text-anchor="middle" class="sub">the CapTP host you already run: sessions, turns, promises</text>

  <rect x="150" y="164" width="420" height="60" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--accent, #c76f18)" stroke-width="2"/>
  <text x="360" y="189" text-anchor="middle" class="title ink-warm">Loam attachment</text>
  <text x="360" y="208" text-anchor="middle" class="sub">wakes actors, saves their state before replying, serves durable names</text>

  <rect x="150" y="240" width="420" height="60" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--accent, #c76f18)" stroke-width="2"/>
  <text x="360" y="265" text-anchor="middle" class="title ink-warm">Store</text>
  <text x="360" y="284" text-anchor="middle" class="sub">records, transactions, a bounded cache; decides every read and write</text>

  <rect x="150" y="316" width="420" height="60" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--teal, #257f88)" stroke-width="2"/>
  <text x="360" y="341" text-anchor="middle" class="title ink-cool">Your storage worker</text>
  <text x="360" y="360" text-anchor="middle" class="sub">runs each read and write batch on threads you choose</text>

  <rect x="150" y="392" width="420" height="60" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--teal, #257f88)" stroke-width="2"/>
  <text x="360" y="417" text-anchor="middle" class="title ink-cool">Disk</text>
  <text x="360" y="436" text-anchor="middle" class="sub">SQLite or LMDB, IndexedDB in browsers, or memory</text>

  <!-- Left: what travels down and back up. -->
  <g stroke="var(--ink-soft, #6b5d4d)" stroke-width="1.5" fill="none">
    <path d="M120 42 L120 410" marker-end="url(#ll-ink)"/>
    <path d="M96 410 L96 42" marker-end="url(#ll-ink)"/>
  </g>
  <text x="128" y="160" class="flow" transform="rotate(90 128 160)">calls, then reads</text>
  <text x="88" y="330" class="flow" transform="rotate(-90 88 330)">records, then replies</text>

  <!-- Right: who owns each layer. -->
  <g fill="none" stroke-width="2">
    <path d="M584 164 Q596 164 596 176 L596 288 Q596 300 584 300" stroke="var(--accent, #c76f18)"/>
    <path d="M584 316 Q596 316 596 328 L596 440 Q596 452 584 452" stroke="var(--teal, #257f88)"/>
  </g>
  <text x="606" y="226" class="tag ink-warm">LOAM</text>
  <text x="606" y="244" class="sub">no threads,</text>
  <text x="606" y="259" class="sub">no I/O</text>
  <text x="606" y="378" class="tag ink-cool">YOUR CODE</text>
  <text x="606" y="396" class="sub">owns the I/O</text>
</svg>
