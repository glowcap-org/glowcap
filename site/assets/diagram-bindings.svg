<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 240"
  width="720"
  height="240"
  role="img"
  aria-label="One C ABI surface sits at the center, and the Rust, TypeScript, Python, and Racket bindings each wrap it in their own language's idioms."
>
  <style>text { font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
    .name { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: var(--ink-soft, #6b5d4d); }
    .core { font-size: 16px; font-weight: 700; }</style>

  <g stroke="var(--dia-warm-stroke, #c0a875)" stroke-width="2.5" fill="none">
    <path d="M215 84 L282 100"></path>
    <path d="M505 84 L438 100"></path>
    <path d="M215 156 L282 140"></path>
    <path d="M505 156 L438 140"></path>
  </g>

  <rect
    x="280"
    y="94"
    width="160"
    height="52"
    rx="13"
    fill="var(--dia-cool-fill, #eef6f1)"
    stroke="var(--teal, #257f88)"
    stroke-width="1.4"
  >
  </rect>
  <text
    x="360"
    y="116"
    text-anchor="middle"
    class="core"
    fill="var(--teal-deep, #1b5f66)"
  >C ABI</text>
  <text
    x="360"
    y="135"
    text-anchor="middle"
    class="sub"
  >composable archives</text>

  <rect
    x="40"
    y="28"
    width="170"
    height="52"
    rx="12"
    fill="var(--paper-raised, #fff9ee)"
    stroke="var(--accent, #c76f18)"
    stroke-width="1.4"
  >
  </rect>
  <text
    x="125"
    y="51"
    text-anchor="middle"
    class="name"
    fill="var(--accent-deep, #a4560c)"
  >Rust</text>
  <text x="125" y="69" text-anchor="middle" class="sub">typed enums</text>

  <rect
    x="510"
    y="28"
    width="170"
    height="52"
    rx="12"
    fill="var(--paper-raised, #fff9ee)"
    stroke="var(--accent, #c76f18)"
    stroke-width="1.4"
  >
  </rect>
  <text
    x="595"
    y="51"
    text-anchor="middle"
    class="name"
    fill="var(--accent-deep, #a4560c)"
  >TypeScript</text>
  <text x="595" y="69" text-anchor="middle" class="sub">JS promises</text>

  <rect
    x="40"
    y="160"
    width="170"
    height="52"
    rx="12"
    fill="var(--paper-raised, #fff9ee)"
    stroke="var(--accent, #c76f18)"
    stroke-width="1.4"
  >
  </rect>
  <text
    x="125"
    y="183"
    text-anchor="middle"
    class="name"
    fill="var(--accent-deep, #a4560c)"
  >Python</text>
  <text x="125" y="201" text-anchor="middle" class="sub">asyncio-first</text>

  <rect
    x="510"
    y="160"
    width="170"
    height="52"
    rx="12"
    fill="var(--paper-raised, #fff9ee)"
    stroke="var(--accent, #c76f18)"
    stroke-width="1.4"
  >
  </rect>
  <text
    x="595"
    y="183"
    text-anchor="middle"
    class="name"
    fill="var(--accent-deep, #a4560c)"
  >Racket</text>
  <text x="595" y="201" text-anchor="middle" class="sub">actor vocabulary</text>
</svg>
