<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="The room server gives a person and a bot the same room. Each joins through the room. The room then introduces the two to each other, and from then on they talk directly, with the room out of it.">
  <style>
    text { font-family: var(--font-sans, system-ui, sans-serif); fill: var(--ink, #3a3027); paint-order: stroke; stroke: var(--paper-raised, #fff9ee); stroke-width: 3px; stroke-linejoin: round; }
    .title { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12px; fill: var(--ink-soft, #6b5d4d); }
    .step { font-size: 12px; font-weight: 700; fill: var(--accent-deep, #9d5209); }
    .cap { font-size: 12px; font-weight: 700; fill: var(--teal-deep, #1b5f66); }
    .bead { visibility: hidden; }
    @supports (offset-path: path("M0 0 L1 1")) { .bead { visibility: visible; } }
    /* One 9s loop: the two joins ride the bus from the room to each peer,
       then the direct line draws itself solid and a bead crosses it. */
    .join-a { offset-path: path("M380 180 L380 210 L150 210 L150 236"); animation: rc-join-a 9s ease-in-out infinite; }
    .join-b { offset-path: path("M380 180 L380 210 L610 210 L610 236"); animation: rc-join-b 9s ease-in-out infinite; }
    .direct-bead { offset-path: path("M266 270 L494 270"); animation: rc-direct 9s ease-in-out infinite; }
    .direct-line { animation: rc-direct-line 9s ease-in-out infinite; }
    @keyframes rc-join-a {
      0%, 5% { offset-distance: 0%; opacity: 0; }
      8% { opacity: 1; }
      24% { offset-distance: 100%; opacity: 1; }
      27%, 100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes rc-join-b {
      0%, 17% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 1; }
      36% { offset-distance: 100%; opacity: 1; }
      39%, 100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes rc-direct {
      0%, 49% { offset-distance: 0%; opacity: 0; }
      53% { opacity: 1; }
      72% { offset-distance: 100%; opacity: 1; }
      76%, 100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes rc-direct-line {
      0%, 46% { opacity: 0.3; stroke-dasharray: 2 8; }
      55%, 88% { opacity: 1; stroke-dasharray: 8 0; }
      96%, 100% { opacity: 0.3; stroke-dasharray: 2 8; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .bead { visibility: hidden !important; }
      .direct-line { opacity: 1; stroke-dasharray: none; }
    }
  </style>
  <defs>
    <marker id="rc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #c76f18)"/>
    </marker>
    <marker id="rc-cool-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--teal, #257f88)"/>
    </marker>
  </defs>

  <!-- Row 1: the directory, the one object a page fetches first. -->
  <rect x="270" y="20" width="220" height="60" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--dia-cool-strong, #cfe4e1)"/>
  <text x="380" y="46" text-anchor="middle" class="title" fill="var(--teal-deep, #1b5f66)">room server</text>
  <text x="380" y="66" text-anchor="middle" class="sub">names, rooms, introductions</text>

  <path d="M380 80 L380 114" stroke="var(--accent, #c76f18)" stroke-width="2" marker-end="url(#rc-arrow)"/>

  <!-- Row 2: the room, answered as a live reference. -->
  <rect x="270" y="120" width="220" height="60" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--dia-warm-rule, #ead9bb)"/>
  <text x="380" y="146" text-anchor="middle" class="title" fill="var(--accent-deep, #9d5209)">#team-guide</text>
  <text x="380" y="166" text-anchor="middle" class="sub">the room and its seats</text>

  <!-- The bus: one drop from the room, one rail, one drop to each peer. -->
  <path d="M380 180 L380 210 M150 210 L610 210" fill="none" stroke="var(--accent, #c76f18)" stroke-width="2"/>
  <path d="M150 210 L150 234" stroke="var(--accent, #c76f18)" stroke-width="2" marker-end="url(#rc-arrow)"/>
  <path d="M610 210 L610 234" stroke="var(--accent, #c76f18)" stroke-width="2" marker-end="url(#rc-arrow)"/>
  <text x="265" y="203" text-anchor="middle" class="step">1&#8201;join</text>
  <text x="495" y="203" text-anchor="middle" class="step">2&#8201;join</text>

  <!-- Row 3: the two peers, each a Host with inbox objects of its own. -->
  <rect x="40" y="240" width="220" height="60" rx="12" fill="var(--paper-raised, #fff9ee)" stroke="var(--rule, #e7d4b7)"/>
  <text x="150" y="266" text-anchor="middle" class="title">Mira</text>
  <text x="150" y="286" text-anchor="middle" class="sub">her session, in a browser</text>
  <rect x="500" y="240" width="220" height="60" rx="12" fill="var(--paper-raised, #fff9ee)" stroke="var(--rule, #e7d4b7)"/>
  <text x="610" y="266" text-anchor="middle" class="title">The lead bot</text>
  <text x="610" y="286" text-anchor="middle" class="sub">a peer, in a terminal</text>

  <!-- The direct session, drawn between the peers at their own height. -->
  <path class="direct-line" d="M266 270 L494 270" fill="none" stroke="var(--teal, #257f88)" stroke-width="3" marker-start="url(#rc-cool-arrow)" marker-end="url(#rc-cool-arrow)"/>
  <text x="380" y="258" text-anchor="middle" class="cap">3&#8201;direct conversation</text>
  <text x="380" y="292" text-anchor="middle" class="sub">the room is out of it</text>

  <circle class="bead join-a" r="5" fill="var(--accent, #c76f18)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
  <circle class="bead join-b" r="5" fill="var(--accent, #c76f18)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
  <circle class="bead direct-bead" r="5" fill="var(--teal, #257f88)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
</svg>
