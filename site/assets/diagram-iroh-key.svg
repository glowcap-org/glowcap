<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 330"
  width="760"
  height="330"
  role="img"
  aria-label="One Ed25519 keypair fills three roles at once: the iroh node id that authenticates the QUIC channel, the locator designator you dial, and the session signing key, so the peer you dialed is the peer that signed."
>
  <style>text { font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
    .title { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: var(--ink-soft, #6b5d4d); }

    /* Motion: one 9s loop. The keypair pulses a ring and one role at a time
       lights up as its derivation arrow lands: node id, then designator, then
       signing key. Base styles are the finished static diagram. */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }

    .a1 {
      stroke-dasharray: 173;
      stroke-dashoffset: 0;
      animation: ik-a1 9s ease-in-out infinite;
    }
    @keyframes ik-a1 {
      0%, 8% { stroke-dashoffset: 173; opacity: 0; }
      9% { opacity: 1; }
      18% { stroke-dashoffset: 0; }
      92% { opacity: 1; }
      97%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .a2 {
      stroke-dasharray: 173;
      stroke-dashoffset: 0;
      animation: ik-a2 9s ease-in-out infinite;
    }
    @keyframes ik-a2 {
      0%, 28% { stroke-dashoffset: 173; opacity: 0; }
      29% { opacity: 1; }
      38% { stroke-dashoffset: 0; }
      92% { opacity: 1; }
      97%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .a3 {
      stroke-dasharray: 41;
      stroke-dashoffset: 0;
      animation: ik-a3 9s ease-in-out infinite;
    }
    @keyframes ik-a3 {
      0%, 48% { stroke-dashoffset: 41; opacity: 0; }
      49% { opacity: 1; }
      54% { stroke-dashoffset: 0; }
      92% { opacity: 1; }
      97%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .h1 { animation: ik-h1 9s ease-out infinite; }
    @keyframes ik-h1 {
      0%, 18% { opacity: 0; }
      21% { opacity: 1; }
      92% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    .h2 { animation: ik-h2 9s ease-out infinite; }
    @keyframes ik-h2 {
      0%, 38% { opacity: 0; }
      41% { opacity: 1; }
      92% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    .h3 { animation: ik-h3 9s ease-out infinite; }
    @keyframes ik-h3 {
      0%, 54% { opacity: 0; }
      57% { opacity: 1; }
      92% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    .role1 { animation: ik-role1 9s ease-in-out infinite; }
    @keyframes ik-role1 {
      0%, 18% { opacity: 0.35; }
      23% { opacity: 1; }
      93% { opacity: 1; }
      98%, 100% { opacity: 0.35; }
    }
    .role2 { animation: ik-role2 9s ease-in-out infinite; }
    @keyframes ik-role2 {
      0%, 38% { opacity: 0.35; }
      43% { opacity: 1; }
      93% { opacity: 1; }
      98%, 100% { opacity: 0.35; }
    }
    .role3 { animation: ik-role3 9s ease-in-out infinite; }
    @keyframes ik-role3 {
      0%, 54% { opacity: 0.35; }
      59% { opacity: 1; }
      93% { opacity: 1; }
      98%, 100% { opacity: 0.35; }
    }
    .ring {
      transform-box: fill-box;
      transform-origin: center;
    }
    .ring1 { animation: ik-ring1 9s ease-out infinite; }
    @keyframes ik-ring1 {
      0%, 8% { transform: scale(0.5); opacity: 0; }
      10% { opacity: 0.55; }
      20%, 100% { transform: scale(1.6); opacity: 0; }
    }
    .ring2 { animation: ik-ring2 9s ease-out infinite; }
    @keyframes ik-ring2 {
      0%, 28% { transform: scale(0.5); opacity: 0; }
      30% { opacity: 0.55; }
      40%, 100% { transform: scale(1.6); opacity: 0; }
    }
    .ring3 { animation: ik-ring3 9s ease-out infinite; }
    @keyframes ik-ring3 {
      0%, 48% { transform: scale(0.5); opacity: 0; }
      50% { opacity: 0.55; }
      60%, 100% { transform: scale(1.6); opacity: 0; }
    }</style>

  <circle class="ring ring1" cx="380" cy="169" r="46" fill="none" stroke="var(--teal, #257f88)" stroke-width="2" opacity="0"></circle>
  <circle class="ring ring2" cx="380" cy="169" r="46" fill="none" stroke="var(--teal, #257f88)" stroke-width="2" opacity="0"></circle>
  <circle class="ring ring3" cx="380" cy="169" r="46" fill="none" stroke="var(--teal, #257f88)" stroke-width="2" opacity="0"></circle>

  <g stroke="var(--dia-warm-stroke, #c0a875)" stroke-width="2.5" fill="none">
    <path class="a1" d="M330 139 L163 96"/>
    <path class="a2" d="M430 139 L597 96"/>
    <path class="a3" d="M380 203 L380 244"/>
  </g>
  <g class="h1" transform="translate(163 96) rotate(-165.56) scale(1.375)">
    <path d="M-8 -5 L2 0 L-8 5 z" fill="var(--dia-warm-stroke, #c0a875)"/>
  </g>
  <g class="h2" transform="translate(597 96) rotate(-14.44) scale(1.375)">
    <path d="M-8 -5 L2 0 L-8 5 z" fill="var(--dia-warm-stroke, #c0a875)"/>
  </g>
  <g class="h3" transform="translate(380 244) rotate(90) scale(1.375)">
    <path d="M-8 -5 L2 0 L-8 5 z" fill="var(--dia-warm-stroke, #c0a875)"/>
  </g>

  <g class="role1">
    <rect x="40" y="24" width="230" height="68" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--dia-warm-rule, #ead9bb)"/>
    <text x="155" y="52" text-anchor="middle" class="title" fill="var(--accent-deep, #a4560c)">iroh node id</text>
    <text x="155" y="74" text-anchor="middle" class="sub">authenticates the QUIC channel</text>
  </g>

  <g class="role2">
    <rect x="490" y="24" width="230" height="68" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--dia-warm-rule, #ead9bb)"/>
    <text x="605" y="52" text-anchor="middle" class="title" fill="var(--accent-deep, #a4560c)">locator designator</text>
    <text x="605" y="74" text-anchor="middle" class="sub">you dial: ocapn://&#8230;.iroh</text>
  </g>

  <rect x="290" y="135" width="180" height="68" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--dia-cool-strong, #cfe4e1)"/>
  <text x="380" y="163" text-anchor="middle" class="title" fill="var(--teal-deep, #1b5f66)">one Ed25519</text>
  <text x="380" y="183" text-anchor="middle" class="title" fill="var(--teal-deep, #1b5f66)">keypair</text>

  <g class="role3">
    <rect x="265" y="248" width="230" height="68" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--dia-warm-rule, #ead9bb)"/>
    <text x="380" y="276" text-anchor="middle" class="title" fill="var(--accent-deep, #a4560c)">session signing key</text>
    <text x="380" y="298" text-anchor="middle" class="sub">signs op:start-session</text>
  </g>
</svg>
