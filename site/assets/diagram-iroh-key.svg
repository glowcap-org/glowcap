<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 330"
  width="760"
  height="330"
  role="img"
  aria-label="One Ed25519 keypair fills three roles at once: the iroh node id that authenticates the QUIC channel, the locator designator you dial, and the session signing key, so the peer you dialed is the peer that signed."
>
  <style>text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .title { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #6b5d4d; }</style>

  <line x1="330" y1="139" x2="155" y2="92" stroke="#d8c19a" stroke-width="2"/>
  <line x1="430" y1="139" x2="605" y2="92" stroke="#d8c19a" stroke-width="2"/>
  <line x1="380" y1="203" x2="380" y2="248" stroke="#d8c19a" stroke-width="2"/>

  <rect x="40" y="24" width="230" height="68" rx="12" fill="#fdf4e3" stroke="#ead9bb"/>
  <text x="155" y="52" text-anchor="middle" class="title" fill="#a4560c">iroh node id</text>
  <text x="155" y="74" text-anchor="middle" class="sub">authenticates the QUIC channel</text>

  <rect x="490" y="24" width="230" height="68" rx="12" fill="#fdf4e3" stroke="#ead9bb"/>
  <text x="605" y="52" text-anchor="middle" class="title" fill="#a4560c">locator designator</text>
  <text x="605" y="74" text-anchor="middle" class="sub">the name you dial: ocapn://&#8230;.iroh</text>

  <rect x="290" y="135" width="180" height="68" rx="12" fill="#edf5f3" stroke="#cfe4e1"/>
  <text x="380" y="163" text-anchor="middle" class="title" fill="#1b5f66">one Ed25519</text>
  <text x="380" y="183" text-anchor="middle" class="title" fill="#1b5f66">keypair</text>

  <rect x="265" y="248" width="230" height="68" rx="12" fill="#fdf4e3" stroke="#ead9bb"/>
  <text x="380" y="276" text-anchor="middle" class="title" fill="#a4560c">session signing key</text>
  <text x="380" y="298" text-anchor="middle" class="sub">signs op:start-session</text>
</svg>
