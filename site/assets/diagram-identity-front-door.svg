<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Alice and a swarm of ten thousand bots both head for a service. A quick check runs before the service does any real work, and bots without a pass are turned away there. Alice gets through, shows the front door one proof, and leaves with her own key, which can post ten times a minute and can be switched off.">
  <style>
    text { font-family: var(--font-sans, system-ui, sans-serif); fill: var(--ink, #3a3027); paint-order: stroke; stroke: var(--paper-raised, #fff9ee); stroke-width: 3px; stroke-linejoin: round; }
    .title { font-size: 14px; font-weight: 700; }
    .sub { font-size: 11.5px; fill: var(--ink-soft, #6b5d4d); }
    .ink-warm { fill: var(--dia-accent-deep, #9d5209); }
    .ink-cool { fill: var(--dia-teal-deep, #1b5f66); }
    .ink-danger { fill: var(--dia-danger, #b3403a); }
    .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .result { font-size: 12.5px; font-weight: 700; }
    /* The finished picture is the end of the story: the bots refused at the
       edge and Alice holding her facet. */
    .bead { visibility: hidden; }
    @supports (offset-path: path("M0 0 L1 1")) { .bead { visibility: visible; } }
    /* One 10s loop: the bots arrive and stop, then Alice walks through. */
    .bot { offset-path: path("M170 214 L214 178"); }
    .bot-1 { animation: fd-bot 10s ease-in infinite; }
    .bot-2 { animation: fd-bot 10s ease-in 0.5s infinite; }
    .bot-3 { animation: fd-bot 10s ease-in 1s infinite; }
    @keyframes fd-bot {
      0% { offset-distance: 0%; opacity: 0; }
      3% { opacity: 1; }
      16% { offset-distance: 100%; opacity: 1; }
      19%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .refused { animation: fd-refused 10s ease-in-out infinite; }
    @keyframes fd-refused {
      0%, 22% { opacity: 0; }
      26%, 94% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    .walk { offset-path: path("M170 68 L214 128 L314 150 L560 150"); animation: fd-walk 10s ease-in-out infinite; }
    @keyframes fd-walk {
      0%, 32% { offset-distance: 0%; opacity: 0; }
      34% { opacity: 1; }
      44% { offset-distance: 38%; }
      52% { offset-distance: 60%; }
      64% { offset-distance: 100%; opacity: 1; }
      67%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .issued { animation: fd-issued 10s ease-in-out infinite; }
    @keyframes fd-issued {
      0%, 64% { opacity: 0; }
      68%, 94% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .bead { visibility: hidden !important; }
    }
  </style>
  <defs>
    <marker id="fd-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #c76f18)"/>
    </marker>
    <marker id="fd-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--dia-danger, #b3403a)"/>
    </marker>
    <marker id="fd-cool" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--teal, #257f88)"/>
    </marker>
  </defs>

  <!-- Who shows up. -->
  <rect x="20" y="40" width="150" height="56" rx="12" fill="var(--dia-card, #ffffff)" stroke="var(--rule, #e7d4b7)"/>
  <text x="95" y="64" text-anchor="middle" class="title">Alice</text>
  <text x="95" y="83" text-anchor="middle" class="sub">one person</text>
  <rect x="20" y="170" width="150" height="90" rx="12" fill="var(--dia-danger-fill, #f8e6e3)" stroke="var(--dia-danger-rule, #e3b9b3)"/>
  <text x="95" y="194" text-anchor="middle" class="title">10,000 bots</text>
  <g fill="var(--dia-danger, #b3403a)" opacity="0.55">
    <circle cx="50" cy="212" r="3"/><circle cx="64" cy="212" r="3"/><circle cx="78" cy="212" r="3"/><circle cx="92" cy="212" r="3"/><circle cx="106" cy="212" r="3"/><circle cx="120" cy="212" r="3"/><circle cx="134" cy="212" r="3"/>
    <circle cx="57" cy="226" r="3"/><circle cx="71" cy="226" r="3"/><circle cx="85" cy="226" r="3"/><circle cx="99" cy="226" r="3"/><circle cx="113" cy="226" r="3"/><circle cx="127" cy="226" r="3"/>
    <circle cx="50" cy="240" r="3"/><circle cx="64" cy="240" r="3"/><circle cx="78" cy="240" r="3"/><circle cx="92" cy="240" r="3"/><circle cx="106" cy="240" r="3"/><circle cx="120" cy="240" r="3"/><circle cx="134" cy="240" r="3"/>
  </g>

  <!-- The edge check: free to run, before any session. -->
  <rect x="214" y="110" width="100" height="80" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--accent, #c76f18)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="264" y="146" text-anchor="middle" class="title">quick check</text>
  <text x="264" y="165" text-anchor="middle" class="sub">almost free</text>
  <path d="M170 68 L214 126" stroke="var(--accent, #c76f18)" stroke-width="2" marker-end="url(#fd-warm)"/>
  <path d="M170 214 L212 180" stroke="var(--dia-danger, #b3403a)" stroke-width="2" marker-end="url(#fd-danger)"/>
  <g class="refused">
    <path d="M214 206 L223 215 M223 206 L214 215" stroke="var(--dia-danger, #b3403a)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="232" y="215" class="result ink-danger">no pass: turned away</text>
    <text x="232" y="232" class="sub">before any real work</text>
  </g>

  <!-- The front door: one proof, checked once. -->
  <text x="435" y="84" text-anchor="middle" class="sub">a payment, a sign-in,</text>
  <text x="435" y="99" text-anchor="middle" class="sub">a credential, or an introduction</text>
  <rect x="370" y="110" width="130" height="80" rx="12" fill="var(--dia-card, #ffffff)" stroke="var(--rule, #e7d4b7)" stroke-width="1.5"/>
  <text x="435" y="146" text-anchor="middle" class="title">front door</text>
  <text x="435" y="165" text-anchor="middle" class="sub">asks for one proof</text>
  <path d="M314 150 L366 150" stroke="var(--accent, #c76f18)" stroke-width="2" marker-end="url(#fd-warm)"/>

  <!-- What Alice leaves with. -->
  <rect x="560" y="110" width="140" height="80" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--teal, #257f88)" stroke-width="2"/>
  <text x="630" y="136" text-anchor="middle" class="title ink-cool">Alice's key</text>
  <text x="630" y="155" text-anchor="middle" class="sub">post, 10 a minute</text>
  <text x="630" y="172" text-anchor="middle" class="sub">can be switched off</text>
  <path d="M500 150 L556 150" stroke="var(--teal, #257f88)" stroke-width="2" marker-end="url(#fd-cool)"/>
  <g class="issued">
    <path d="M590 204 L594 208 L602 199" fill="none" stroke="var(--teal, #257f88)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="610" y="209" class="result ink-cool">handed out</text>
  </g>

  <!-- What each stage costs. -->
  <text x="95" y="284" text-anchor="middle" class="tag ink-warm">who shows up</text>
  <text x="264" y="284" text-anchor="middle" class="tag ink-warm">first</text>
  <text x="435" y="284" text-anchor="middle" class="tag ink-warm">checked once</text>
  <text x="630" y="284" text-anchor="middle" class="tag ink-cool">keys from here on</text>

  <circle class="bead bot bot-1" r="5" fill="var(--dia-danger, #b3403a)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
  <circle class="bead bot bot-2" r="5" fill="var(--dia-danger, #b3403a)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
  <circle class="bead bot bot-3" r="5" fill="var(--dia-danger, #b3403a)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
  <circle class="bead walk" r="5" fill="var(--accent, #c76f18)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
</svg>
