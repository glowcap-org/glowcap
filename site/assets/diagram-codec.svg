<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 30 760 290"
  width="760"
  height="290"
  role="img"
  aria-label="One message can be written on the wire two ways: Syrup as variable-length byte records, or Cap'n Proto as fixed 8-byte words. They look nothing alike, but either one decodes back to the same message view."
