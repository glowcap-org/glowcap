<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="The browser and the server both stand on one shared runtime. Under it, one crate holds the rules and one holds the glowcap clients, which stand on the glowcap protocol core. Only the two top crates and the platform crate touch a browser or an operating system.">
  <style>
    text { font-family: var(--font-sans, system-ui, sans-serif); fill: var(--ink, #3a3027); paint-order: stroke; stroke: var(--paper-raised, #fff9ee); stroke-width: 3px; stroke-linejoin: round; }
    .title { font-size: 14px; font-weight: 700; }
    .sub { font-size: 11.5px; fill: var(--ink-soft, #6b5d4d); }
    .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .bead { visibility: hidden; }
    @supports (offset-path: path("M0 0 L1 1")) { .bead { visibility: visible; } }
    /* One 7s loop: a bead from each consumer drops straight down its own
       column into the shared runtime, the host's a beat behind the browser's. */
    .browser-flow { offset-path: path("M200 94 L200 208"); animation: rl-flow 7s ease-in-out infinite; }
    .host-flow { offset-path: path("M560 94 L560 208"); animation: rl-flow 7s ease-in-out infinite 1.5s; }
    @keyframes rl-flow {
      0%, 4% { offset-distance: 0%; opacity: 0; }
      8% { opacity: 1; }
      60% { offset-distance: 100%; opacity: 1; }
      66%, 100% { offset-distance: 100%; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .bead { visibility: hidden !important; }
    }
  </style>
  <defs>
    <marker id="rl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #c76f18)"/>
    </marker>
    <marker id="rl-cool-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--teal, #257f88)"/>
    </marker>
  </defs>

  <!-- Two columns, 320 wide, centered at 200 and 560. Rows on a 90-unit pitch. -->
  <text x="200" y="22" text-anchor="middle" class="tag" fill="var(--accent-deep, #9d5209)">in the browser</text>
  <rect x="40" y="34" width="320" height="60" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--dia-warm-rule, #ead9bb)"/>
  <text x="200" y="59" text-anchor="middle" class="title">rooms-browser</text>
  <text x="200" y="79" text-anchor="middle" class="sub">Wasm entry, IndexedDB, WebRTC, presentation</text>

  <text x="560" y="22" text-anchor="middle" class="tag" fill="var(--teal-deep, #1b5f66)">on the server</text>
  <rect x="400" y="34" width="320" height="60" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--dia-cool-strong, #cfe4e1)"/>
  <text x="560" y="59" text-anchor="middle" class="title">rooms-services</text>
  <text x="560" y="79" text-anchor="middle" class="sub">directory, session, archive, web front, IRC</text>

  <!-- The host column has one more layer: the platform its effects run on. -->
  <path d="M560 94 L560 120" stroke="var(--teal, #257f88)" stroke-width="2" marker-end="url(#rl-cool-arrow)"/>
  <rect x="400" y="124" width="320" height="60" rx="12" fill="var(--paper-raised, #fff9ee)" stroke="var(--rule, #e7d4b7)"/>
  <text x="560" y="149" text-anchor="middle" class="title">rooms-platform</text>
  <text x="560" y="169" text-anchor="middle" class="sub">Tokio, clocks, entropy, files, sockets, TLS</text>

  <!-- Both columns drop straight into the one shared runtime. -->
  <path d="M200 94 L200 210" stroke="var(--accent, #c76f18)" stroke-width="2" marker-end="url(#rl-arrow)"/>
  <path d="M560 184 L560 210" stroke="var(--teal, #257f88)" stroke-width="2" marker-end="url(#rl-cool-arrow)"/>
  <rect x="40" y="214" width="680" height="60" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--teal, #257f88)" stroke-width="2"/>
  <text x="380" y="239" text-anchor="middle" class="title" fill="var(--teal-deep, #1b5f66)">rooms-runtime</text>
  <text x="380" y="259" text-anchor="middle" class="sub">the order work runs in, recovery, cleanup, what the screen shows</text>

  <!-- Under the runtime: policy on the left, the capability clients on the right. -->
  <path d="M200 274 L200 300" stroke="var(--accent, #c76f18)" stroke-width="2" marker-end="url(#rl-arrow)"/>
  <path d="M560 274 L560 300" stroke="var(--teal, #257f88)" stroke-width="2" marker-end="url(#rl-cool-arrow)"/>
  <rect x="40" y="304" width="320" height="60" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--accent, #c76f18)" stroke-width="2"/>
  <text x="200" y="329" text-anchor="middle" class="title" fill="var(--accent-deep, #9d5209)">rooms-application</text>
  <text x="200" y="349" text-anchor="middle" class="sub">no-I/O policy, intents, failures, schemas</text>
  <rect x="400" y="304" width="320" height="60" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--teal, #257f88)" stroke-width="2"/>
  <text x="560" y="329" text-anchor="middle" class="title" fill="var(--teal-deep, #1b5f66)">rooms-glowcap</text>
  <text x="560" y="349" text-anchor="middle" class="sub">capability clients, wire admission</text>
  <path d="M400 334 L366 334" stroke="var(--teal, #257f88)" stroke-width="2" marker-end="url(#rl-cool-arrow)"/>

  <path d="M560 364 L560 390" stroke="var(--teal, #257f88)" stroke-width="2" marker-end="url(#rl-cool-arrow)"/>
  <text x="560" y="410" text-anchor="middle" class="sub">glowcap protocol core, over the C ABI</text>

  <circle class="bead browser-flow" r="5" fill="var(--accent, #c76f18)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
  <circle class="bead host-flow" r="5" fill="var(--teal, #257f88)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
</svg>
