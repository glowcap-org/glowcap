<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 300"
  width="760"
  height="300"
  role="img"
  aria-label="A browser opens a WebSocket to the relay naming the peer it wants to reach; the relay dials that peer over tcp or iroh and pipes the two together. The keyed CapTP session runs end to end between the browser and the far peer, and the relay only moves bytes."
>
  <style>text { font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
    .head { font-size: 15px; font-weight: 700; }
    .label { font-size: 13.5px; }
    .sub { font-size: 11px; fill: var(--ink-soft, #6b5d4d); }
    .mono { font-family: var(--font-mono, ui-monospace, "SF Mono", "Cascadia Code", monospace); font-size: 12.5px; }

    /* Motion: one 11s loop. The ws opens, the relay dials onward, then the
       keyed session grows outward from the middle and bytes stream both ways
       through it. Base styles are the finished static diagram. */
    .dot { visibility: hidden; }
    @supports (offset-path: path("M0 0 L1 1")) {
      .dot { visibility: visible; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .dot { visibility: hidden !important; }
    }

    .ws {
      stroke-dasharray: 246;
      stroke-dashoffset: 0;
      animation: rd-ws 11s ease-in-out infinite;
    }
    @keyframes rd-ws {
      0%, 4% { stroke-dashoffset: 246; opacity: 0; }
      5% { opacity: 1; }
      15% { stroke-dashoffset: 0; }
      91% { opacity: 1; }
      96%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .head-ws { animation: rd-head-ws 11s ease-out infinite; }
    @keyframes rd-head-ws {
      0%, 15% { opacity: 0; }
      18% { opacity: 1; }
      91% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    .dot-ws {
      offset-path: path("M130 132 L 376 132");
      animation: rd-dot-ws 11s ease-in-out infinite;
    }
    @keyframes rd-dot-ws {
      0%, 4% { offset-distance: 0%; opacity: 0; }
      6% { opacity: 1; }
      13% { opacity: 1; }
      15%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .lab-ws { animation: rd-lab-ws 11s ease-in-out infinite; }
    @keyframes rd-lab-ws {
      0%, 4% { opacity: 0.25; }
      8% { opacity: 1; }
      90% { opacity: 1; }
      95%, 100% { opacity: 0.25; }
    }
    .box-relay { animation: rd-box-relay 11s ease-in-out infinite; }
    @keyframes rd-box-relay {
      0%, 15% { stroke-width: 1; }
      18% { stroke-width: 2.6; }
      22%, 100% { stroke-width: 1; }
    }
    .dial {
      stroke-dasharray: 246;
      stroke-dashoffset: 0;
      animation: rd-dial 11s ease-in-out infinite;
    }
    @keyframes rd-dial {
      0%, 24% { stroke-dashoffset: 246; opacity: 0; }
      25% { opacity: 1; }
      35% { stroke-dashoffset: 0; }
      91% { opacity: 1; }
      96%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .head-dial { animation: rd-head-dial 11s ease-out infinite; }
    @keyframes rd-head-dial {
      0%, 35% { opacity: 0; }
      38% { opacity: 1; }
      91% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    .dot-dial {
      offset-path: path("M380 172 L 626 172");
      animation: rd-dot-dial 11s ease-in-out infinite;
    }
    @keyframes rd-dot-dial {
      0%, 24% { offset-distance: 0%; opacity: 0; }
      26% { opacity: 1; }
      33% { opacity: 1; }
      35%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .lab-dial { animation: rd-lab-dial 11s ease-in-out infinite; }
    @keyframes rd-lab-dial {
      0%, 24% { opacity: 0.25; }
      28% { opacity: 1; }
      90% { opacity: 1; }
      95%, 100% { opacity: 0.25; }
    }
    .box-far { animation: rd-box-far 11s ease-in-out infinite; }
    @keyframes rd-box-far {
      0%, 35% { stroke-width: 1; }
      38% { stroke-width: 2.6; }
      42%, 100% { stroke-width: 1; }
    }
    /* The keyed session grows outward from the relay's midpoint: one channel,
       end to end, that the relay never parses. */
    .sess {
      stroke-dasharray: 496 496;
      stroke-dashoffset: 0;
      animation: rd-sess 11s ease-in-out infinite;
    }
    @keyframes rd-sess {
      0%, 44% { stroke-dasharray: 0 496; stroke-dashoffset: 248; opacity: 1; }
      52% { stroke-dasharray: 496 496; stroke-dashoffset: 0; }
      92% { opacity: 1; }
      97%, 100% { stroke-dasharray: 496 496; stroke-dashoffset: 0; opacity: 0; }
    }
    .head-sess { animation: rd-head-sess 11s ease-out infinite; }
    @keyframes rd-head-sess {
      0%, 52% { opacity: 0; }
      55% { opacity: 1; }
      92% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    .lab-sess { animation: rd-lab-sess 11s ease-in-out infinite; }
    @keyframes rd-lab-sess {
      0%, 46% { opacity: 0.25; }
      52% { opacity: 1; }
      90% { opacity: 1; }
      96%, 100% { opacity: 0.25; }
    }
    .sub-sess { animation: rd-sub-sess 11s ease-in-out infinite; }
    @keyframes rd-sub-sess {
      0%, 54% { opacity: 0; }
      60% { opacity: 1; }
      92% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }
    .stream { animation: rd-stream 11s ease-in-out infinite; }
    @keyframes rd-stream {
      0%, 54% { opacity: 0; }
      58% { opacity: 1; }
      93% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }
    .flow-right {
      offset-path: path("M132 248 L 628 248");
      animation: rd-flow 2.6s linear infinite;
    }
    .flow-left {
      offset-path: path("M628 248 L 132 248");
      animation: rd-flow 2.6s linear infinite;
    }
    .flow-b { animation-delay: -1.3s; }
    .flow-c { animation-delay: -0.65s; }
    .flow-d { animation-delay: -1.95s; }
    @keyframes rd-flow {
      from { offset-distance: 0%; }
      to { offset-distance: 100%; }
    }</style>

  <line x1="130" y1="100" x2="130" y2="288" stroke="var(--rule, #e7d4b7)" stroke-width="2"></line>
  <line x1="380" y1="100" x2="380" y2="288" stroke="var(--rule, #e7d4b7)" stroke-width="2"></line>
  <line x1="630" y1="100" x2="630" y2="288" stroke="var(--rule, #e7d4b7)" stroke-width="2"></line>

  <rect x="55" y="24" width="150" height="44" rx="11" fill="var(--paper-raised, #fff9ee)" stroke="var(--accent, #c76f18)"></rect>
  <text x="130" y="51" text-anchor="middle" class="head" fill="var(--accent-deep, #a4560c)">browser peer</text>
  <text x="130" y="86" text-anchor="middle" class="sub">no socket of its own</text>

  <rect class="box-relay" x="305" y="24" width="150" height="44" rx="11" fill="var(--dia-warm-fill, #faf3e7)" stroke="var(--dia-muted, #8a7862)"></rect>
  <text x="380" y="51" text-anchor="middle" class="head" fill="var(--ink-soft, #6b5d4d)">relay</text>
  <text x="380" y="86" text-anchor="middle" class="sub">byte pipe, holds nothing</text>

  <rect class="box-far" x="555" y="24" width="150" height="44" rx="11" fill="var(--dia-cool-fill, #f1f7f6)" stroke="var(--teal, #257f88)"></rect>
  <text x="630" y="51" text-anchor="middle" class="head" fill="var(--teal-deep, #1b5f66)">far peer</text>
  <text x="630" y="86" text-anchor="middle" class="sub">tcp / iroh listener</text>

  <path class="ws" d="M130 132 L 376 132" fill="none" stroke="var(--accent-deep, #a4560c)" stroke-width="2"></path>
  <g class="head-ws" transform="translate(376 132)">
    <path d="M-7.5 -5 L2.5 0 L-7.5 5 z" fill="var(--accent-deep, #a4560c)"></path>
  </g>
  <circle class="dot dot-ws" r="4.5" fill="var(--accent, #c76f18)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"></circle>
  <text x="253" y="124" text-anchor="middle" class="label lab-ws" fill="var(--accent-deep, #a4560c)">open ws <tspan class="mono">?target=&lt;locator&gt;</tspan></text>

  <path class="dial" d="M380 172 L 626 172" fill="none" stroke="var(--dia-muted, #8a7862)" stroke-width="2"></path>
  <g class="head-dial" transform="translate(626 172)">
    <path d="M-7.5 -5 L2.5 0 L-7.5 5 z" fill="var(--dia-muted, #8a7862)"></path>
  </g>
  <circle class="dot dot-dial" r="4.5" fill="var(--dia-muted, #8a7862)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"></circle>
  <text x="503" y="164" text-anchor="middle" class="label lab-dial" fill="var(--ink-soft, #6b5d4d)">dial <tspan class="mono">tcp / iroh</tspan></text>

  <path class="sess" d="M132 248 L 628 248" fill="none" stroke="var(--teal-deep, #1b5f66)" stroke-width="2.5"></path>
  <g class="head-sess" transform="translate(132 248) rotate(180) scale(1.25)">
    <path d="M-7.5 -5 L2.5 0 L-7.5 5 z" fill="var(--teal-deep, #1b5f66)"></path>
  </g>
  <g class="head-sess" transform="translate(628 248) scale(1.25)">
    <path d="M-7.5 -5 L2.5 0 L-7.5 5 z" fill="var(--teal-deep, #1b5f66)"></path>
  </g>
  <g class="stream">
    <circle class="dot flow-right" r="3.5" fill="var(--teal-deep, #1b5f66)" stroke="var(--paper, #fff3df)" stroke-width="1.5"></circle>
    <circle class="dot flow-right flow-b" r="3.5" fill="var(--teal-deep, #1b5f66)" stroke="var(--paper, #fff3df)" stroke-width="1.5"></circle>
    <circle class="dot flow-left flow-c" r="3.5" fill="var(--teal-deep, #1b5f66)" stroke="var(--paper, #fff3df)" stroke-width="1.5"></circle>
    <circle class="dot flow-left flow-d" r="3.5" fill="var(--teal-deep, #1b5f66)" stroke="var(--paper, #fff3df)" stroke-width="1.5"></circle>
  </g>
  <text x="380" y="240" text-anchor="middle" class="label lab-sess" fill="var(--teal-deep, #1b5f66)">keyed CapTP session, carried byte for byte</text>
  <text x="380" y="272" text-anchor="middle" class="sub sub-sess">the relay never parses a frame or holds a capability</text>
</svg>
