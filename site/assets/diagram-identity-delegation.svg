<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-label="Alice gives her agent a key that reads and posts, and the agent gives a helper a key that only reads. The helper reads the chat room, and the request traces back to Alice's key. Alice switches off the agent's key. The helper's next read is refused, because its key came from the agent's, and Alice still posts as herself.">
  <style>
    text { font-family: var(--font-sans, system-ui, sans-serif); fill: var(--ink, #3a3027); paint-order: stroke; stroke: var(--paper-raised, #fff9ee); stroke-width: 3px; stroke-linejoin: round; }
    .title { font-size: 14px; font-weight: 700; }
    .sub { font-size: 11.5px; fill: var(--ink-soft, #6b5d4d); }
    .ink-warm { fill: var(--dia-accent-deep, #9d5209); }
    .ink-cool { fill: var(--dia-teal-deep, #1b5f66); }
    .ink-danger { fill: var(--dia-danger, #b3403a); }
    .on-fill { fill: var(--on-accent, #fff8ef); stroke: none; }
    .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .result { font-size: 12.5px; font-weight: 700; }
    /* The finished picture is the end of the story: the agent's grant
       revoked, the helper refused, and Alice still posting. The "active"
       chip only shows while the loop plays. */
    .active { opacity: 0; animation: dg-active 12s ease-in-out infinite; }
    @keyframes dg-active {
      0%, 46% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    .bead { visibility: hidden; }
    @supports (offset-path: path("M0 0 L1 1")) { .bead { visibility: visible; } }
    /* One 12s loop: the helper reads, Alice revokes the agent, the helper
       reads again, and Alice posts. */
    .read-1 { offset-path: path("M560 110 L444 209"); animation: dg-read-1 12s ease-in-out infinite; }
    @keyframes dg-read-1 {
      0%, 4% { offset-distance: 0%; opacity: 0; }
      6% { opacity: 1; }
      20% { offset-distance: 100%; opacity: 1; }
      23%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .allowed { animation: dg-allowed 12s ease-in-out infinite; }
    @keyframes dg-allowed {
      0%, 20% { opacity: 0; }
      24%, 94% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    .revoke { offset-path: path("M180 75 L276 75"); animation: dg-revoke 12s ease-in-out infinite; }
    @keyframes dg-revoke {
      0%, 34% { offset-distance: 0%; opacity: 0; }
      36% { opacity: 1; }
      46% { offset-distance: 100%; opacity: 1; }
      49%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .revoked { animation: dg-revoked 12s ease-in-out infinite; }
    @keyframes dg-revoked {
      0%, 46% { opacity: 0; }
      49%, 94% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    .read-2 { offset-path: path("M620 110 L560 148"); animation: dg-read-2 12s ease-in-out infinite; }
    @keyframes dg-read-2 {
      0%, 56% { offset-distance: 0%; opacity: 0; }
      58% { opacity: 1; }
      66% { offset-distance: 100%; opacity: 1; }
      69%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .refused { animation: dg-refused 12s ease-in-out infinite; }
    @keyframes dg-refused {
      0%, 66% { opacity: 0; }
      70%, 94% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    .post { offset-path: path("M160 110 L276 209"); animation: dg-post 12s ease-in-out infinite; }
    @keyframes dg-post {
      0%, 72% { offset-distance: 0%; opacity: 0; }
      74% { opacity: 1; }
      86% { offset-distance: 100%; opacity: 1; }
      89%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .still { animation: dg-still 12s ease-in-out infinite; }
    @keyframes dg-still {
      0%, 86% { opacity: 0; }
      89%, 94% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .bead { visibility: hidden !important; }
    }
  </style>
  <defs>
    <marker id="dg-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #c76f18)"/>
    </marker>
    <marker id="dg-cool" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--teal, #257f88)"/>
    </marker>
  </defs>

  <!-- The chain of grants, each narrower than the last. -->
  <text x="360" y="22" text-anchor="middle" class="tag ink-warm">each key weaker than the one before</text>
  <rect x="20" y="40" width="160" height="70" rx="12" fill="var(--dia-card, #ffffff)" stroke="var(--rule, #e7d4b7)"/>
  <text x="100" y="68" text-anchor="middle" class="title">Alice</text>
  <text x="100" y="88" text-anchor="middle" class="sub">full access</text>
  <rect x="280" y="40" width="160" height="70" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--teal, #257f88)" stroke-width="2"/>
  <text x="360" y="68" text-anchor="middle" class="title ink-cool">Alice's agent</text>
  <text x="360" y="88" text-anchor="middle" class="sub">reads and posts</text>
  <rect x="540" y="40" width="160" height="70" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--teal, #257f88)" stroke-width="2"/>
  <text x="620" y="68" text-anchor="middle" class="title ink-cool">the agent's helper</text>
  <text x="620" y="88" text-anchor="middle" class="sub">only reads</text>
  <path d="M180 75 L276 75" stroke="var(--accent, #c76f18)" stroke-width="2" marker-end="url(#dg-warm)"/>
  <text x="228" y="66" text-anchor="middle" class="sub">gives a key</text>
  <path d="M440 75 L536 75" stroke="var(--teal, #257f88)" stroke-width="2" marker-end="url(#dg-cool)"/>
  <text x="488" y="66" text-anchor="middle" class="sub">gives a key</text>

  <g class="active">
    <rect x="320" y="118" width="80" height="22" rx="11" fill="var(--teal, #257f88)"/>
    <text x="360" y="133" text-anchor="middle" class="sub on-fill">active</text>
  </g>
  <g class="revoked">
    <rect x="320" y="118" width="80" height="22" rx="11" fill="var(--dia-danger, #b3403a)"/>
    <text x="360" y="133" text-anchor="middle" class="sub on-fill">switched off</text>
  </g>

  <!-- The service everyone is talking to, and the two holders that reach it. -->
  <path d="M160 110 L280 212 M560 110 L440 212" stroke="var(--rule, #e7d4b7)" stroke-width="1.5" stroke-dasharray="4 5" fill="none"/>
  <rect x="280" y="200" width="160" height="70" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--dia-warm-rule, #ead9bb)"/>
  <text x="360" y="228" text-anchor="middle" class="title">the chat room</text>
  <text x="360" y="248" text-anchor="middle" class="sub">traces every request</text>
  <text x="360" y="262" text-anchor="middle" class="sub">back to Alice's key</text>

  <!-- What happens to each request. -->
  <g class="allowed">
    <path d="M552 150 L556 154 L564 145" fill="none" stroke="var(--teal, #257f88)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="572" y="155" class="result ink-cool">read: allowed</text>
  </g>
  <g class="refused">
    <path d="M553 166 L562 175 M562 166 L553 175" stroke="var(--dia-danger, #b3403a)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="572" y="175" class="result ink-danger">read again: refused</text>
  </g>
  <g class="still">
    <path d="M40 150 L44 154 L52 145" fill="none" stroke="var(--teal, #257f88)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="155" class="result ink-cool">Alice still posts</text>
  </g>

  <circle class="bead read-1" r="5" fill="var(--teal, #257f88)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
  <circle class="bead revoke" r="5" fill="var(--dia-danger, #b3403a)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
  <circle class="bead read-2" r="5" fill="var(--teal, #257f88)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
  <circle class="bead post" r="5" fill="var(--accent, #c76f18)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
</svg>
