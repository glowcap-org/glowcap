<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Bob calls a sleeping card. The Host admits the call to Loam, which requests a storage read. The card's behavior proposes new state. The storage worker commits it before the reply travels back to Bob.">
  <style>
    text { font-family: var(--font-sans, system-ui, sans-serif); fill: var(--ink, #3a3027); paint-order: stroke; stroke: var(--paper-raised, #fff9ee); stroke-width: 3px; stroke-linejoin: round; }
    .title { font-size: 14px; font-weight: 700; }
    .sub { font-size: 11.5px; fill: var(--ink-soft, #6b5d4d); }
    .ink-warm { fill: var(--dia-accent-deep, #9d5209); }
    .ink-cool { fill: var(--dia-teal-deep, #1b5f66); }
    .step { font-size: 12.5px; }
    .note { font-size: 12.5px; font-weight: 700; }
    .num { font-weight: 700; fill: var(--dia-accent-deep, #9d5209); }
    .bead { visibility: hidden; }
    @supports (offset-path: path("M0 0 L1 1")) { .bead { visibility: visible; } }
    /* One 12s loop: one call's bead walks the whole exchange, down each
       lifeline between steps, and the commit-then-reply note lights as the
       bead turns for home. */
    .call {
      offset-path: path("M95 112 L275 112 L275 148 L455 148 L455 184 L635 184 L635 220 L455 220 L455 292 L635 292 L635 328 L455 328 L455 372 L95 372");
      animation: lw-call 12s linear infinite;
    }
    @keyframes lw-call {
      0%, 3% { offset-distance: 0%; opacity: 0; }
      5% { opacity: 1; }
      86% { offset-distance: 100%; opacity: 1; }
      90%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .commit-note { animation: lw-note 12s ease-in-out infinite; }
    @keyframes lw-note {
      0%, 62% { opacity: 0.35; }
      67%, 92% { opacity: 1; }
      97%, 100% { opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .bead { visibility: hidden !important; }
    }
  </style>
  <defs>
    <marker id="lw-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #c76f18)"/>
    </marker>
    <marker id="lw-cool" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--teal, #257f88)"/>
    </marker>
  </defs>

  <!-- Four lanes, 160 wide, centered at 95, 275, 455, 635. -->
  <rect x="15" y="20" width="160" height="56" rx="12" fill="var(--dia-card, #ffffff)" stroke="var(--rule, #e7d4b7)"/>
  <text x="95" y="44" text-anchor="middle" class="title">Bob</text>
  <text x="95" y="63" text-anchor="middle" class="sub">holds a reference</text>
  <rect x="195" y="20" width="160" height="56" rx="12" fill="var(--dia-card, #ffffff)" stroke="var(--rule, #e7d4b7)"/>
  <text x="275" y="44" text-anchor="middle" class="title">Host and Vat</text>
  <text x="275" y="63" text-anchor="middle" class="sub">your CapTP host</text>
  <rect x="375" y="20" width="160" height="56" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--accent, #c76f18)" stroke-width="2"/>
  <text x="455" y="44" text-anchor="middle" class="title ink-warm">Loam core</text>
  <text x="455" y="63" text-anchor="middle" class="sub">decides, does no I/O</text>
  <rect x="555" y="20" width="160" height="56" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--teal, #257f88)" stroke-width="2"/>
  <text x="635" y="44" text-anchor="middle" class="title ink-cool">Storage worker</text>
  <text x="635" y="63" text-anchor="middle" class="sub">runs the storage engine</text>

  <g stroke="var(--rule, #e7d4b7)" stroke-width="1.5" stroke-dasharray="3 5">
    <path d="M95 76 L95 392"/>
    <path d="M275 76 L275 392"/>
    <path d="M455 76 L455 392"/>
    <path d="M635 76 L635 392"/>
  </g>

  <!-- 1. The call arrives for a sleeping actor. -->
  <path d="M95 112 L269 112" stroke="var(--accent, #c76f18)" stroke-width="2" marker-end="url(#lw-warm)"/>
  <text x="185" y="104" text-anchor="middle" class="step"><tspan class="num">1</tspan> call a card</text>
  <path d="M275 148 L449 148" stroke="var(--accent, #c76f18)" stroke-width="2" marker-end="url(#lw-warm)"/>
  <text x="365" y="140" text-anchor="middle" class="step"><tspan class="num">2</tspan> admit: it is asleep</text>

  <!-- 2. Its state comes off disk. -->
  <path d="M455 184 L629 184" stroke="var(--teal, #257f88)" stroke-width="2" marker-end="url(#lw-cool)"/>
  <text x="545" y="176" text-anchor="middle" class="step"><tspan class="num">3</tspan> read its record</text>
  <path d="M635 220 L461 220" stroke="var(--teal, #257f88)" stroke-width="2" marker-end="url(#lw-cool)"/>
  <text x="545" y="212" text-anchor="middle" class="step"><tspan class="num">4</tspan> record bytes</text>

  <!-- 3. The behavior runs and proposes new state. -->
  <rect x="380" y="230" width="150" height="40" rx="10" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--accent, #c76f18)"/>
  <text x="455" y="246" text-anchor="middle" class="step"><tspan class="num">5</tspan> its code runs,</text>
  <text x="455" y="262" text-anchor="middle" class="step">proposes new state</text>

  <!-- 4. The write commits. -->
  <path d="M455 292 L629 292" stroke="var(--teal, #257f88)" stroke-width="2" marker-end="url(#lw-cool)"/>
  <text x="545" y="286" text-anchor="middle" class="step"><tspan class="num">6</tspan> write batch</text>
  <path d="M635 328 L461 328" stroke="var(--teal, #257f88)" stroke-width="2" marker-end="url(#lw-cool)"/>
  <text x="545" y="320" text-anchor="middle" class="step"><tspan class="num">7</tspan> committed</text>

  <!-- 5. Only now does the answer leave. -->
  <path d="M455 372 L101 372" stroke="var(--accent, #c76f18)" stroke-width="2.5" marker-end="url(#lw-warm)"/>
  <text x="275" y="364" text-anchor="middle" class="note commit-note ink-warm"><tspan class="num">8</tspan> reply, only after the commit</text>


  <circle class="bead call" r="5" fill="var(--accent, #c76f18)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
</svg>
