<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 320"
  width="720"
  height="320"
  role="img"
  aria-label="glowcap is one library held three ways: a Zig package that imports the core directly, a C ABI that C and FFI hosts call, and four bindings that wrap that same C ABI, all sharing one Zig core, so the surface you choose never changes what a session puts on the wire."
>
  <defs>
    <marker
      id="surf-arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="5.5"
      markerHeight="5.5"
      orient="auto-start-reverse"
    >
      <path d="M0 0L10 5L0 10z" fill="var(--dia-warm-stroke, #c0a875)"></path>
    </marker>
  </defs>
  <style>text { font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
    .name { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: var(--ink-soft, #6b5d4d); }
    .core { font-size: 16px; font-weight: 700; }</style>

  <g stroke="var(--dia-warm-stroke, #c0a875)" stroke-width="2.5" fill="none">
    <path d="M160 102 L 160 248" marker-end="url(#surf-arrow)"></path>
    <path d="M380 102 L 380 156" marker-end="url(#surf-arrow)"></path>
    <path d="M580 102 L 580 156" marker-end="url(#surf-arrow)"></path>
    <path d="M480 210 L 480 248" marker-end="url(#surf-arrow)"></path>
  </g>

  <rect
    x="60"
    y="44"
    width="200"
    height="58"
    rx="12"
    fill="var(--paper-raised, #fff9ee)"
    stroke="var(--accent, #c76f18)"
    stroke-width="1.4"
  >
  </rect>
  <text
    x="160"
    y="74"
    text-anchor="middle"
    class="name"
    fill="var(--accent-deep, #a4560c)"
  >Zig package</text>
  <text x="160" y="92" text-anchor="middle" class="sub">import the module</text>

  <rect
    x="300"
    y="44"
    width="160"
    height="58"
    rx="12"
    fill="var(--paper-raised, #fff9ee)"
    stroke="var(--accent, #c76f18)"
    stroke-width="1.4"
  >
  </rect>
  <text
    x="380"
    y="74"
    text-anchor="middle"
    class="name"
    fill="var(--accent-deep, #a4560c)"
  >C / FFI host</text>
  <text
    x="380"
    y="92"
    text-anchor="middle"
    class="sub"
  >call glowcap_ocapn.h</text>

  <rect
    x="500"
    y="44"
    width="160"
    height="58"
    rx="12"
    fill="var(--paper-raised, #fff9ee)"
    stroke="var(--accent, #c76f18)"
    stroke-width="1.4"
  >
  </rect>
  <text
    x="580"
    y="74"
    text-anchor="middle"
    class="name"
    fill="var(--accent-deep, #a4560c)"
  >Bindings</text>
  <text x="580" y="92" text-anchor="middle" class="sub">wrap the C ABI</text>

  <rect
    x="300"
    y="162"
    width="360"
    height="48"
    rx="12"
    fill="var(--dia-cool-fill, #f1f7f6)"
    stroke="var(--teal, #257f88)"
    stroke-width="1.4"
  >
  </rect>
  <text
    x="480"
    y="186"
    text-anchor="middle"
    class="name"
    fill="var(--teal-deep, #1b5f66)"
  >C ABI</text>
  <text
    x="480"
    y="203"
    text-anchor="middle"
    class="sub"
  >composable archives, linked &#224; la carte</text>

  <rect
    x="60"
    y="254"
    width="600"
    height="56"
    rx="14"
    fill="var(--dia-cool-fill, #eef6f1)"
    stroke="var(--teal, #257f88)"
    stroke-width="1.6"
  >
  </rect>
  <text
    x="360"
    y="282"
    text-anchor="middle"
    class="core"
    fill="var(--teal-deep, #1b5f66)"
  >glowcap</text>
  <text
    x="360"
    y="300"
    text-anchor="middle"
    class="sub"
  >one Zig core &#183; same wire on every surface</text>
</svg>
