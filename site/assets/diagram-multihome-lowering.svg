<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 430"
  width="760"
  height="430"
  role="img"
  aria-label="Three partners, three outcomes. A partner that negotiated the pancake-next multi_location feature receives the id bundle intact. A baseline partner such as Goblins receives one concrete route it can dial, with the private vocabulary stripped. A baseline partner with no route it could dial gets nothing: the give is refused before send."
>
  <style>text { font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); paint-order: stroke; stroke: var(--paper, #fff3df); stroke-width: 3.5px; stroke-linejoin: round; }
    .title { font-size: 14px; font-weight: 700; fill: var(--ink, #3a3027); }
    .sub { font-size: 12px; fill: var(--ink-soft, #6b5d4d); }
    .chip { font-size: 12.5px; font-weight: 700; fill: var(--ink, #3a3027); }
    .mono { font-family: var(--font-mono, ui-monospace, "SF Mono", "Cascadia Code", monospace); font-size: 12px; font-weight: 600; }
    .ok { font-size: 12px; font-weight: 600; fill: var(--teal-deep, #1b5f66); }
    .warn { font-size: 12px; font-weight: 600; fill: var(--accent-deep, #a4560c); }
    .dead { font-size: 12px; font-weight: 600; fill: var(--dia-muted, #8a7862); }</style>

  <!-- Row 1: both sessions negotiated the route vocabulary -->
  <text x="24" y="34" class="title">negotiated pancake-next</text>
  <text x="212" y="34" class="ok">multi_location on both sessions</text>
  <rect x="24" y="52" width="110" height="52" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--dia-cool-strong, #cfe4e1)"/>
  <text x="79" y="82" text-anchor="middle" class="chip">you</text>
  <path d="M140 78 H 380" fill="none" stroke="var(--teal, #257f88)" stroke-width="2.4"/>
  <g transform="translate(380 78)">
    <path d="M-7.5 -5 L2.5 0 L-7.5 5 z" fill="var(--teal, #257f88)" stroke="none"/>
  </g>
  <text x="260" y="68" text-anchor="middle" class="mono" fill="var(--teal-deep, #1b5f66)">ocapn://b7ke&#8230;.id?via=&#8230;</text>
  <rect x="390" y="52" width="110" height="52" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--dia-cool-strong, #cfe4e1)"/>
  <text x="445" y="82" text-anchor="middle" class="chip">partner</text>
  <text x="520" y="72" class="sub">the id bundle crosses intact,</text>
  <text x="520" y="90" class="sub">every route beneath one identity</text>

  <!-- Row 2: baseline partner with a route it can dial -->
  <text x="24" y="164" class="title">baseline session</text>
  <text x="160" y="164" class="warn">Goblins, or no feature bit</text>
  <rect x="24" y="182" width="110" height="52" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--dia-cool-strong, #cfe4e1)"/>
  <text x="79" y="212" text-anchor="middle" class="chip">you</text>
  <path d="M140 208 H 380" fill="none" stroke="var(--accent, #c76f18)" stroke-width="2.4"/>
  <g transform="translate(380 208)">
    <path d="M-7.5 -5 L2.5 0 L-7.5 5 z" fill="var(--accent, #c76f18)" stroke="none"/>
  </g>
  <text x="260" y="198" text-anchor="middle" class="mono" fill="var(--accent-deep, #a4560c)">ocapn://mk3q&#8230;.onion</text>
  <rect x="390" y="182" width="110" height="52" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--dia-warm-rule, #ead9bb)"/>
  <text x="445" y="212" text-anchor="middle" class="chip">partner</text>
  <text x="520" y="202" class="sub">one concrete route it can dial,</text>
  <text x="520" y="220" class="sub">private vocabulary stripped</text>

  <!-- Row 3: baseline partner with no route in common -->
  <text x="24" y="294" class="title">baseline session, no shared route</text>
  <rect x="24" y="312" width="110" height="52" rx="12" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--dia-cool-strong, #cfe4e1)"/>
  <text x="79" y="342" text-anchor="middle" class="chip">you</text>
  <path d="M140 338 H 246" fill="none" stroke="var(--dia-muted, #8a7862)" stroke-width="2.4" stroke-dasharray="6 4"/>
  <path d="M252 328 L272 348 M272 328 L252 348" fill="none" stroke="var(--dia-danger, #b3403a)" stroke-width="3"/>
  <text x="320" y="324" text-anchor="middle" class="dead">refused before send</text>
  <rect x="390" y="312" width="110" height="52" rx="12" fill="none" stroke="var(--dia-muted, #8a7862)" stroke-dasharray="5 4"/>
  <text x="445" y="342" text-anchor="middle" class="dead">partner</text>
  <text x="520" y="332" class="sub">no route it could dial exists, so</text>
  <text x="520" y="350" class="sub">nothing experimental is sent to be ignored</text>

  <text x="24" y="412" class="sub">The give is lowered, or refused, before anything crosses the wire. The Goblins-facing wire never changes.</text>
</svg>
