<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Alice owns a board with two columns. A grant covers the board and everything under it. Bob holds the use reference for that grant and reads a column. Alice holds the control reference for the same grant and revokes it. Bob's next read is refused.">
  <style>
    text { font-family: var(--font-sans, system-ui, sans-serif); fill: var(--ink, #3a3027); paint-order: stroke; stroke: var(--paper-raised, #fff9ee); stroke-width: 3px; stroke-linejoin: round; }
    .title { font-size: 14px; font-weight: 700; }
    .sub { font-size: 11.5px; fill: var(--ink-soft, #6b5d4d); }
    .ink-warm { fill: var(--dia-accent-deep, #9d5209); }
    .ink-cool { fill: var(--dia-teal-deep, #1b5f66); }
    .ink-danger { fill: var(--dia-danger, #b3403a); }
    .on-fill { fill: var(--on-accent, #fff8ef); stroke: none; }
    .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .result { font-size: 12.5px; font-weight: 700; }
    /* The finished picture is the end of the story: the grant revoked, and
       both of Bob's reads on record. The "active" chip is only shown while
       the loop plays. */
    .active { opacity: 0; animation: la-active 12s ease-in-out infinite; }
    .bead { visibility: hidden; }
    @supports (offset-path: path("M0 0 L1 1")) { .bead { visibility: visible; } }
    /* One 12s loop: Bob reads, Alice revokes, Bob reads again. */
    .read-1 { offset-path: path("M540 70 L472 128 L300 152 L222 152"); animation: la-read-1 12s ease-in-out infinite; }
    @keyframes la-read-1 {
      0%, 4% { offset-distance: 0%; opacity: 0; }
      6% { opacity: 1; }
      22% { offset-distance: 100%; opacity: 1; }
      25%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .allowed { animation: la-allowed 12s ease-in-out infinite; }
    @keyframes la-allowed {
      0%, 22% { opacity: 0; }
      26%, 94% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    .revoke { offset-path: path("M540 258 L472 176"); animation: la-revoke 12s ease-in-out infinite; }
    @keyframes la-revoke {
      0%, 34% { offset-distance: 0%; opacity: 0; }
      36% { opacity: 1; }
      46% { offset-distance: 100%; opacity: 1; }
      49%, 100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes la-active {
      0%, 46% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    .revoked { animation: la-revoked 12s ease-in-out infinite; }
    @keyframes la-revoked {
      0%, 46% { opacity: 0; }
      49%, 94% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    .read-2 { offset-path: path("M540 70 L472 128"); animation: la-read-2 12s ease-in-out infinite; }
    @keyframes la-read-2 {
      0%, 58% { offset-distance: 0%; opacity: 0; }
      60% { opacity: 1; }
      70% { offset-distance: 100%; opacity: 1; }
      73%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .refused { animation: la-refused 12s ease-in-out infinite; }
    @keyframes la-refused {
      0%, 70% { opacity: 0; }
      74%, 94% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .bead { visibility: hidden !important; }
    }
  </style>
  <defs>
    <marker id="la-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #c76f18)"/>
    </marker>
    <marker id="la-cool" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--teal, #257f88)"/>
    </marker>
  </defs>

  <!-- Alice's resources, with the grant's scope drawn around them. -->
  <text x="125" y="22" text-anchor="middle" class="tag ink-warm">Alice's board</text>
  <rect x="20" y="32" width="200" height="250" rx="16" fill="none" stroke="var(--accent, #c76f18)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="50" width="160" height="50" rx="12" fill="var(--dia-warm-fill, #fdf4e3)" stroke="var(--dia-warm-rule, #ead9bb)"/>
  <text x="120" y="80" text-anchor="middle" class="title">board</text>
  <path d="M60 100 L60 207 M60 147 L78 147 M60 207 L78 207" stroke="var(--dia-warm-stroke, #c0a875)" stroke-width="1.5" fill="none"/>
  <rect x="80" y="124" width="120" height="46" rx="12" fill="var(--dia-card, #ffffff)" stroke="var(--rule, #e7d4b7)"/>
  <text x="140" y="152" text-anchor="middle" class="title">column: to do</text>
  <rect x="80" y="184" width="120" height="46" rx="12" fill="var(--dia-card, #ffffff)" stroke="var(--rule, #e7d4b7)"/>
  <text x="140" y="212" text-anchor="middle" class="title">column: done</text>
  <text x="120" y="266" text-anchor="middle" class="sub">scope: the board and below</text>

  <!-- The grant, in the middle, with its current state. -->
  <rect x="300" y="110" width="170" height="86" rx="14" fill="var(--dia-cool-fill, #edf5f3)" stroke="var(--teal, #257f88)" stroke-width="2"/>
  <text x="385" y="136" text-anchor="middle" class="title ink-cool">grant</text>
  <text x="385" y="155" text-anchor="middle" class="sub">permission: read</text>
  <g class="active">
    <rect x="345" y="164" width="80" height="22" rx="11" fill="var(--teal, #257f88)"/>
    <text x="385" y="179" text-anchor="middle" class="sub on-fill">active</text>
  </g>
  <g class="revoked">
    <rect x="345" y="164" width="80" height="22" rx="11" fill="var(--dia-danger, #b3403a)"/>
    <text x="385" y="179" text-anchor="middle" class="sub on-fill">revoked</text>
  </g>
  <path d="M300 152 L226 152" stroke="var(--teal, #257f88)" stroke-width="2" marker-end="url(#la-cool)"/>
  <text x="262" y="144" text-anchor="middle" class="sub">covers</text>

  <!-- Bob uses it; Alice controls it. -->
  <rect x="540" y="42" width="160" height="56" rx="12" fill="var(--dia-card, #ffffff)" stroke="var(--rule, #e7d4b7)"/>
  <text x="620" y="66" text-anchor="middle" class="title">Bob</text>
  <text x="620" y="85" text-anchor="middle" class="sub">holds the use reference</text>
  <path d="M540 70 L476 124" stroke="var(--accent, #c76f18)" stroke-width="2" marker-end="url(#la-warm)"/>
  <text x="490" y="84" text-anchor="middle" class="sub">use</text>
  <g class="allowed">
    <path d="M550 117 L554 121 L562 112" fill="none" stroke="var(--teal, #257f88)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="570" y="122" class="result ink-cool">read to do: allowed</text>
  </g>
  <g class="refused">
    <path d="M551 133 L560 142 M560 133 L551 142" stroke="var(--dia-danger, #b3403a)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="570" y="142" class="result ink-danger">read again: refused</text>
  </g>

  <rect x="540" y="230" width="160" height="56" rx="12" fill="var(--dia-card, #ffffff)" stroke="var(--rule, #e7d4b7)"/>
  <text x="620" y="254" text-anchor="middle" class="title">Alice</text>
  <text x="620" y="273" text-anchor="middle" class="sub">holds the control reference</text>
  <path d="M540 258 L476 180" stroke="var(--accent, #c76f18)" stroke-width="2" marker-end="url(#la-warm)"/>
  <text x="440" y="226" text-anchor="middle" class="sub">pause, resume, revoke</text>

  <circle class="bead read-1" r="5" fill="var(--accent, #c76f18)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
  <circle class="bead revoke" r="5" fill="var(--accent, #c76f18)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
  <circle class="bead read-2" r="5" fill="var(--accent, #c76f18)" stroke="var(--paper-raised, #fff9ee)" stroke-width="2"/>
</svg>
