  <rect
    x="420"
    y="92"
    width="120"
    height="46"
    rx="11"
    fill="var(--paper-raised, #fff9ee)"
    stroke="var(--accent, #c76f18)"
  >
  </rect>
  <text
    x="480"
    y="121"
    text-anchor="middle"
    class="node"
    fill="var(--accent-deep, #a4560c)"
  >glowcap</text>
  <rect
    x="596"
    y="92"
    width="120"
    height="46"
    rx="11"
    fill="var(--paper-raised, #fff9ee)"
    stroke="var(--accent, #c76f18)"
  >
  </rect>
  <text
    x="656"
    y="121"
    text-anchor="middle"
    class="node"
    fill="var(--accent-deep, #a4560c)"
  >glowcap</text>

  <path
    d="M544 106 L 586 106"
    fill="none"
    stroke="var(--accent-deep, #a4560c)"
    stroke-width="2"
    marker-end="url(#dia-amber)"
  >
  </path>
  <path
    d="M592 124 L 550 124"
    fill="none"
    stroke="var(--accent-deep, #a4560c)"
    stroke-width="2"
    marker-end="url(#dia-amber)"
  >
  </path>
  <text
    x="568"
    y="166"
    text-anchor="middle"
    class="label muted"
  >op:start-session &#183; pre-spec</text>

  <rect
    x="432"
    y="196"
    width="272"
    height="58"
    rx="12"
    fill="var(--dia-warm-fill, #fff4e4)"
    stroke="var(--accent, #c76f18)"
  >
  </rect>
  <text
    x="568"
    y="222"
    text-anchor="middle"
    class="result"
    fill="var(--accent-deep, #a4560c)"
