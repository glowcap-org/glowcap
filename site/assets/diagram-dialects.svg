<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 320"
  width="760"
  height="320"
  role="img"
  aria-label="Two interop situations. Talking to a Goblins peer, pancake speaks the canonical dialect, CapTP 1.0 over Syrup, the interop floor. Talking to another pancake peer, both ends can choose pancake's native profile and the Cap'n Proto codec, and still drop to 1.0 over Syrup."
>
