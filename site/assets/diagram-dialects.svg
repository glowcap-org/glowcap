<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 280"
  width="760"
  height="280"
  role="img"
  aria-label="Two interop situations. Talking to a Goblins peer, glowcap speaks the canonical dialect, CapTP 1.0 over Syrup, the interop floor. Talking to another glowcap peer, both ends can choose glowcap's own profile and the Cap'n Proto codec, and still drop to 1.0 over Syrup."
>
  <defs>
    <marker
      id="dia-teal"
      viewBox="0 0 10 10"
      refX="7.5"
      refY="5"
      markerWidth="5"
      markerHeight="5"
      orient="auto-start-reverse"
    >
      <path d="M0 0L10 5L0 10z" fill="var(--teal-deep, #1b5f66)"></path>
    </marker>
    <marker
      id="dia-amber"
      viewBox="0 0 10 10"
      refX="7.5"
      refY="5"
      markerWidth="5"
      markerHeight="5"
      orient="auto-start-reverse"
    >
      <path d="M0 0L10 5L0 10z" fill="var(--accent-deep, #a4560c)"></path>
    </marker>
  </defs>
  <style>text { font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
    .ptitle { font-size: 15px; font-weight: 700; }
    .node { font-size: 14px; font-weight: 700; }
    .label { font-size: 12.5px; }
    .muted { fill: var(--ink-soft, #6b5d4d); }
    .result { font-size: 14px; font-weight: 700; }</style>

  <rect
    x="16"
    y="16"
    width="352"
    height="248"
    rx="16"
    fill="var(--dia-cool-fill, #f1f7f6)"
    stroke="var(--dia-cool-strong, #cfe4e1)"
  >
  </rect>
  <text
    x="192"
    y="46"
    text-anchor="middle"
    class="ptitle"
    fill="var(--teal-deep, #1b5f66)"
  >Talking to Goblins</text>
  <text
    x="192"
    y="66"
    text-anchor="middle"
    class="label muted"
  >the canonical dialect, the interop floor</text>

  <rect
    x="44"
    y="92"
    width="120"
    height="46"
    rx="11"
    fill="var(--paper-raised, #fff9ee)"
    stroke="var(--accent, #c76f18)"
  >
  </rect>
  <text
    x="104"
    y="121"
    text-anchor="middle"
    class="node"
    fill="var(--accent-deep, #a4560c)"
