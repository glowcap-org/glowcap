[package]
repository = "https://github.com/glowcap-org/glowcap"
homepage = "https://glowcap.org"
documentation = "https://glowcap.org"
name = "interface-conversation-proof"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[bin]]
name = "interface-conversation-proof"
path = "main.rs"

# Keep the archive set explicit: this client composes the tokio driver with the
# TCP provider and pays for no unrelated transport archive.
[dependencies]
glowcap = { path = "../../../bindings/rust", package = "glowcap", default-features = false, features = ["async", "tcp"] }
# dep tokio: The async runtime for the Rust interface proof.
tokio = { version = "1", default-features = false, features = ["net", "rt", "io-util", "macros", "time", "sync"] }
