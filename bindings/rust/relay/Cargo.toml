# A byte-transparent relay in Rust — the third-runtime reference for the ADR-0033
# relay contract. Standalone (no glowcap dependency for the TCP leg, since a raw
# socket is already byte-level and kernel-backpressured); its WebSocket server is
# tokio-tungstenite, reusing the tokio the iroh sidecar already pulls in.
[package]
name = "glowcap-relay"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[bin]]
name = "glowcap-relay"
path = "src/main.rs"

[features]
# Opt-in iroh leg: dispatch `?locator=<ocapn-uri>` to an iroh byte channel dialed
# through the glowcap Rust binding. The default TCP-only relay stays standalone
# (no glowcap dependency, no C-ABI linking), so `rust-relay-test` needs no
# archives; `rust-relay-iroh-test` builds with `--features iroh`.
iroh = ["dep:glowcap-rust-dogfood"]

[dependencies]
# dep tokio: The async runtime for the relay server.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time"] }
# dep tokio-tungstenite: The relay's WebSocket server.
tokio-tungstenite = "0.30"
# dep futures-util: Sink helpers for the relay's WebSockets.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
glowcap-rust-dogfood = { path = "..", features = ["iroh", "async"], optional = true }

[profile.release]
opt-level = 2
