[package]
name = "glowcap-rust-dogfood"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

# Dead code in this crate is drift: an FFI mirror or marshaling helper whose C
# export or caller went away must be pruned in the same change, so the compiler
# refuses it instead of a rule asking someone to notice (`cargo` enforces this
# in every build, including `zig build rust-dogfood`).
[lints.rust]
dead_code = "deny"

[features]
# The feature set mirrors glowcap's à-la-carte C ABI archives (ADR-0059): the
# core OCapN peer is always present, and each transport feature links exactly its
# companion archive and compiles its module (`build.rs` emits one
# `cargo:rustc-link-lib` per enabled feature). A consumer pays — in linked
# archive and symbols — only for the transports it turns on.
default = ["tcp", "inproc"]

# Blocking TCP transport. Links `libglowcap_net_transport_tcp` and compiles
# `pub mod tcp` (the `glowcap_tcp_*` netlayer + its own `glowcap_tcp_last_error`).
tcp = []
# Blocking in-process transport. Links `libglowcap_net_transport_inproc` and
# compiles `pub mod inproc` (the `glowcap_inproc_*` netlayer + its own
# `glowcap_inproc_last_error`).
inproc = []
# Blocking Tor onion transport. Links `libglowcap_net_transport_onion` and
# compiles `pub mod onion` (the `glowcap_onion_*` netlayer + its own
# `glowcap_onion_last_error`). Off by default: it is the only transport whose use
# depends on a Tor daemon the deployment runs, so a consumer opts in.
onion = []

# Shared asynchronous Host/Session custody and byte-stream I/O. Native targets
# add Tokio sockets/timers; Wasm uses browser entropy and timers while the
# embedder polls a Tokio LocalSet from its browser executor.
async = ["dep:tokio", "dep:getrandom", "dep:web-time", "dep:gloo-timers"]
# Browser-owned WebSocket chunks and reliable RTCDataChannel packets. This
# links no native transport archive; CapTP still runs in the shared Host.
browser = ["async", "dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]
# Opt-in iroh transport. Links the iroh public C ABI companion library
# (`libglowcap_net_transport_iroh`, built by `zig build iroh-abi`, needs cargo) *alongside*
# the static core archive, it exports only `glowcap_iroh_*`, so core symbols still
# come from `libglowcap_ocapn` (ADR-0055). Compiles `pub mod iroh` and adds
# `iroh::listen` / `iroh::Server` over the encrypted-QUIC sidecar
# bridge (`connect(locator)` routes iroh dials). Implies `async` (the driver it rides).
iroh = ["async"]
# Opt-in WebRTC transport. Links the WebRTC public C ABI companion library
# (`libglowcap_net_transport_webrtc`, built by `zig build webrtc-abi`, needs
# cargo) alongside the static core archive; it exports only `glowcap_webrtc_*`,
# so core symbols still come from `libglowcap_ocapn` (ADR-0089). Compiles
# `pub mod webrtc`, the raw multiplexed-readiness and peer try-I/O family. Signaling
# submissions are synchronous control operations; no call parks the runtime.
webrtc = []
# Opt-in native relay provider. Links the relay archive and composes its
# keyed-relay/noise-relay package into the generic driver loop.
relay = ["async"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "io-util", "macros", "sync"], optional = true }
getrandom = { version = "0.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["net", "time"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
web-time = { version = "1.1", optional = true }
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Url", "WebSocket", "BinaryType", "RtcDataChannel", "RtcDataChannelState", "RtcDataChannelType", "Event", "MessageEvent", "CloseEvent", "RtcPeerConnection", "RtcPeerConnectionState", "RtcConfiguration", "RtcPeerConnectionIceEvent", "RtcIceCandidate", "RtcIceCandidateInit", "RtcDataChannelEvent", "RtcSessionDescriptionInit", "RtcSdpType"] }

# build.rs parses the package-shipped c-abi-resolve.json (ADR-0077).
[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The library never spawns a process; only the live-interop examples do (they
# launch a Racket Goblins peer). Dev builds union this `process` feature onto
# the lib's tokio, so examples and tests get it while the shipped library
# stops carrying it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", default-features = false, features = ["process"] }

# Live interop proof: a peer on the C ABI holds a keyed OCapN conversation with a
# real Goblins vat. Run via `zig build rust-goblins-interop` (needs racket +
# goblins); the async I/O surface it drives over is the `async` feature. The
# source lives under `interop/goblins_interop/`, alongside the Deno/Python/
# Racket goblins clients it mirrors.
[[example]]
name = "rust_client"
path = "../../interop/goblins_interop/rust_client.rs"
required-features = ["async", "tcp"]

# Reciprocal live interop proof: a real Goblins vat dials this binding's TCP
# listener, enlivens its Host-wide actor, and calls it.
[[example]]
name = "goblins_listen"
required-features = ["async", "tcp"]

# Live three-party gift: the binding deposits a capability with a real Goblins
# exporter and the recipient withdraws it. Run via `zig build rust-goblins-gift`
# (needs racket + goblins); drives over the `async` I/O surface.
[[example]]
name = "rust_gift_client"
path = "../../interop/goblins_interop/rust_gift_client.rs"
required-features = ["async", "tcp"]

# Live three-party handoff: the binding redeems a give from a real Goblins
# introducer and calls the exporter. Run via `zig build rust-goblins-handoff`
# (needs racket + goblins); drives over the `async` I/O surface.
[[example]]
name = "rust_handoff_client"
path = "../../interop/goblins_interop/rust_handoff_client.rs"
required-features = ["async", "tcp"]

# Live iroh scale proof: many concurrent connections served from one readiness
# loop (ADR-0057), the Rust sibling of `zig build iroh-loop`. Run via
# `zig build rust-iroh-loop` (needs cargo + the iroh ABI library).
[[example]]
name = "iroh_loop"
required-features = ["iroh"]

# Live three-party handoff over iroh in one process (ADR-0009), the Rust sibling
# of `zig build demo-rooms-dm-iroh`. Run via `zig build rust-iroh-handoff` (needs
# cargo + the iroh ABI library).
[[example]]
name = "iroh_handoff"
required-features = ["iroh"]

# Live real-internet reachability: reach a peer by node id alone over n0 relays +
# DNS/pkarr discovery, the Rust sibling of `zig build iroh-reachability`. Run via
# `zig build rust-iroh-reachability` (needs cargo + the iroh ABI library +
# internet); opt-in, never part of `check`.
[[example]]
name = "iroh_reachability"
required-features = ["iroh"]

# Hermetic proof that a recipient's configured redeem posture governs a hint-less
# iroh give: redeems by id through an in-process LocalDiscovery book, no network.
# Run via `zig build rust-iroh-redeem-posture`.
[[example]]
name = "iroh_redeem_posture"
required-features = ["iroh"]

# Keyed-relay rendezvous cold-dial proof (ADR-0088): dials a registered
# non-listening peer through the reference relay's rendezvous bridge. Run via
# `zig build rust-keyed-relay-rendezvous` (the harness supplies relay + peer).
[[example]]
name = "keyed_relay_rendezvous"
required-features = ["relay"]

# Managed noise-relay listener proof across two Rust processes. Cargo discovers
# sources under `examples/` even when their module is feature-gated, so state
# the archive dependency here as part of the example's build contract.
[[example]]
name = "noise_relay_listen"
required-features = ["relay"]

# Keyed-tcp restart proof (ADR-0075): happy path, squatter refusal, same-seed
# fresh-port restart. Run via `zig build rust-keyed-tcp-restart`.
[[example]]
name = "keyed_tcp_restart"
required-features = ["async", "tcp"]

# Verb-spine behavior proof: promise, dial, listen, and GC walked against the
# fixed peer `bindings/proofs/verb_spine/harness.ts` stands up. Run via
# `zig build rust-verb-spine`.
[[example]]
name = "verb_spine"
required-features = ["async", "tcp"]
