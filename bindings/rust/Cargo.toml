[package]
name = "pancake-rust-dogfood"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[features]
# Opt-in async I/O over tokio. The base binding stays dependency-free; the sync
# `Peer` is sans-io and drives from any runtime, so async is purely additive.
# `getrandom` supplies the per-connection session seed at the I/O boundary (the
# sans-io core never generates entropy).
async = ["dep:tokio", "dep:getrandom"]
# Opt-in iroh transport. Links the iroh public C ABI superset library
# (`libpancake_iroh`, built by `zig build iroh-abi`, needs cargo) instead of
# plain `libpancake`, and adds `Connection::connect_iroh` / `IrohServer` over the
# encrypted-QUIC sidecar bridge (ADR-0055). Implies `async` (the driver it rides).
iroh = ["async"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["net", "rt", "io-util", "macros", "sync", "process", "time"], optional = true }
getrandom = { version = "0.2", optional = true }

# Live interop proof: a peer on the C ABI holds a keyed OCapN conversation with a
# real Goblins vat. Run via `zig build rust-goblins-interop` (needs racket +
# goblins); the async I/O surface it drives over is the `async` feature.
[[example]]
name = "goblins_interop"
required-features = ["async"]
