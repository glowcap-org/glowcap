[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glowcap"
authors = [{name = "Glowcap LLC"}]
version = "0.1.1"
description = "Python ctypes binding for the glowcap C ABI archives (codec-neutral CapTP core for OCapN)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
classifiers = ["Development Status :: 3 - Alpha"]
# Stdlib ctypes only, no third-party runtime dependencies. The one optional
# extra is the keyed-relay rendezvous dial's WebSocket client (ADR-0034),
# imported lazily at dial time and refused with a typed error when absent.
dependencies = []

[project.optional-dependencies]
# dep websockets: The optional WebSocket client for relay rendezvous.
rendezvous = ["websockets"]

[tool.setuptools.packages.find]
# The binding is the `glowcap` package: the core plus one submodule per transport
# (`tcp`, `inproc`, `iroh`), mirroring the à-la-carte C ABI archives. Its internal
# per-archive FFI loaders (`_ffi_ocapn`, `_ffi_tcp`, `_ffi_inproc`, `_ffi_iroh`) and
# the ABI constants (`_constants`) ship inside it. `zig_smoke.py` is the dogfood
# runner, executed directly rather than installed. Discovery is one recursive
# authority for private ownership packages such as `_host`, `_driver`, `_loop`,
# and `_session`; an explicit top-level-only list silently omitted them from wheels.
include = ["glowcap*"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so type checkers read the inline annotations.
glowcap = ["py.typed", "c-abi-resolve.json"]

[project.urls]
Repository = "https://github.com/glowcap-org/glowcap"
Homepage = "https://glowcap.org"
Documentation = "https://glowcap.org"
