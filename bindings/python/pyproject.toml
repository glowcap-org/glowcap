[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pancake-python"
version = "0.1.0"
description = "Python ctypes smoke consumer of the Zig pancake C ABI archives (codec-neutral CapTP core for OCapN)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Stdlib ctypes only — no third-party runtime dependencies.
dependencies = []

[tool.setuptools]
# The binding is the `pancake` package: the core plus one submodule per transport
# (`tcp`, `inproc`, `iroh`), mirroring the à-la-carte C ABI archives. Its internal
# per-archive FFI loaders (`_ffi_core`, `_ffi_tcp`, `_ffi_inproc`, `_ffi_iroh`) and
# the ABI constants (`_constants`) ship inside it. `zig_smoke.py` is the dogfood
# runner, executed directly rather than installed.
packages = ["pancake"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so type checkers read the inline annotations.
pancake = ["py.typed"]
