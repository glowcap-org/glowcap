[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pancake-python"
version = "0.1.0"
description = "Python ctypes smoke consumer of the Zig libpancake C ABI (codec-neutral CapTP runtime for OCapN)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Stdlib ctypes only — no third-party runtime dependencies.
dependencies = []

[tool.setuptools]
py-modules = ["pancake", "zig_smoke"]
