# Two Docker networks:
#   rooms-net  — shared with the rooms app (apps/rooms/web/deploy).
#                Committed and always on: it is how a bot in this dev container
#                reaches the room's internal CapTP. Fixed name, so both compose
#                projects converge on one shared network.
#   egress-net — a worktree-specific outbound bridge by default, or an
#                operator-selected agent-backend network. Its name lives in
#                the gitignored .devcontainer/.env, which Compose loads.
# Setup steps live in networking.md; rebuild/reopen after changing .env.

services:
  pancake-dev:
    # `.env` gives each checkout one short identity. The service key stays
    # stable because devcontainer.json addresses it; Docker's actual container
    # name is the worktree-specific name people and tools use.
    container_name: pancake-${PANCAKE_WORKTREE:?Run bash .devcontainer/configure.sh}
    hostname: pancake-${PANCAKE_WORKTREE:?Run bash .devcontainer/configure.sh}
    # Name the built artifact too. Without this, Dev Containers derives an
    # opaque `vsc-<directory>-<hash>` image that drops the project identity.
    image: vsc-pancake-${PANCAKE_WORKTREE:?Run bash .devcontainer/configure.sh}
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspaces/pancake
    environment:
      PANCAKE_WORKTREE: ${PANCAKE_WORKTREE:?Run bash .devcontainer/configure.sh}
      # The ocapnviz Vite dev server keeps loopback as its bare-host default;
      # inside the container it must bind wide or the published port above
      # reaches nothing. The config reads this variable and opens Vite's
      # Host-header allowlist for that same wide bind.
      OCAPNVIZ_HOST: 0.0.0.0
      # Zine's docs-serve is the same shape: loopback on a laptop, wide in
      # the container so the published 1990 mapping reaches the process.
      DOCS_SERVE_HOST: 0.0.0.0
    volumes:
      # Workspace bind — required when using dockerComposeFile.
      - ..:/workspaces/pancake:cached
      # A linked worktree's .git file points at the primary checkout's common
      # Git directory. Mount it at the identical absolute path so that pointer
      # remains valid inside the container as well as on the host.
      - type: bind
        source: ${PANCAKE_GIT_COMMON_DIR:?Set PANCAKE_GIT_COMMON_DIR in .devcontainer/.env (see .env.example)}
        target: ${PANCAKE_GIT_COMMON_DIR:?Set PANCAKE_GIT_COMMON_DIR in .devcontainer/.env (see .env.example)}
      # User-level agent and authentication state comes from the scoped host
      # binds in devcontainer.json, shared by every pancake worktree.
    # Editor-owned build caches stay in devcontainer.json because they are safe
    # to share across worktrees and contain no tool identity.
    command: sleep infinity
    # `.env` gives each worktree its own host ports while services retain their
    # canonical container ports. Published on every host interface.
    ports:
      - "0.0.0.0:${PANCAKE_ROOMS_WEB_HOST_PORT:?Run bash .devcontainer/configure.sh}:8000"
      - "0.0.0.0:${PANCAKE_ROOMS_CAPTP_HOST_PORT:?Run bash .devcontainer/configure.sh}:9099"
      - "0.0.0.0:${PANCAKE_ROOMS_RELAY_HOST_PORT:?Run bash .devcontainer/configure.sh}:9200"
      - "0.0.0.0:${PANCAKE_ROOMS_TRACE_HOST_PORT:?Run bash .devcontainer/configure.sh}:9300"
      - "0.0.0.0:${PANCAKE_OCAPNVIZ_HOST_PORT:?Run bash .devcontainer/configure.sh}:5173"
      - "0.0.0.0:${PANCAKE_DOCS_HOST_PORT:?Run bash .devcontainer/configure.sh}:1990"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks:
      - rooms-net
      - egress-net

networks:
  # Shared fabric with the rooms app. Fixed name, external so both compose
  # projects use the one network; created by the devcontainer initializeCommand
  # if it does not exist yet.
  rooms-net:
    name: rooms-net
    external: true
  # One side network, host-named via the gitignored .env (EGRESS_NET). The key
  # below is a compose alias, not the host network name.
  egress-net:
    name: ${EGRESS_NET:?Set EGRESS_NET in .devcontainer/.env (see .env.example)}
    external: true
