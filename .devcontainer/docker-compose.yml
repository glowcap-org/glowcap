# Two Docker networks:
#   rooms-net  — shared with the rooms app (apps/rooms/web/deploy).
#                Committed and always on: it is how a bot in this dev container
#                reaches the room's internal CapTP. Fixed name, so both compose
#                projects converge on one shared network.
#   egress-net — a worktree-specific outbound bridge by default, or an
#                operator-selected agent-backend network. Its name lives in
#                the gitignored .devcontainer/.env, which Compose loads.
# Setup steps live in networking.md; rebuild/reopen after changing .env.

services:
  glowcap-dev:
    # `.env` gives each checkout one short identity. The service key stays
    # stable because devcontainer.json addresses it; Docker's actual container
    # name is the worktree-specific name people and tools use.
    container_name: glowcap-${GLOWCAP_WORKTREE:?Run bash .devcontainer/bin/configure.sh}
    hostname: glowcap-${GLOWCAP_WORKTREE:?Run bash .devcontainer/bin/configure.sh}
    # Name the built artifact too. Without this, Dev Containers derives an
    # opaque `vsc-<directory>-<hash>` image that drops the project identity.
    image: vsc-glowcap-${GLOWCAP_WORKTREE:?Run bash .devcontainer/bin/configure.sh}
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspaces/glowcap
    environment:
      GLOWCAP_WORKTREE: ${GLOWCAP_WORKTREE:?Run bash .devcontainer/bin/configure.sh}
      # Submodule repositories use this same-path checkout alias for core.worktree;
      # /workspaces/glowcap remains the editor and shell workspace.
      GLOWCAP_CHECKOUT_DIR: ${GLOWCAP_CHECKOUT_DIR:?Run bash .devcontainer/bin/configure.sh}
      # The ocapnviz Vite dev server keeps loopback as its bare-host default;
      # inside the container it must bind wide or the published port above
      # reaches nothing. The config reads this variable and opens Vite's
      # Host-header allowlist for that same wide bind.
      OCAPNVIZ_HOST: 0.0.0.0
      # Zine's docs-serve is the same shape: loopback on a laptop, wide in
      # the container so the published 1990 mapping reaches the process.
      DOCS_SERVE_HOST: 0.0.0.0
      # The named volume below gives Zig daemon-native filesystem semantics on
      # native Linux Docker and Docker Desktop. The volume name carries the
      # worktree identity, so local build state stays isolated.
      ZIG_LOCAL_CACHE_DIR: /home/vscode/.cache/glowcap-zig-work/zig-local
      ZIG_LOCAL_PKG_DIR: /home/vscode/.cache/glowcap-zig-work/zig-pkg
    volumes:
      # Workspace bind — required when using dockerComposeFile.
      - ..:/workspaces/glowcap:cached
      # Git records one worktree path in each submodule repository. Mount the
      # checkout at its host path too, so that absolute path resolves on both
      # sides of the container boundary.
      - type: bind
        source: ${GLOWCAP_CHECKOUT_DIR:?Set GLOWCAP_CHECKOUT_DIR in .devcontainer/.env}
        target: ${GLOWCAP_CHECKOUT_DIR:?Set GLOWCAP_CHECKOUT_DIR in .devcontainer/.env}
      # A linked worktree's .git file points at the primary checkout's common
      # Git directory. Mount it at the identical absolute path so that pointer
      # remains valid inside the container as well as on the host.
      - type: bind
        source: ${GLOWCAP_GIT_COMMON_DIR:?Set GLOWCAP_GIT_COMMON_DIR in .devcontainer/.env (see .env.example)}
        target: ${GLOWCAP_GIT_COMMON_DIR:?Set GLOWCAP_GIT_COMMON_DIR in .devcontainer/.env (see .env.example)}
      - type: volume
        source: glowcap-zig-work
        target: /home/vscode/.cache/glowcap-zig-work
      # User-level agent, authentication, and shared download caches come from
      # the scoped host binds in devcontainer.json.
    # Preview servers and integration tests have process trees. Docker's tiny
    # init reaps a grandchild if its direct owner exits during teardown.
    init: true
    command: sleep infinity
    # `.env` gives each worktree its own host ports while services retain their
    # canonical container ports. Published on host loopback so a tailnet
    # listener can bind the same numbers on the machine's tailnet addresses.
    ports:
      - "127.0.0.1:${GLOWCAP_ROOMS_WEB_HOST_PORT:?Run bash .devcontainer/bin/configure.sh}:8000"
      - "127.0.0.1:${GLOWCAP_ROOMS_CAPTP_HOST_PORT:?Run bash .devcontainer/bin/configure.sh}:9099"
      - "127.0.0.1:${GLOWCAP_ROOMS_RELAY_HOST_PORT:?Run bash .devcontainer/bin/configure.sh}:9200"
      - "127.0.0.1:${GLOWCAP_ROOMS_TRACE_HOST_PORT:?Run bash .devcontainer/bin/configure.sh}:9300"
      - "127.0.0.1:${GLOWCAP_OCAPNVIZ_HOST_PORT:?Run bash .devcontainer/bin/configure.sh}:5173"
      - "127.0.0.1:${GLOWCAP_DOCS_HOST_PORT:?Run bash .devcontainer/bin/configure.sh}:1990"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks:
      - rooms-net
      - egress-net

networks:
  # Shared fabric with the rooms app. Fixed name, external so both compose
  # projects use the one network; created by the devcontainer initializeCommand
  # if it does not exist yet.
  rooms-net:
    name: rooms-net
    external: true
  # One side network, host-named via the gitignored .env (EGRESS_NET). The key
  # below is a compose alias, not the host network name.
  egress-net:
    name: ${EGRESS_NET:?Set EGRESS_NET in .devcontainer/.env (see .env.example)}
    external: true

volumes:
  glowcap-zig-work:
    name: glowcap-${GLOWCAP_WORKTREE:?Run bash .devcontainer/bin/configure.sh}-zig-work
