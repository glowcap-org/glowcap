# Serena project configuration. The serena skill under .agents/skills owns the
# procedure, and this file holds only the settings glowcap sets.
project_name: "glowcap"
encoding: "utf-8"
ignore_all_files_in_gitignore: true
initial_prompt: |
  Read AGENTS.md first and follow its Start Here routing. Use Serena for Zig
  symbol work as directed there; use host file tools for prose and config.
ignored_paths:
- .zig-cache
- zig-out
default_modes:
added_modes:
excluded_tools: []
included_optional_tools: []
fixed_tools: []
symbol_info_budget:
language_backend:
line_ending:
read_only_memory_patterns: []
ignored_memory_patterns: []
ls_specific_settings: {}
ls_workspace_folders:
- .
ls_additional_workspace_folders: []
read_only: false
activation_command:
activation_command_timeout: 180.0
language_servers:
- zig
- markdown
- yaml
included_apis: []
excluded_apis: []
agent_interface:
