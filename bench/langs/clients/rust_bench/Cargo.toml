[package]
repository = "https://github.com/glowcap-org/glowcap"
homepage = "https://glowcap.org"
documentation = "https://glowcap.org"
name = "langs-bench"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[bin]]
name = "langs-bench"
path = "src/main.rs"

# Link only the async runtime and TCP provider used by this client. The
# dependency's build.rs finds the installed archives under the repo's zig-out/lib
# relative to its own manifest.
[dependencies]
glowcap = { path = "../../../../bindings/rust", package = "glowcap", default-features = false, features = ["async", "tcp"] }
# dep tokio: The async runtime for the Rust benchmark client.
tokio = { version = "1", default-features = false, features = ["net", "rt", "io-util", "macros", "time", "sync"] }
