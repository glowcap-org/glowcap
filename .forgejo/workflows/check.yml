# CI on Codeberg's hosted runners: the Zig-only checks, with the compiler
# installed through the devcontainer's checksummed installer, because hosted
# runners cannot build the devcontainer image (no docker-in-docker). The full
# gate sequence (ci/gates.sh inside the devcontainer image) runs on the GitHub
# mirror and on any docker-capable self-hosted runner attached here later.
# Topology: CONTRIBUTING.md "Continuous integration".
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  zig:
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the pinned Zig
        run: bash .devcontainer/install-zig.sh

      - name: Formatting, architecture, scaffolding, and correctness tests
        run: zig build fmt-check arch-check meta-check test
