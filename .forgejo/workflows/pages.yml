# Build the documentation site on a Codeberg-hosted runner and publish the
# exact `zig build site` artifact to the pages branch. Codeberg Pages serves
# that branch at https://jimisaacs.codeberg.page/pancake/ (the zine.ziggy
# host_url) once the repository is public and a Forgejo webhook targeting that
# URL, filtered to the pages branch, is registered in the repository settings.
# The site build needs only the pinned Zig (the site sub-build fetches Zine
# itself). Topology: CONTRIBUTING.md "Continuous integration".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pages:
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the pinned Zig
        run: bash .devcontainer/install-zig.sh

      - name: Build the site
        run: zig build site

      # The pages branch is generated state, not history: each publish is one
      # orphan commit force-pushed from a clean directory, so the branch never
      # grows and never picks up working-tree debris. The automatic Actions
      # token has write access to this repository; the credential helper keeps
      # it out of process argv.
      - name: Publish to the pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          publish="$(mktemp -d)"
          cp -R zig-out/site/. "$publish/"
          cd "$publish"
          git init -b pages
          git config user.name "pancake pages"
          git config user.email "pancake-pages@noreply.codeberg.org"
          git add .
          git commit -m "Publish documentation site from ${GITHUB_SHA}"
          remote="${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { echo "username=${GITHUB_ACTOR}"; echo "password=${TOKEN}"; }; f' \
            push --force "https://${remote}" pages
