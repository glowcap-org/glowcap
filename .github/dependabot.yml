# Every update targets dev, the default branch, and lands through the ordinary
# checks. One grouped pull request per ecosystem keeps the hosted-runner cost
# to one full run per cycle. Toolchain pins (.devcontainer/pins.sh), the
# devcontainer and Rooms deploy base images, Zig packages (build.zig.zon), Mbed
# TLS, and the conformance submodules move through their own owners and are not
# watched here. Every update waits a week after its release, so a version pulled
# or compromised in its first days never reaches a pull request. Each committed
# lockfile's directory is listed under its ecosystem (ci/dependabot_test.py).
version: 2
updates:
  # Dependabot reads the workflows from the root and each composite action
  # from its own directory.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories:
      - /apps/rooms/rust
      - /apps/rooms/clients/rust
      - /apps/tasks/rust
      - /apps/tools/rust
      - /bench/capnp/rust
      - /bench/interface
      - /bench/langs/clients/rust_bench
      - /bindings/proofs/loam_browser/rust
      - /bindings/rust
      - /bindings/rust/relay
      - /tools/interface/authoring/capnp
      - /tools/interface/authoring/capnp/e2e
      - /transports
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: uv
    directories:
      - /bindings/python
      - /ci
      - /conformance/ocapn-conformance
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]

  # Playwright's npm package moves with its browser build, which pins.sh owns.
  - package-ecosystem: deno
    directories:
      - /
      - /apps/ocapnviz
      - /apps/rooms
      - /bindings/ts
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: playwright
    groups:
      deno:
        patterns: ["*"]
