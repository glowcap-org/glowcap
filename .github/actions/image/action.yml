name: Prepare the CI image
description: Resolve a toolchain image or build it once for this workflow run, and start it when this job is its consumer.
inputs:
  publish:
    description: Whether a built image is pushed to the registry, which needs packages write.
    default: "false"
  start:
    description: Whether this job starts the prepared image itself, instead of handing it to other jobs.
    default: "false"
outputs:
  image:
    description: Immutable registry digest or local image ID.
    value: ${{ steps.prepare.outputs.image }}
  archive:
    description: Whether consumers need the run-scoped image artifact.
    value: ${{ steps.prepare.outputs.archive }}
runs:
  using: composite
  steps:
    - name: Reclaim disk space for the toolchain image
      shell: bash
      run: python3 ci/image.py reclaim
    - uses: ./.github/actions/devcontainer-cli
    - name: Resolve or build the toolchain image once
      id: prepare
      env:
        PUBLISH: ${{ inputs.publish }}
      shell: bash
      run: python3 ci/image.py prepare --publish "$PUBLISH"
    - name: Start the prepared devcontainer
      if: inputs.start == 'true'
      env:
        IMAGE: ${{ steps.prepare.outputs.image }}
      shell: bash
      run: python3 ci/image.py start "$IMAGE"
