name: Start the CI devcontainer
description: Start an image another job prepared, after the workflow frees disk and stages any unpublished image archive.
inputs:
  image:
    description: The image output of the devcontainer-image workflow.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/devcontainer-cli
    - name: Start the prepared devcontainer
      env:
        IMAGE: ${{ inputs.image }}
      shell: bash
      run: python3 ci/image.py start "$IMAGE"
