# Build the documentation site and deploy each commit main moves to, once
# require-main-check finds that commit's successful full `check` run. The site
# build captures the Rooms pictures from the shipped page, so it runs in the
# devcontainer, which owns cargo, Deno, and the Playwright browser, the same
# way `check` runs the gates.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Read the Python pin
        id: python
        run: |
          source .devcontainer/pins.sh
          echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Verify the exact commit passed check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$DEPLOY_SHA" = "$current"
          python3 tools/check/require-main-check.py "$DEPLOY_SHA"

      - name: Reclaim disk space for the toolchain image
        run: .devcontainer/ci/reclaim-disk.sh

      - name: Install the pinned Dev Containers CLI
        run: npm install -g "@devcontainers/cli@$(cat .devcontainer/ci/cli-version)"

      - name: Authenticate to the image cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Resolve or build the toolchain image
        id: image
        run: python3 .devcontainer/ci/image.py prepare

      - name: Start the prepared devcontainer
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: python3 .devcontainer/ci/image.py start "$IMAGE"

      - name: Build the site in the devcontainer
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json zig build site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: zig-out/site

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a stale Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$DEPLOY_SHA" = "$current"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
