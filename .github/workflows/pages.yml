# Build the documentation site and deploy it only after the full `check`
# workflow succeeds. The site build captures the Rooms pictures from the
# shipped page, so it runs in the devcontainer, which owns cargo, Deno, and
# the Playwright browser, the same way `check` runs the gates.
name: pages

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Read the Python pin
        id: python
        run: |
          source .devcontainer/pins.sh
          echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Verify the exact commit passed check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$DEPLOY_SHA" = "$current"
          python3 tools/check/require-main-check.py "$DEPLOY_SHA"

      # The CI action resolves Compose before it runs initializeCommand, so use
      # the same checkout configurator as a contributor and prepare the two
      # managed external networks it names.
      - name: Prepare the devcontainer's external networks
        run: |
          bash .devcontainer/bin/configure.sh
          docker network create glowcap-rooms-net 2>/dev/null || true
          docker network create glowcap-dev-main-egress 2>/dev/null || true

      - name: Build the site in the devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: zig build site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: zig-out/site

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a stale Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$DEPLOY_SHA" = "$current"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
