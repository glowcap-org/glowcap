# What a newcomer meets today: the installer on each supported host and the
# newest release's packages on each registry. Runs weekly and on demand, and
# fails when the site's installer, the release assets, or a registry no longer
# serve the newest release, so drift is seen before a reader reports it. Nothing
# is published. The macOS hosts run on demand only, because they cost ten times
# a Linux minute.
name: validate-release

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Bash with pipefail, so `curl | sh` fails when the download does.
defaults:
  run:
    shell: bash

jobs:
  newest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pins
        id: pins

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Read the newest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/github_release.py version --newest

  # The installer runs where the reader runs it: a bare host with no checkout.
  installer:
    needs: newest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: >-
          ${{ github.event_name == 'workflow_dispatch'
          && fromJSON('["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "macos-15-intel"]')
          || fromJSON('["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.newest.outputs.version }}
    steps:
      - name: Install the newest release through the site
        run: curl -fsSL https://glowcap.org/install.sh | sh

      - name: Run the installed product
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          glowcap version | tee version.txt
          grep -Fx "glowcap $VERSION" version.txt
          glowcap help > /dev/null

  registries:
    needs: newest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.newest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.newest.outputs.version }}
          persist-credentials: false

      - uses: ./.github/actions/pins
        id: pins

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Install the pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
          enable-cache: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.pins.outputs.deno }}

      # The checkout is the released tag, whose tree can predate the local
      # actions this workflow's branch holds, so this job uses only the pins
      # action every release carries and installs Rust from its output.
      - name: Install the pinned Rust
        env:
          RUST_VERSION: ${{ steps.pins.outputs.rust }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Bogdanp/setup-racket@8889db76ff6cdc86df8aa09fdd1729cd090b7144 # v1.16
        with:
          version: ${{ steps.pins.outputs.racket }}
          variant: CS
          distribution: minimal

      - name: Install every published package in a fresh consumer
        run: python3 tools/check/binding_packages.py --registry "$VERSION"
