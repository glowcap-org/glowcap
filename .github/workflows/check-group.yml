# One validation group: its build jobs each compile one shard of what the
# group's phases run, and then one test job per phase runs that phase on their
# combined state. Called by check.yml once per group the plan selects, so a
# group's tests wait for its own build and no other. ci/plan.py owns the
# groups, their phases, and their shard counts.
name: check-group

on:
  workflow_call:
    inputs:
      group:
        description: The group name, which keys its state artifact and caches.
        type: string
        required: true
      phases:
        description: JSON array of the ci/gates.sh phases this group runs.
        type: string
        required: true
      shards:
        description: JSON array of the build shards, 1 to n; empty when the phases compile at run time and there is nothing to hand over.
        type: string
        required: true
      full:
        description: The plan's full output.
        type: string
        required: true
      image:
        type: string
        required: true
      archive:
        type: string
        required: true

permissions:
  contents: read
  packages: read

# Cargo's fingerprint includes these, so the build and test jobs must agree on
# them or every test job rebuilds. Cargo's intermediate state is cached
# between runs, so incremental compilation would only add disk, and dev-profile
# debug info keeps source lines without the variable data that dominates a
# target directory; the Rooms test profile makes the same choice.
env:
  EXEC: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json --remote-env CARGO_INCREMENTAL=0 --remote-env CARGO_PROFILE_DEV_DEBUG=line-tables-only

jobs:
  build:
    # The default name lists the shard, and a skipped job, which never
    # expands its matrix, is plainly `build`.
    if: inputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Reclaim disk space for the prepared image
        run: .devcontainer/ci/reclaim-disk.sh

      # Workflow steps own transfer deadlines; composite steps cannot set one.
      - name: Download the unpublished PR image
        id: receive_image
        if: inputs.archive == 'true'
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: &image-download
          name: devcontainer-image
          path: ${{ runner.temp }}

      - name: Download the unpublished PR image again
        if: inputs.archive == 'true' && steps.receive_image.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: *image-download

      - uses: ./.devcontainer/ci/start
        with:
          image: ${{ inputs.image }}

      # Download stores are shared between runs. Installed tools and
      # credentials are never restored. The first shard, which runs every
      # Cargo and Deno build, saves them after its compile.
      - name: Restore dependency downloads
        id: downloads
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/glowcap/ci/zig-pkg
            ~/.cache/glowcap/cargo/registry
            ~/.cache/glowcap/cargo/git
            ~/.cache/glowcap/tool/deno/remote
            ~/.cache/glowcap/tool/deno/npm
            ~/.cache/glowcap/tool/uv
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ inputs.group }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh', '**/Cargo.lock', '**/deno.lock', '**/uv.lock') }}
          restore-keys: downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: List the compiled-state stores
        id: stores
        run: |
          {
            echo 'paths<<STORES'
            ci/state.sh stores
            echo STORES
          } >> "$GITHUB_OUTPUT"

      # Development runs start from the shard's last compile state, because a
      # hosted runner compiles cold an order of magnitude slower than a
      # workstation. Zig keys every object by its inputs and every proof
      # reruns in the test jobs, so a restore saves compile time and skips no
      # proof. A toolchain change starts a new family. Full qualification
      # builds cold: its result qualifies main, and it holds the cold build to
      # its budgets.
      - name: Restore build state
        if: inputs.full != 'true'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stores.outputs.paths }}
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.group }}-${{ matrix.shard }}of${{ strategy.job-total }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.group }}-${{ matrix.shard }}of${{ strategy.job-total }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}-

      - name: Bound the restored build state
        if: inputs.full != 'true'
        env:
          # The repository's cache quota is 10 GB compressed across every
          # shard, so a shard's state is held near its cold size instead of
          # growing: Zig's cache has no collector.
          LIMIT_GB: 12
          # Free disk the build needs beyond its restored state: the 6 GB
          # container image, zig-out, cargo outputs, and the packed state.
          # The check runs after the restore, so the floor is what the build
          # adds on top of the state, not the whole cold build.
          FREE_FLOOR_GB: 20
        run: |
          names=$(ci/state.sh stores)
          present=()
          while IFS= read -r store; do
            if [ -e "$store" ]; then present+=("$store"); fi
          done <<<"$names"
          size=0
          if [ "${#present[@]}" -gt 0 ]; then
            du -sh "${present[@]}"
            size=$(du -s --block-size=1G "${present[@]}" | awk '{ total += $1 } END { print total + 0 }')
          fi
          free=$(df --output=avail --block-size=1G / | tail -1 | tr -d ' ')
          echo "Restored build state: ${size} GB of ${LIMIT_GB} GB, ${free} GB free"
          # The running container mounts the stores, so a drop empties each
          # in place: a removed directory leaves its mount on a deleted inode,
          # and every write through it fails.
          if [ "$size" -gt "$LIMIT_GB" ] || [ "$free" -lt "$FREE_FLOOR_GB" ]; then
            for store in ${present[@]+"${present[@]}"}; do
              find "$store" -mindepth 1 -delete
            done
            echo "Dropped it; this run builds cold and saves a fresh state."
          fi

      - name: Fetch pinned Zig dependencies
        id: fetch
        run: $EXEC bash ci/fetch-zig.sh

      - name: Stamp the checkout to the commit time
        run: ci/state.sh stamp

      - name: Compile this shard of what the group's phases run
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PHASES: ${{ join(fromJSON(inputs.phases), ' ') }}
        run: $EXEC bash ci/gates.sh --compile-only "$SHARD" $PHASES

      - name: Save dependency downloads
        if: ${{ !cancelled() && matrix.shard == 1 && steps.fetch.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/glowcap/ci/zig-pkg
            ~/.cache/glowcap/cargo/registry
            ~/.cache/glowcap/cargo/git
            ~/.cache/glowcap/tool/deno/remote
            ~/.cache/glowcap/tool/deno/npm
            ~/.cache/glowcap/tool/uv
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ inputs.group }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh', '**/Cargo.lock', '**/deno.lock', '**/uv.lock') }}

      # The test jobs need the state even when one compile failed: each test
      # job compiles what is missing itself, so one run still reports every
      # failure in the group.
      - name: Pack the compiled state
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: ci/state.sh pack "$RUNNER_TEMP/state-${{ matrix.shard }}.tar.zst"

      # A transfer finishes in seconds or stalls with no end of its own, so
      # each one is bounded. The handoff is required and a stalled transfer
      # clears on a fresh attempt, so it retries once. A second failure fails
      # the job with the transfer's own error.
      - name: Hand the compiled state to the test jobs
        id: hand
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: &hand
          name: state-${{ inputs.group }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/state-${{ matrix.shard }}.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Hand the compiled state over again
        if: ${{ !cancelled() && steps.hand.outcome == 'failure' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: *hand

      # Pushes and nightly runs keep their compile state, even after a failed
      # compile. Pull requests only read it. A job whose container never
      # started holds no state, and saving it would hand the next run an
      # empty cache.
      - name: Save build state
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && github.event_name != 'pull_request' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stores.outputs.paths }}
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.group }}-${{ matrix.shard }}of${{ strategy.job-total }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

  test:
    needs: build
    # A failed build still hands over its state, so its phases run and report.
    # A group with no build shards skips the build job.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'failure' || needs.build.result == 'skipped') }}
    name: test (${{ matrix.phase }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(inputs.phases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Reclaim disk space for the prepared image
        run: .devcontainer/ci/reclaim-disk.sh

      - name: Download the unpublished PR image
        id: receive_image
        if: inputs.archive == 'true'
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: *image-download

      - name: Download the unpublished PR image again
        if: inputs.archive == 'true' && steps.receive_image.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: *image-download

      - uses: ./.devcontainer/ci/start
        with:
          image: ${{ inputs.image }}

      - name: Restore dependency downloads
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/glowcap/ci/zig-pkg
            ~/.cache/glowcap/cargo/registry
            ~/.cache/glowcap/cargo/git
            ~/.cache/glowcap/tool/deno/remote
            ~/.cache/glowcap/tool/deno/npm
            ~/.cache/glowcap/tool/uv
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ inputs.group }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh', '**/Cargo.lock', '**/deno.lock', '**/uv.lock') }}
          restore-keys: downloads-${{ runner.os }}-${{ runner.arch }}-

      # A pattern that matches one artifact extracts it into `path` itself, and
      # one that matches several gives each its own directory. Merging keeps
      # every shard's uniquely named archive in `path` either way.
      # Bounded and retried once, like the build job's handoff.
      - name: Receive the group's compiled state
        id: receive
        if: needs.build.result != 'skipped'
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: &receive
          pattern: state-${{ inputs.group }}-*
          path: ${{ runner.temp }}/state
          merge-multiple: true

      - name: Receive the group's compiled state again
        if: needs.build.result != 'skipped' && steps.receive.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: *receive

      # Zig's cache is content-addressed, so the shards' stores merge. The
      # first shard lands last: it ran every Cargo build, and Cargo judges
      # freshness by the modification times it recorded. Every shard of a
      # successful build packed, so a missing archive is a handoff defect. A
      # shard whose build failed before packing hands over nothing, and this
      # job compiles its share so the run still reports each phase.
      - name: Restore the group's compiled state
        if: needs.build.result != 'skipped'
        env:
          BUILD: ${{ needs.build.result }}
          SHARDS: ${{ inputs.shards }}
        run: |
          archives=()
          for shard in $(jq -r '.[]' <<<"$SHARDS" | sort -rn); do
            archive="$RUNNER_TEMP/state/state-$shard.tar.zst"
            if [ -e "$archive" ]; then
              archives+=("$archive")
            elif [ "$BUILD" = success ]; then
              echo "::error::Shard $shard built but its state is not at $archive."
              exit 1
            else
              echo "::warning::Shard $shard handed over no state; this job compiles its share."
            fi
          done
          for archive in ${archives[@]+"${archives[@]}"}; do
            ci/state.sh unpack "$archive"
            rm -f -- "$archive"
          done

      - name: Fetch pinned Zig dependencies
        id: fetch
        run: $EXEC bash ci/fetch-zig.sh

      - name: Stamp the checkout to the commit time
        run: ci/state.sh stamp

      - name: Run the phase
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: $EXEC bash ci/gates.sh ${{ matrix.phase }}

      # The evidence record is the run's product: what ran, on what, and how
      # each gate ended. It is kept on failure too, since a red run's record
      # is what names the gate that failed. A superseded run can be cancelled
      # before the recorder starts, so cancellation has no required artifact.
      - name: Keep the evidence record
        if: ${{ !cancelled() && hashFiles('zig-out/evidence/**/*.json') != '' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ github.sha }}-${{ matrix.phase }}
          path: zig-out/evidence/**/*.json
          if-no-files-found: error

      # A fuzz search never repeats, so the input that crashed a target is
      # the only way to replay what this run found. The fuzz runner leaves it
      # in the checkout, outside the build cache.
      - name: Keep a fuzzer finding
        if: ${{ !cancelled() && hashFiles('zig-out/fuzz-finding.bin') != '' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-finding-${{ github.sha }}-${{ matrix.phase }}
          path: zig-out/fuzz-finding.bin
          if-no-files-found: error

      - name: Summarize gate results
        if: ${{ !cancelled() }}
        run: |
          df -h /
          docker system df
          python3 - <<'PYTHON'
          import glob, json, os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('| Gate | Result | Seconds |\n| --- | --- | ---: |\n')
              for path in sorted(glob.glob('zig-out/evidence/**/*.json', recursive=True)):
                  record = json.load(open(path))
                  for gate in record['gates']:
                      result = 'passed' if gate['exit'] == 0 else f"failed ({gate['exit']})"
                      output.write(f"| `{gate['command']}` | {result} | {gate['seconds']} |\n")
          PYTHON
