# One validation group: its build jobs each compile one shard of what the
# group's phases run, then one test job per phase runs on their combined
# state. check.yml calls this once per group the plan selects, so a group's
# tests wait for its own build and no other. ci/groups.py owns the groups.
# Every step is one command: ci/gates.py runs inside the devcontainer,
# ci/state.py and image.py on the runner.
name: check-group

on:
  workflow_call:
    inputs:
      group:
        description: The group name, which keys its state artifact and caches.
        type: string
        required: true
      phases:
        description: JSON array of the group's phases, one test job each.
        type: string
        required: true
      shards:
        description: JSON array of the build shards, 1 to n; empty when the phases compile at run time and hand nothing over.
        type: string
        required: true
      image:
        type: string
        required: true
      archive:
        type: string
        required: true

permissions:
  contents: read
  packages: read

# Cargo's fingerprint includes these, so the build and test jobs must agree
# on them or every test job rebuilds. Incremental compilation would only add
# disk to a cached target directory, and line tables keep source positions
# without the variable data that dominates debug info.
env:
  EXEC: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json --remote-env CARGO_INCREMENTAL=0 --remote-env CARGO_PROFILE_DEV_DEBUG=line-tables-only --remote-env GLOWCAP_REQUIRE_IO_URING=1

jobs:
  build:
    # The default name lists the shard, and a skipped job, which never
    # expands its matrix, is plainly `build`.
    if: inputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The test job repeats these by alias. The cache is a transfer, so it
      # keeps its step deadline here rather than in a composite action.
      - &submodules-key
        name: Name the pinned submodules
        id: submodules
        run: python3 ci/submodules.py key

      - &submodules-restore
        name: Restore the pinned submodule objects
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/modules
          key: ${{ steps.submodules.outputs.key }}

      - &submodules-checkout
        name: Check out the pinned submodules
        run: python3 ci/submodules.py checkout

      - &reclaim
        run: python3 ci/image.py reclaim

      # Workflow steps own transfer deadlines, which composite steps cannot
      # set. A transfer finishes in seconds or stalls with no end of its own,
      # and a stalled one clears on a fresh attempt, so each required transfer
      # is bounded and retried once. The 1.62 GB image measured 255 s on a
      # hosted runner, so its bound is twice that.
      - &image-download
        name: Download the unpublished PR image
        id: receive_image
        if: inputs.archive == 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: &image-transfer
          name: devcontainer-image
          path: ${{ runner.temp }}

      - &image-download-again
        name: Download the unpublished PR image again
        if: inputs.archive == 'true' && steps.receive_image.outcome == 'failure'
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: *image-transfer

      - &start
        uses: ./.github/actions/start
        with:
          image: ${{ inputs.image }}

      # Download stores are shared between runs. Installed tools and
      # credentials are never restored. The first shard, which runs every
      # Cargo and Deno build, saves them after its compile.
      - name: Restore dependency downloads
        id: downloads
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &download-stores |
            ~/.cache/glowcap/ci/zig-pkg
            ~/.cache/glowcap/cargo/registry
            ~/.cache/glowcap/cargo/git
            ~/.cache/glowcap/tool/deno/remote
            ~/.cache/glowcap/tool/deno/npm
            ~/.cache/glowcap/tool/uv
          key: &download-key downloads-${{ runner.os }}-${{ runner.arch }}-${{ inputs.group }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh', '**/Cargo.lock', '**/deno.lock', '**/uv.lock') }}
          restore-keys: downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: List the compiled-state stores
        id: stores
        run: printf 'paths<<STORES\n%s\nSTORES\n' "$(python3 ci/state.py stores)" >> "$GITHUB_OUTPUT"

      # A pull request starts from the shard's last compile state, because a
      # hosted runner compiles cold an order of magnitude slower than a
      # workstation. Zig and Cargo key every object by its inputs and every
      # proof reruns in the test jobs, so a restore saves compile time and
      # skips no proof. Pushes, nightly, and manual runs build cold.
      - name: Restore build state
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stores.outputs.paths }}
          key: &build-key build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.group }}-${{ matrix.shard }}of${{ strategy.job-total }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.group }}-${{ matrix.shard }}of${{ strategy.job-total }}-

      # The cache quota is 10 GB compressed across every shard, so a shard's
      # state is held near its cold size: Zig's cache has no collector. The
      # build also needs 20 GB free beyond its state for the container image,
      # zig-out, Cargo outputs, and the packed archive.
      - name: Bound the restored build state
        if: github.event_name == 'pull_request'
        run: python3 ci/state.py bound 12 20

      - name: Fetch pinned Zig dependencies
        id: fetch
        run: $EXEC python3 ci/gates.py fetch

      - run: python3 ci/state.py stamp

      - name: Compile this shard of what the group's phases run
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PHASES: ${{ join(fromJSON(inputs.phases), ' ') }}
        run: $EXEC python3 ci/gates.py compile "$SHARD" $PHASES

      - name: Save dependency downloads
        if: ${{ !cancelled() && matrix.shard == 1 && steps.fetch.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *download-stores
          key: *download-key

      # The test jobs need the state even when one compile failed: each test
      # job compiles what is missing itself, so one run reports every failure
      # in the group.
      - name: Pack the compiled state
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 ci/state.py pack "$RUNNER_TEMP/state-$SHARD.tar.zst"

      - name: Hand the compiled state to the test jobs
        id: hand
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: &hand
          name: state-${{ inputs.group }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/state-${{ matrix.shard }}.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Hand the compiled state over again
        if: ${{ !cancelled() && steps.hand.outcome == 'failure' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: *hand

      # Pushes and nightly runs keep their compile state, even after a failed
      # compile. A job whose container never started holds no state, and
      # saving it would hand the next run an empty cache.
      - name: Save build state
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && github.event_name != 'pull_request' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stores.outputs.paths }}
          key: *build-key

  test:
    needs: build
    # A failed build still hands over its state, so its phases run and report.
    # A group with no build shards skips the build job.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'failure' || needs.build.result == 'skipped') }}
    name: test (${{ matrix.phase }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(inputs.phases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *submodules-key
      - *submodules-restore
      - *submodules-checkout

      - *reclaim
      - *image-download
      - *image-download-again
      - *start

      - name: Restore dependency downloads
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *download-stores
          key: *download-key
          restore-keys: downloads-${{ runner.os }}-${{ runner.arch }}-

      # Merging keeps every shard's uniquely named archive in `path`, whether
      # the pattern matched one artifact or several. Artifact downloads run at
      # 15 to 90 MB/s depending on the runner: the runtime group's 4.7 GB
      # state took over five minutes on a slow one, so the bound is twice that.
      - name: Receive the group's compiled state
        id: receive
        if: needs.build.result != 'skipped'
        timeout-minutes: 12
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: &receive
          pattern: state-${{ inputs.group }}-*
          path: ${{ runner.temp }}/state
          merge-multiple: true

      - name: Receive the group's compiled state again
        if: needs.build.result != 'skipped' && steps.receive.outcome == 'failure'
        timeout-minutes: 12
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: *receive

      # The transfer gives every cached file a new inode, and that alone makes
      # Zig rerun each step whose input is a built artifact. Zig names
      # anonymous symbols differently on each compile, so those archives
      # change bytes and Cargo relinks the Rooms peers: the first gate of a
      # test job pays about four minutes for this.
      - name: Restore the group's compiled state
        if: needs.build.result != 'skipped'
        env:
          SHARDS: ${{ inputs.shards }}
          BUILD: ${{ needs.build.result }}
        run: python3 ci/state.py restore "$RUNNER_TEMP/state" "$SHARDS" "$BUILD"

      - name: Fetch pinned Zig dependencies
        id: fetch
        run: $EXEC python3 ci/gates.py fetch

      - run: python3 ci/state.py stamp

      - name: Run the phase
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          PHASE: ${{ matrix.phase }}
        run: $EXEC python3 ci/gates.py run "$PHASE"

      # The evidence record is the run's product: what ran, on what, and how
      # each gate ended. A red run's record names the gate that failed. A
      # superseded run can be cancelled before the recorder starts, so
      # cancellation has no required artifact.
      - name: Keep the evidence record
        if: ${{ !cancelled() && hashFiles('zig-out/evidence/**/*.json') != '' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ github.sha }}-${{ matrix.phase }}
          path: zig-out/evidence/**/*.json
          if-no-files-found: error

      # A fuzz search never repeats, so the input that crashed a target is
      # the only way to replay what this run found.
      - name: Keep a fuzzer finding
        if: ${{ !cancelled() && hashFiles('zig-out/fuzz-finding.bin') != '' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-finding-${{ github.sha }}-${{ matrix.phase }}
          path: zig-out/fuzz-finding.bin
          if-no-files-found: error

      - name: Summarize gate results
        if: ${{ !cancelled() }}
        run: python3 ci/gates.py summary
