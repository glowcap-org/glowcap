# Coding-agent downloads have their own result so a vendor outage cannot
# prevent the product and interoperability checks in check.yml from running.
name: agent-tools

on:
  push:
    branches: [main, dev]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/agent-tools.yml"
      - "tools/run-with-timeout.py"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/agent-tools.yml"
      - "tools/run-with-timeout.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Reclaim disk space for the toolchain image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup

      - name: Install the pinned Dev Containers CLI
        run: npm install -g "@devcontainers/cli@$(cat .devcontainer/ci/cli-version)"

      - name: Authenticate to the image cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Resolve or build the toolchain image
        id: image
        run: python3 .devcontainer/ci/image.py prepare

      - name: Start the prepared devcontainer
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: python3 .devcontainer/ci/image.py start "$IMAGE"

      - name: Cold-install the pinned coding agents
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json python3 tools/run-with-timeout.py --kill-after 30s 20m bash .devcontainer/test/tool-install.sh claude codex cursor-agent opencode
