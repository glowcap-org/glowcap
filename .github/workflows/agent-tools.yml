# Coding-agent downloads have their own result so a vendor outage cannot
# prevent the product and interoperability checks in check.yml from running.
name: agent-tools

on:
  push:
    branches: [dev]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/agent-tools.yml"
      - "tools/run-with-timeout.py"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/agent-tools.yml"
      - "tools/run-with-timeout.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the pinned submodules
        id: submodules
        run: python3 ci/submodules.py key

      - name: Restore the pinned submodule objects
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/modules
          key: ${{ steps.submodules.outputs.key }}

      - name: Check out the pinned submodules
        run: python3 ci/submodules.py checkout

      - uses: ./.github/actions/image
        with:
          start: true

      - name: Cold-install the pinned coding agents
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json python3 tools/run-with-timeout.py --kill-after 30s 20m bash .devcontainer/test/tool-install.sh claude codex cursor-agent opencode
