# The release of a maintainer-signed version tag: four host products and C SDKs,
# the two-platform Rooms image, one GitHub release, and the registry packages.
#
# The tag names a main commit that passed full validation (contract). Each host
# builds its archives with `zig build c-sdk-pack glowcap-pack` and attests
# their build provenance (archives). Each Linux host builds and exercises the
# Rooms image from its exact product archive (images). One job then assembles
# the assets, publishes the image by digest, attests the image and its SBOM,
# renders the release page, downloads every provenance bundle, fills a draft
# release, and makes it public only when the draft holds every asset (release).
# The public release dispatches publish.yml at the tag for the registries.
#
# A job that fails is re-run from the Actions page with "Re-run failed jobs":
# the release job resumes its own draft and skips an image already pushed. A
# published version is never replaced, so a defect takes the next patch version.
# A workflow_dispatch run rehearses the builds and image proofs without
# attesting or publishing anything.
#
# The version is `abi_version` in build.zig, mirrored by `zig build set-version`.
# The devcontainer pins the toolchain; macOS hosts build on the runner directly
# because they cannot host the devcontainer. Decision: ADR-0075.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the product version
        id: version
        run: |
          version="$(jq -er '.abi_version | select(test("^0\\.[0-9]+\\.[0-9]+$"))' bindings/c-abi-resolve.json)"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Require the tag of this version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "release tag $GITHUB_REF_NAME does not match the tree's version v$VERSION" >&2
            exit 1
          fi

      - uses: ./.github/actions/pins
        id: pins

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Require this commit's successful check workflow
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/require_main_check.py "$GITHUB_SHA"

      - name: Require the version's changelog entry
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 ci/release_notes.py --changelog "$VERSION"

  archives:
    needs: contract
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64-linux; glibc floor shared with ARM64
            target: x86_64-linux-gnu.2.39
          - runner: ubuntu-24.04-arm # aarch64-linux
            target: aarch64-linux-gnu.2.39
          - runner: macos-15 # aarch64-macos
            target: aarch64-macos.15.0
          - runner: macos-15-intel # x86_64-macos
            target: x86_64-macos.15.0
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      # c-sdk-pack needs no conformance submodule, so no
      # `submodules: recursive` here. Nothing is restored from a cache: a
      # release builds from the pinned downloads alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - uses: ./.github/actions/pins
        id: pins

      - name: Install the pinned Rust
        env:
          RUST_VERSION: ${{ steps.pins.outputs.rust }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup component add llvm-tools

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Fetch pinned Zig dependencies
        run: python3 ci/gates.py fetch

      - name: Check release packaging contracts
        run: zig build glowcap-package-test --summary all

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.pins.outputs.deno }}

      - name: Install the matching browser compiler
        run: |
          rustup target add wasm32-unknown-unknown
          version="$(python3 .devcontainer/image/rooms-toolchain-version.py)"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the release archives
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
            export SDKROOT
          fi
          zig build -Doptimize=ReleaseSafe c-sdk-pack glowcap-pack -Dcpu=baseline "-Dtarget=$RELEASE_TARGET"

      - name: Build and verify portable SDK archives
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          source .devcontainer/pins.sh
          npx --yes "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium
          zig build portable-sdk-test

      - name: Verify the Zig source package
        run: zig build consumer-check --summary all

      - name: Attest the archives' build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            zig-out/release/*.tar.gz
            zig-out/glowcap-release/*.tar.gz
            zig-out/portable-release/*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Preserve the product when its proof fails, so a corrected harness can
        # exercise that exact archive without another toolchain/product build.
        if: ${{ !cancelled() && hashFiles('zig-out/glowcap-release/*.tar.gz') != '' }}
        timeout-minutes: 5
        with:
          name: archives-${{ matrix.runner }}
          path: |
            zig-out/release/*.tar.gz
            zig-out/release/SHA256SUMS
            zig-out/glowcap-release/*.tar.gz
            zig-out/portable-release/*.tar.gz
            zig-out/glowcap-release/SHA256SUMS
            zig-out/portable-release/SHA256SUMS
          if-no-files-found: error

  images:
    needs: [contract, archives]
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            archive_arch: x86_64
            image_arch: amd64
          - runner: ubuntu-24.04-arm
            archive_arch: aarch64
            image_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.contract.outputs.version }}
      ARCHIVE_ARCH: ${{ matrix.archive_arch }}
      IMAGE_ARCH: ${{ matrix.image_arch }}
      IMAGE: ghcr.io/glowcap-org/glowcap-rooms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pins
        id: pins

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: archives-${{ matrix.runner }}
          path: archive-artifact

      - name: Extract the verified Linux product
        run: |
          archive="$(find archive-artifact -type f -name "glowcap-v${VERSION}-${ARCHIVE_ARCH}-linux.tar.gz" -print -quit)"
          if [ -z "$archive" ]; then
            echo "missing Linux product archive for $ARCHIVE_ARCH" >&2
            exit 1
          fi
          (cd "$(dirname "$archive")" && sha256sum --check SHA256SUMS)
          mkdir image-context
          tar --extract --gzip --file "$archive" --directory image-context --no-same-owner

      - name: Build the exact Docker image artifact
        run: |
          mkdir image-artifact
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          docker buildx build \
            --platform "linux/$IMAGE_ARCH" \
            --build-arg SOURCE_DATE_EPOCH \
            --file image-context/share/glowcap/deployment/rooms.Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=v$VERSION" \
            --tag "$IMAGE:v$VERSION-$IMAGE_ARCH" \
            --load \
            image-context
          # The runner's Docker driver loads images directly. Save that image
          # instead of requiring a separate builder's file-export support.
          docker image save --output "image-artifact/glowcap-rooms-v$VERSION-$IMAGE_ARCH.docker.tar" \
            "$IMAGE:v$VERSION-$IMAGE_ARCH"
          (cd image-artifact && sha256sum *.docker.tar > SHA256SUMS)

      - name: Load and exercise the exact image artifact
        run: |
          docker image load --input "image-artifact/glowcap-rooms-v$VERSION-$IMAGE_ARCH.docker.tar"
          python3 tools/check/glowcap_release_image.py "$IMAGE:v$VERSION-$IMAGE_ARCH" "$IMAGE_ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: rooms-image-${{ matrix.image_arch }}
          path: image-artifact
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [contract, archives, images]
    timeout-minutes: 25
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.contract.outputs.version }}
      IMAGE: ghcr.io/glowcap-org/glowcap-rooms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pins
        id: pins

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 10
        with:
          path: artifacts

      - name: Package the Racket binding
        run: python3 ci/github_release.py racket-package "$RELEASE_TAG"

      - name: Assemble the release assets
        run: python3 ci/github_release.py assemble artifacts "$RELEASE_TAG"

      - name: Attest the Racket package and checksum files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/SHA256SUMS
            release-assets/*.zip
            release-assets/*.CHECKSUM

      - name: Publish the versioned multi-platform Rooms image
        id: image
        run: python3 ci/release_image.py artifacts

      - name: Attest the image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/glowcap-org/glowcap-rooms
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Write the image's software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/glowcap-org/glowcap-rooms@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: release-assets/glowcap-rooms-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Attest the image's software bill of materials
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/glowcap-org/glowcap-rooms
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: release-assets/glowcap-rooms-${{ github.ref_name }}.spdx.json
          push-to-registry: true

      - name: Render the release page and download every provenance bundle
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 ci/release_notes.py --facts artifacts/release.json \
            --image-digest "$IMAGE_DIGEST" --output artifacts/release-notes.md
          python3 ci/github_release.py bundles "$RELEASE_TAG"

      - name: Fill the draft release, then make it public
        run: |
          python3 ci/github_release.py draft-state "$RELEASE_TAG" > artifacts/release-state.json
          if ! jq -e '.draft_exists' artifacts/release-state.json > /dev/null; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "glowcap $RELEASE_TAG alpha" \
              --prerelease \
              --draft \
              --latest=false \
              --verify-tag \
              --notes-file artifacts/release-notes.md
          fi
          while IFS= read -r asset; do
            gh release upload "$RELEASE_TAG" "release-assets/$asset" --repo "$GITHUB_REPOSITORY"
          done < <(jq -r '.missing_assets[]' artifacts/release-state.json)
          python3 ci/github_release.py verify-draft "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false \
            --notes-file artifacts/release-notes.md

      - name: Publish the language packages at the tag
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "refs/tags/$RELEASE_TAG" -f tag="$RELEASE_TAG"
