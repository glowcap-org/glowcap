# The hosted C release: build the complete archive set per platform with
# `zig build -Doptimize=ReleaseSafe release-pack`. A matching version tag on an
# exact commit that passed check.yml authorizes publication of every tarball and
# one combined SHA256SUMS. workflow_dispatch builds and uploads CI artifacts
# only — never creates a GitHub release. Versioning is `abi_version` in
# build.zig (reported by `glowcap_abi_version`); the tag records the release
# point. This is the find leg's upstream named in bindings/README.md: a
# runtime-download or per-platform packaging leg resolves archives from here.
#
# The devcontainer stays the canonical toolchain authority: this workflow reads
# the same .devcontainer/pins.sh versions. macOS legs build on the GitHub
# runners directly because macOS runners cannot host the devcontainer.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  contract:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the ABI version tag
        if: github.ref_type == 'tag'
        run: |
          expected_tag="v$(jq -r '.abi_version' bindings/c-abi-resolve.json)"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "release tag $GITHUB_REF_NAME does not match ABI tag $expected_tag" >&2
            exit 1
          fi

      - name: Require this commit's successful check workflow
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a push run carries the full gate sequence; a pull-request run
          # of the same workflow is the short Zig-only lane and is no evidence.
          check_url="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" |
              jq -r --arg sha "$GITHUB_SHA" \
                '.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success" and .event == "push") | .html_url' |
              head -n 1
          )"
          if [ -z "$check_url" ]; then
            echo "release commit $GITHUB_SHA has no completed successful check.yml run" >&2
            exit 1
          fi
          echo "release evidence: $check_url"

  archives:
    needs: contract
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest # x86_64-linux
          - runner: ubuntu-24.04-arm # aarch64-linux
          - runner: macos-15 # aarch64-macos
          - runner: macos-15-intel # x86_64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      # release-pack needs no conformance submodule, so no
      # `submodules: recursive` here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Install the pinned Rust
        run: |
          source .devcontainer/pins.sh
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Build the release tarball
        run: zig build -Doptimize=ReleaseSafe release-pack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives-${{ matrix.runner }}
          path: |
            zig-out/release/*.tar.gz
            zig-out/release/SHA256SUMS
          if-no-files-found: error

  release:
    needs: archives
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Assemble release archives and combined checksums
        run: |
          mkdir release-assets
          find artifacts -name '*.tar.gz' -exec mv {} release-assets/ \;
          cat artifacts/*/SHA256SUMS | sort -k2 > release-assets/SHA256SUMS
          ls -l release-assets

      - name: Attest release archives and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS

      - name: Create the release with archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "glowcap C archives $GITHUB_REF_NAME" \
            --verify-tag \
            --notes "Per-platform glowcap C archive sets (static and shared libraries, headers, product binaries, authorship disclosure, and licenses). Read the tagged [project provenance](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/PROVENANCE.md). Verify SHA256SUMS, then verify the GitHub artifact attestation with \`gh attestation verify --repo $GITHUB_REPOSITORY <archive>\`. The ABI version is reported by \`glowcap_abi_version\`." \
            release-assets/*
