# The hosted product, C SDK, and Rooms image release. Matching host archives are
# built first with `zig build -Doptimize=ReleaseSafe release-pack glowcap-pack
# -Dcpu=baseline`. Each Linux runner then builds and exercises its image
# from that exact product archive. A matching version tag on an exact commit
# that passed full main checks authorizes publication of every tarball, one combined
# SHA256SUMS, and the two-platform Rooms image. A normal workflow_dispatch
# builds, tests, and uploads artifacts without publication. recheck_run
# exercises installed products without recompiling or qualifying source packages.
# publish_run and publish_tag recover publication from a tested signed tag run,
# without building products or moving the tag.
# Versioning is `abi_version` in
# build.zig (reported by `glowcap_abi_version`); the tag records the release
# point. This is the find leg's upstream named in bindings/README.md: a
# runtime-download or per-platform packaging leg resolves archives from here.
#
# The devcontainer stays the canonical toolchain authority: this workflow reads
# the same .devcontainer/pins.sh versions. macOS legs build on the GitHub
# runners directly because macOS runners cannot host the devcontainer.
name: release

on:
  workflow_dispatch:
    inputs:
      recheck_run:
        description: "Recheck installed products from this release run ID (no build or publication)"
        type: string
        default: ""
      publish_run:
        description: "Publish tested artifacts from this tag run ID (no builds)"
        type: string
        default: ""
      publish_tag:
        description: "Existing signed tag to recover; requires publish_run"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  contract:
    timeout-minutes: 5
    outputs:
      version: ${{ steps.recovery.outputs.version || steps.version.outputs.value }}
      tag: ${{ steps.recovery.outputs.tag || github.ref_name }}
      source_run: ${{ steps.recovery.outputs.source_run || github.run_id }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate dispatch mode
        env:
          RECHECK_RUN: ${{ inputs.recheck_run }}
          PUBLISH_RUN: ${{ inputs.publish_run }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          if { [ -n "$PUBLISH_RUN" ] || [ -n "$PUBLISH_TAG" ]; } &&
             { [ -z "$PUBLISH_RUN" ] || [ -z "$PUBLISH_TAG" ] || [ -n "$RECHECK_RUN" ]; }; then
            echo "publication recovery requires both publish_run and publish_tag, without recheck_run" >&2
            exit 1
          fi

      - name: Read the product version
        if: inputs.publish_run == '' && inputs.publish_tag == ''
        id: version
        run: |
          version="$(jq -er '.abi_version | select(test("^0\\.[0-9]+\\.[0-9]+$"))' bindings/c-abi-resolve.json)"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Require the ABI version tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          expected_tag="v$(jq -r '.abi_version' bindings/c-abi-resolve.json)"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "release tag $GITHUB_REF_NAME does not match ABI tag $expected_tag" >&2
            exit 1
          fi

      - name: Read the Python pin
        id: python
        run: |
          source .devcontainer/pins.sh
          echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Require this commit's successful check workflow
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check/require-main-check.py "$GITHUB_SHA"

      - name: Verify publication recovery source
        if: github.event_name == 'workflow_dispatch' && inputs.publish_run != '' && inputs.publish_tag != ''
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.publish_run }}
          RELEASE_TAG: ${{ inputs.publish_tag }}
        run: python3 tools/check/release_recovery.py "$SOURCE_RUN" "$RELEASE_TAG"

  archives:
    if: github.event_name != 'workflow_dispatch' || (inputs.recheck_run == '' && inputs.publish_run == '' && inputs.publish_tag == '')
    needs: contract
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64-linux; glibc floor shared with ARM64
            target: x86_64-linux-gnu.2.39
          - runner: ubuntu-24.04-arm # aarch64-linux
            target: aarch64-linux-gnu.2.39
          - runner: macos-15 # aarch64-macos
            target: aarch64-macos.15.0
          - runner: macos-15-intel # x86_64-macos
            target: x86_64-macos.15.0
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      # release-pack needs no conformance submodule, so no
      # `submodules: recursive` here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Install the pinned Rust
        run: |
          source .devcontainer/pins.sh
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup component add llvm-tools

      - name: Read test and browser tool pins
        id: python
        run: |
          source .devcontainer/pins.sh
          echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "deno=$DENO_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Restore Zig package downloads
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-pkg
          key: zig-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}

      - name: Fetch pinned Zig dependencies
        run: |
          bash ci/fetch-zig.sh

      - name: Check release packaging contracts
        run: zig build glowcap-package-test --summary all

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.python.outputs.deno }}

      - name: Install the matching browser compiler
        run: |
          rustup target add wasm32-unknown-unknown
          version="$(python3 .devcontainer/image/rooms-toolchain-version.py)"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the release tarball
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
            export SDKROOT
          fi
          zig build -Doptimize=ReleaseSafe release-pack glowcap-pack -Dcpu=baseline -Dtarget=${{ matrix.target }}

      - name: Verify the Zig source package
        run: zig build consumer-check --summary all

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Preserve the product when its proof fails, so a corrected harness can
        # exercise that exact archive without another toolchain/product build.
        if: ${{ !cancelled() && hashFiles('zig-out/glowcap-release/*.tar.gz') != '' }}
        timeout-minutes: 5
        with:
          name: archives-${{ matrix.runner }}
          path: |
            zig-out/release/*.tar.gz
            zig-out/release/SHA256SUMS
            zig-out/glowcap-release/*.tar.gz
            zig-out/glowcap-release/SHA256SUMS
          if-no-files-found: error

  recheck:
    if: github.event_name == 'workflow_dispatch' && inputs.recheck_run != '' && inputs.publish_run == '' && inputs.publish_tag == ''
    needs: contract
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the recheck Python pin
        id: python
        run: |
          source .devcontainer/pins.sh
          echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: archives-${{ matrix.runner }}
          path: archive-artifact
          run-id: ${{ inputs.recheck_run }}
          github-token: ${{ github.token }}

      - name: Recheck the installed product
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          import sys
          products = list(Path('archive-artifact/glowcap-release').glob('glowcap-v*.tar.gz'))
          if len(products) != 1:
              raise SystemExit(f'expected one product archive, found {len(products)}')
          product = products[0]
          with product.open('rb') as archive:
              digest = hashlib.file_digest(archive, 'sha256').hexdigest()
          if product.with_name('SHA256SUMS').read_text().split() != [digest, product.name]:
              raise SystemExit('product archive checksum mismatch')
          result = subprocess.run([sys.executable, 'tools/check/glowcap_release.py', str(product)])
          raise SystemExit(result.returncode)
          PY

  images:
    needs: [contract, archives, recheck]
    if: ${{ !cancelled() && needs.contract.result == 'success' && (needs.archives.result == 'success' || needs.recheck.result == 'success') }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            archive_arch: x86_64
            image_arch: amd64
          - runner: ubuntu-24.04-arm
            archive_arch: aarch64
            image_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the test tool pin
        id: python
        run: |
          source .devcontainer/pins.sh
          echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives-${{ matrix.runner }}
          path: archive-artifact
          run-id: ${{ inputs.recheck_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Extract the verified Linux product
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          ARCHIVE_ARCH: ${{ matrix.archive_arch }}
        run: |
          archive="$(find archive-artifact -type f -name "glowcap-v${VERSION}-${ARCHIVE_ARCH}-linux.tar.gz" -print -quit)"
          if [ -z "$archive" ]; then
            echo "missing Linux product archive for $ARCHIVE_ARCH" >&2
            exit 1
          fi
          (cd "$(dirname "$archive")" && sha256sum --check SHA256SUMS)
          mkdir image-context
          tar --extract --gzip --file "$archive" --directory image-context --no-same-owner

      - name: Build the exact Docker image artifact
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          IMAGE_ARCH: ${{ matrix.image_arch }}
          IMAGE: ghcr.io/glowcap-org/glowcap-rooms
        run: |
          mkdir image-artifact
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          docker buildx build \
            --platform "linux/$IMAGE_ARCH" \
            --build-arg SOURCE_DATE_EPOCH \
            --file image-context/share/glowcap/deployment/rooms.Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=v$VERSION" \
            --tag "$IMAGE:v$VERSION-$IMAGE_ARCH" \
            --load \
            image-context
          # The runner's Docker driver loads images directly. Save that image
          # instead of requiring a separate builder's file-export support.
          docker image save --output "image-artifact/glowcap-rooms-v$VERSION-$IMAGE_ARCH.docker.tar" \
            "$IMAGE:v$VERSION-$IMAGE_ARCH"
          (cd image-artifact && sha256sum *.docker.tar > SHA256SUMS)

      - name: Load and exercise the exact image artifact
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          IMAGE_ARCH: ${{ matrix.image_arch }}
          IMAGE: ghcr.io/glowcap-org/glowcap-rooms
        run: |
          docker image load --input "image-artifact/glowcap-rooms-v$VERSION-$IMAGE_ARCH.docker.tar"
          python3 tools/check/glowcap_release_image.py "$IMAGE:v$VERSION-$IMAGE_ARCH" "$IMAGE_ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rooms-image-${{ matrix.image_arch }}
          path: image-artifact
          if-no-files-found: error

  release:
    needs: [contract, archives, images]
    timeout-minutes: 25
    concurrency:
      group: release-publication-${{ needs.contract.outputs.tag }}
      cancel-in-progress: false
    if: >-
      !cancelled() && needs.contract.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
        needs.archives.result == 'success' && needs.images.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_run != '' && inputs.publish_tag != '' && inputs.recheck_run == ''))
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read publication Python pin
        id: python
        run: |
          source .devcontainer/pins.sh
          echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Verify and assemble tested release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.contract.outputs.source_run }}
          RELEASE_TAG: ${{ needs.contract.outputs.tag }}
        run: |
          python3 tools/check/release_recovery.py "$SOURCE_RUN" "$RELEASE_TAG" --prepare --current
          python3 tools/gen/release_notes.py --assets release-assets \
            --provenance artifacts/publication-provenance.json --output artifacts/release-notes.md

      - name: Attest release archives and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          predicate-type: https://glowcap.org/attestations/release-publication/v1
          predicate-path: artifacts/publication-provenance.json
          subject-path: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS

      - name: Publish the versioned multi-platform Rooms image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/glowcap-org/glowcap-rooms
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            archive="$(find "artifacts/rooms-image-$arch" -type f -name "glowcap-rooms-v$VERSION-$arch.docker.tar" -print -quit)"
            if [ -z "$archive" ]; then
              echo "missing Rooms image artifact for $arch" >&2
              exit 1
            fi
            (cd "$(dirname "$archive")" && sha256sum --check SHA256SUMS)
            docker image load --input "$archive"
            expected="$(docker image inspect --format '{{.Id}}' "$IMAGE:v$VERSION-$arch")"
            if docker buildx imagetools inspect --raw "$IMAGE:v$VERSION-$arch" > remote-image.json 2> image-lookup-error; then
              jq -e --arg expected "$expected" '.config.digest == $expected' remote-image.json
            else
              grep -Eq 'manifest unknown|: not found$' image-lookup-error || { cat image-lookup-error >&2; exit 1; }
              touch "push-$arch"
            fi
          done
          if docker buildx imagetools inspect --raw "$IMAGE:v$VERSION" > remote-index.json 2> image-lookup-error; then
            # An existing version must already have both matching platform tags.
            if [ -e push-amd64 ] || [ -e push-arm64 ]; then
              echo "existing version has a missing platform tag; refusing to alter it" >&2
              exit 1
            fi
          else
            grep -Eq 'manifest unknown|: not found$' image-lookup-error || { cat image-lookup-error >&2; exit 1; }
            touch create-index
          fi
          for arch in amd64 arm64; do
            if [ -e "push-$arch" ]; then
              docker image push "$IMAGE:v$VERSION-$arch"
            fi
            digest="$(docker buildx imagetools inspect --raw "$IMAGE:v$VERSION-$arch" | sha256sum | cut -d ' ' -f 1)"
            case "$arch" in
              amd64) amd64_source="$IMAGE@sha256:$digest" ;;
              arm64) arm64_source="$IMAGE@sha256:$digest" ;;
            esac
          done
          if [ ! -e create-index ]; then
            jq -e --arg amd64 "${amd64_source#*@}" --arg arm64 "${arm64_source#*@}" \
              '[.manifests[] | [(.platform.os + "/" + .platform.architecture), .digest]] | sort == [["linux/amd64", $amd64], ["linux/arm64", $arm64]]' remote-index.json
          else
            docker buildx imagetools create \
              --tag "$IMAGE:v$VERSION" \
              "$amd64_source" \
              "$arm64_source"
          fi
          docker buildx imagetools inspect --raw "$IMAGE:v$VERSION" | \
            jq -e '[.manifests[].platform | (.os + "/" + .architecture)] | sort == ["linux/amd64", "linux/arm64"]'

      - name: Create the release with archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.contract.outputs.tag }}
          SOURCE_RUN: ${{ needs.contract.outputs.source_run }}
        run: |
          if ! jq -e '.draft_exists' artifacts/release-state.json > /dev/null; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "glowcap $RELEASE_TAG alpha" \
              --prerelease \
              --draft \
              --latest=false \
              --verify-tag \
              --notes-file artifacts/release-notes.md
          fi
          while IFS= read -r asset; do
            gh release upload "$RELEASE_TAG" "release-assets/$asset" --repo "$GITHUB_REPOSITORY"
          done < <(jq -r '.missing_assets[]' artifacts/release-state.json)
          python3 tools/check/release_recovery.py "$SOURCE_RUN" "$RELEASE_TAG" --verify-draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false \
            --notes-file artifacts/release-notes.md
