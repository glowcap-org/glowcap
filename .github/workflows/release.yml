# The hosted C release: build the complete archive set per platform with
# `zig build release-pack`. On a version tag, attach every tarball plus one
# combined SHA256SUMS to the GitHub release when the resolve contract's
# `releases_published` is true. workflow_dispatch builds and uploads CI
# artifacts only — never creates a GitHub release. Versioning is `abi_version`
# in build.zig (reported by `pancake_abi_version`); the tag records the release
# point. This is the find leg's upstream named in bindings/README.md: a
# runtime-download or per-platform packaging leg resolves archives from here.
#
# The devcontainer stays the canonical toolchain authority: this workflow reads
# the same .devcontainer/pins.sh versions. macOS legs build on the GitHub
# runners directly because macOS runners cannot host the devcontainer.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  archives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest # x86_64-linux
          - runner: ubuntu-24.04-arm # aarch64-linux
          - runner: macos-15 # aarch64-macos
          - runner: macos-13 # x86_64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      # release-pack needs no conformance submodule, so no
      # `submodules: recursive` here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Install the pinned Rust
        run: |
          source .devcontainer/pins.sh
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Build the release tarball
        run: zig build release-pack

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archives-${{ matrix.runner }}
          path: |
            zig-out/release/*.tar.gz
            zig-out/release/SHA256SUMS
          if-no-files-found: error

  release:
    needs: archives
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check whether C archive publish is enabled
        id: publish
        run: |
          if jq -e '.releases_published == true' bindings/c-abi-resolve.json >/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::release skipped: releases_published is false in bindings/c-abi-resolve.json"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.publish.outputs.enabled == 'true'
        with:
          path: artifacts

      - name: Assemble release archives and combined checksums
        if: steps.publish.outputs.enabled == 'true'
        run: |
          mkdir release-assets
          find artifacts -name '*.tar.gz' -exec mv {} release-assets/ \;
          cat artifacts/*/SHA256SUMS | sort -k2 > release-assets/SHA256SUMS
          ls -l release-assets

      - name: Create the release with archives
        if: steps.publish.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "pancake C archives $GITHUB_REF_NAME" \
            --verify-tag \
            --notes "Per-platform pancake C archive sets (static + shared libraries, headers, licenses). Verify with SHA256SUMS. The ABI version is reported by \`pancake_abi_version\`." \
            release-assets/*
