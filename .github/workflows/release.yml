# The release of a maintainer-signed version tag: four host products and C SDKs,
# the two-platform Rooms image, one GitHub release, and the registry packages.
#
# The tag names a main commit that passed full validation (contract). Each host
# builds its archives with `zig build c-sdk-pack glowcap-pack` and attests
# their build provenance (archives). Each Linux host builds and exercises the
# Rooms image from its exact product archive (images). One job then assembles
# the assets, publishes the image by digest, attests the image and its SBOM,
# renders the release page, downloads every provenance bundle, fills a draft
# release, and makes it public only when the draft holds every asset (release).
# The public release dispatches publish.yml at the tag for the registries.
#
# A job that fails is re-run from the Actions page with "Re-run failed jobs":
# the release job restores its saved evidence, resumes its own draft, and skips
# an image already pushed. The saved generation must survive until publication. A
# published version is never replaced, so a defect takes the next patch version.
# A workflow_dispatch run rehearses the builds and image proofs without
# attesting or publishing anything.
#
# The version is `abi_version` in build.zig, mirrored by `zig build set-version`.
# The devcontainer pins the toolchain; macOS hosts build on the runner directly
# because they cannot host the devcontainer. Decision: ADR-0075.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pins
        id: pins

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Read the product version
        id: version
        run: python3 ci/github_release.py version

      - name: Require the tag of this version
        if: github.ref_type == 'tag'
        run: python3 ci/github_release.py version "$GITHUB_REF_NAME"

      - name: Require this commit's successful check workflow
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/require_main_check.py "$GITHUB_SHA"

      - name: Require the version's changelog entry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 ci/release_notes.py --changelog "$VERSION"

  archives:
    needs: contract
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64-linux; glibc floor shared with ARM64
            target: x86_64-linux-gnu.2.39
          - runner: ubuntu-24.04-arm # aarch64-linux
            target: aarch64-linux-gnu.2.39
          - runner: macos-15 # aarch64-macos
            target: aarch64-macos.15.0
          - runner: macos-15-intel # x86_64-macos
            target: x86_64-macos.15.0
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      # c-sdk-pack needs no conformance submodule, so this job skips the
      # submodules action. Nothing is restored from a cache: a
      # release builds from the pinned downloads alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/zig

      - uses: ./.github/actions/pins
        id: pins

      # The sidecar inspection reads exports with the producing toolchain's llvm-nm.
      - uses: ./.github/actions/rust
        with:
          components: llvm-tools

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Fetch pinned Zig dependencies
        run: python3 ci/gates.py fetch

      - name: Check release packaging contracts
        run: zig build glowcap-package-test --summary all

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.pins.outputs.deno }}

      - name: Install the matching browser compiler
        run: python3 ci/release_build.py browser-compiler

      - name: Build the release archives
        run: python3 ci/release_build.py archives "$RELEASE_TARGET"

      - name: Build and verify the browser bundle and WebAssembly libraries
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 ci/release_build.py browser-bundle

      - name: Verify the Zig source package
        run: zig build consumer-check --summary all

      - name: Attest the archives' build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            zig-out/release/*.tar.gz
            zig-out/glowcap-release/*.tar.gz
            zig-out/portable-release/*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Preserve the product when its proof fails, so a corrected harness can
        # exercise that exact archive without another toolchain/product build.
        if: ${{ !cancelled() && hashFiles('zig-out/glowcap-release/*.tar.gz') != '' }}
        timeout-minutes: 5
        with:
          name: archives-${{ matrix.runner }}
          path: |
            zig-out/release/*.tar.gz
            zig-out/release/SHA256SUMS
            zig-out/glowcap-release/*.tar.gz
            zig-out/portable-release/*.tar.gz
            zig-out/glowcap-release/SHA256SUMS
            zig-out/portable-release/SHA256SUMS
          if-no-files-found: error

  images:
    needs: [contract, archives]
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            archive_arch: x86_64
            image_arch: amd64
          - runner: ubuntu-24.04-arm
            archive_arch: aarch64
            image_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.contract.outputs.version }}
      ARCHIVE_ARCH: ${{ matrix.archive_arch }}
      IMAGE_ARCH: ${{ matrix.image_arch }}
      IMAGE: ghcr.io/glowcap-org/glowcap-rooms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pins
        id: pins

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: archives-${{ matrix.runner }}
          path: archive-artifact

      - name: Extract the verified Linux product
        run: python3 ci/release_image.py context

      - name: Build the exact Docker image artifact
        run: python3 ci/release_image.py build

      - name: Load and exercise the exact image artifact
        run: python3 ci/release_image.py exercise

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: rooms-image-${{ matrix.image_arch }}
          path: image-artifact
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [contract, archives, images]
    timeout-minutes: 25
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.contract.outputs.version }}
      IMAGE: ghcr.io/glowcap-org/glowcap-rooms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pins
        id: pins

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Find this run's prepared release
        id: prepared
        run: python3 ci/github_release.py prepared-state "$RELEASE_TAG"

      - name: Restore this run's prepared release
        if: steps.prepared.outputs.artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          artifact-ids: ${{ steps.prepared.outputs.artifact_id }}
          merge-multiple: true
          path: .

      - name: Download the build artifacts for preparation
        if: steps.prepared.outputs.artifact_id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 10
        with:
          path: artifacts

      - name: Package the Racket binding
        if: steps.prepared.outputs.artifact_id == ''
        run: python3 ci/github_release.py racket-package "$RELEASE_TAG"

      - name: Assemble the release assets
        if: steps.prepared.outputs.artifact_id == ''
        run: python3 ci/github_release.py assemble artifacts "$RELEASE_TAG"

      - name: Attest the Racket package and checksum files
        if: steps.prepared.outputs.artifact_id == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/SHA256SUMS
            release-assets/*.zip
            release-assets/*.CHECKSUM

      - name: Publish the versioned multi-platform Rooms image
        if: steps.prepared.outputs.artifact_id == ''
        id: image
        run: python3 ci/release_image.py publish artifacts

      - name: Attest the image's build provenance
        if: steps.prepared.outputs.artifact_id == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/glowcap-org/glowcap-rooms
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Write the image's software bill of materials
        if: steps.prepared.outputs.artifact_id == ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/glowcap-org/glowcap-rooms@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: release-assets/glowcap-rooms-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Attest the image's software bill of materials
        if: steps.prepared.outputs.artifact_id == ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/glowcap-org/glowcap-rooms
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: release-assets/glowcap-rooms-${{ github.ref_name }}.spdx.json
          push-to-registry: true

      - name: Render the release page and download every provenance bundle
        if: steps.prepared.outputs.artifact_id == ''
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 ci/release_notes.py --facts artifacts/release.json \
            --image-digest "$IMAGE_DIGEST" --output artifacts/release-notes.md
          python3 ci/github_release.py bundles "$RELEASE_TAG"

      - name: Seal the prepared release
        if: steps.prepared.outputs.artifact_id == ''
        run: python3 ci/github_release.py seal-prepared "$RELEASE_TAG"

      - name: Save this run's prepared release
        if: steps.prepared.outputs.artifact_id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: prepared-release
          path: |
            release-assets/
            artifacts/release.json
            artifacts/release-notes.md
            artifacts/prepared-release.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0

      - name: Verify the saved release generation
        run: python3 ci/github_release.py verify-prepared "$RELEASE_TAG"

      - name: Fill the draft release, then make it public
        run: python3 ci/github_release.py publish-draft "$RELEASE_TAG"

      - name: Publish the language packages at the tag
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "refs/tags/$RELEASE_TAG" -f tag="$RELEASE_TAG"
