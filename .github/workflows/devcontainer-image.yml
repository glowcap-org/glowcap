# Called by check so Linux consumers wait for one prepared image.
name: devcontainer-image

on:
  workflow_call:
    outputs:
      image:
        value: ${{ jobs.trusted.outputs.image || jobs.readonly.outputs.image }}
      archive:
        value: ${{ jobs.trusted.outputs.archive || jobs.readonly.outputs.archive }}

jobs:
  trusted:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image: ${{ steps.prepare.outputs.image }}
      archive: ${{ steps.prepare.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.devcontainer/ci
        id: prepare

  readonly:
    if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev')
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image: ${{ steps.prepare.outputs.image }}
      archive: ${{ steps.prepare.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.devcontainer/ci
        id: prepare
