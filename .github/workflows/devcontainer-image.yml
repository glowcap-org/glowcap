# Called by check so Linux consumers wait for one prepared image.
name: devcontainer-image

on:
  workflow_call:
    outputs:
      image:
        value: ${{ jobs.trusted.outputs.image || jobs.readonly.outputs.image }}
      archive:
        value: ${{ jobs.trusted.outputs.archive || jobs.readonly.outputs.archive }}

jobs:
  trusted:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image: ${{ steps.prepare.outputs.image }}
      archive: ${{ steps.prepare.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.devcontainer/ci
        id: prepare

  readonly:
    if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev')
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image: ${{ steps.prepare.outputs.image }}
      archive: ${{ steps.prepare.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.devcontainer/ci
        id: prepare

      - name: Share an unpublished PR image within this run
        id: share
        if: steps.prepare.outputs.archive == 'true'
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: &image-upload
          name: devcontainer-image
          path: ${{ runner.temp }}/devcontainer.tar
          compression-level: 1
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Share the unpublished PR image again
        if: steps.share.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: *image-upload
