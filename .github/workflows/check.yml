# The full gate sequence, run in the canonical devcontainer image via
# ci/gates.sh. Origin is Codeberg, whose hosted runners cannot build the
# image (no docker-in-docker), so its docker-capable mirror carries the full
# sequence while .forgejo/workflows/check.yml runs the Zig-only checks.
# Topology: CONTRIBUTING.md "Continuous integration".
#
# The devcontainer image is rebuilt from scratch on every run (push: never,
# no registry cache) — a named recurring cost, accepted until image caching
# earns its registry surface.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run the gates in the devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: bash ci/gates.sh
