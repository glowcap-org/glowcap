# The full gate sequence, run in the canonical devcontainer image via
# ci/gates.sh. The sequence itself is forge-neutral, so this file is the only
# thing that would change if pancake moved.
# Topology: CONTRIBUTING.md "Continuous integration".
#
# The devcontainer image is rebuilt from scratch on every run (push: never,
# no registry cache) — a named recurring cost, accepted until image caching
# earns its registry surface.
name: check

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # The CI action resolves Compose before it runs initializeCommand, so use
      # the same checkout configurator as a contributor and prepare the two
      # managed external networks it names.
      - name: Prepare the devcontainer's external networks
        run: |
          bash .devcontainer/bin/configure.sh
          docker network create rooms-net 2>/dev/null || true
          docker network create pancake-main-egress 2>/dev/null || true

      - name: Run the gates in the devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: bash ci/gates.sh

  macos-runtime:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Run the Zig test suite on macOS
        run: zig build test -j4 --summary all
