# The full gate sequence, run in the canonical devcontainer image via
# ci/gates.sh. The sequence itself is forge-neutral, so this file is the only
# thing that would change if pancake moved.
# Topology: CONTRIBUTING.md "Continuous integration".
#
# The devcontainer image is rebuilt from scratch on every run (push: never,
# no registry cache) — a named recurring cost, accepted until image caching
# earns its registry surface.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # The devcontainer's compose file declares both networks `external: true`,
      # and names the side network through `EGRESS_NET` with a `:?` default that
      # hard-errors when unset. A developer supplies both from the gitignored
      # .devcontainer/.env; a fresh runner has neither, so compose refuses to
      # start and every gate below it silently never runs. Create the networks
      # and write the env compose auto-loads from this directory.
      - name: Prepare the devcontainer's external networks
        run: |
          docker network create rooms-net 2>/dev/null || true
          docker network create pancake-ci-egress 2>/dev/null || true
          echo "EGRESS_NET=pancake-ci-egress" > .devcontainer/.env

      - name: Run the gates in the devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: bash ci/gates.sh
