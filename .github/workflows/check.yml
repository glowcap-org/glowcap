# Every check of a commit. ci/README.md is the map: plan selects the groups,
# one job prepares the toolchain image, each group compiles once and tests in
# parallel (check-group.yml), macOS and the workflow audit run beside them,
# and `gates` is the one required result. Pull requests into dev run the
# groups their paths reach. Everything else runs full validation, and only a
# full run reports `gates`, which the main ruleset reads from the dev push
# run whose success starts promote.yml.
name: check

on:
  # Main is a fast-forward of a dev commit this workflow already validated, so
  # a push to main runs nothing again.
  push:
    branches: [dev]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Full validation or the long fuzz search
        type: choice
        required: true
        default: check
        options: [check, fuzz]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.suite || 'check' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  plan:
    if: &check-suite >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'check')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.select.outputs.groups }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select validation coverage
        id: select
        run: python3 ci/plan.py

  image:
    needs: plan
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devcontainer-image.yml

  # Groups run side by side, so a group's tests wait only for its own build.
  linux:
    needs: [plan, image]
    name: linux (${{ matrix.group.name }})
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    uses: ./.github/workflows/check-group.yml
    with:
      group: ${{ matrix.group.name }}
      phases: ${{ toJSON(matrix.group.phases) }}
      shards: ${{ toJSON(matrix.group.shards) }}
      image: ${{ needs.image.outputs.image }}
      archive: ${{ needs.image.outputs.archive }}

  # Static audit of every workflow and action file: injection, credential
  # persistence, unpinned actions, cache poisoning on release paths. Findings
  # a design answers are listed with their reason in .github/zizmor.yml.
  workflows:
    if: *check-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        id: zizmor
        with:
          version: 1.31.1
          persona: regular
          min-severity: low
          advanced-security: true
      # SARIF mode sends the findings to code scanning and exits 0 on them, so
      # the verdict is read from the report: one finding fails this job.
      - name: Refuse findings
        env:
          REPORT: ${{ steps.zizmor.outputs.output-file }}
        run: |
          jq -r '.runs[].results[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' "$REPORT" > findings
          cat findings
          test ! -s findings

  # A pull request that adds or moves a dependency is compared with the
  # dependency graph: a known vulnerability at any severity fails the review.
  # The graph covers the Actions, Cargo, and Python manifests.
  # Outside pull requests this job succeeds without a comparison, so the
  # aggregate can require it without accepting skipped validation jobs.
  dependencies:
    if: *check-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: low
          comment-summary-in-pr: never

  # The one required result. It runs whatever happened above, and
  # ci/report.py fails it unless every dependency succeeded.
  gates:
    name: ${{ needs.plan.outputs.full == 'true' && 'gates' || 'dev-gates' }}
    needs: [plan, image, linux, macos-runtime, workflows, dependencies]
    if: >-
      always() && (
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'check'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Summarize and require validation
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 ci/report.py

  # Full validation searches each fuzz target for 25K runs. This job searches
  # ten times longer, nightly on dev, and fails on a find; a find is replayed
  # into the layer's regression corpus by hand.
  scheduled-fuzz:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'fuzz')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the pinned submodules
        id: submodules
        run: python3 ci/submodules.py key

      - name: Restore the pinned submodule objects
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/modules
          key: ${{ steps.submodules.outputs.key }}

      - name: Check out the pinned submodules
        run: python3 ci/submodules.py checkout

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Restore Zig package downloads
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-pkg
          key: zig-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}

      - name: Fetch pinned Zig dependencies
        run: python3 ci/gates.py fetch

      - name: Deep mutation fuzzing
        run: zig build fuzz -Dfuzz-runs=250K --summary all

      - name: Keep a fuzzer finding
        if: ${{ !cancelled() && hashFiles('zig-out/fuzz-finding.bin') != '' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-finding-${{ github.sha }}-nightly-${{ github.run_attempt }}
          path: zig-out/fuzz-finding.bin
          if-no-files-found: error

  macos-runtime:
    if: *check-suite
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the pinned submodules
        id: submodules
        run: python3 ci/submodules.py key

      - name: Restore the pinned submodule objects
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/modules
          key: ${{ steps.submodules.outputs.key }}

      - name: Check out the pinned submodules
        run: python3 ci/submodules.py checkout

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Restore Zig package downloads
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-pkg
          key: zig-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}

      - name: Fetch pinned Zig dependencies
        run: python3 ci/gates.py fetch

      - uses: ./.github/actions/pins
        id: pins

      - name: Install the pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
          enable-cache: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.pins.outputs.deno }}

      - name: Check host-side infrastructure on macOS
        run: zig build infrastructure-check --test-timeout 30s --summary all

      - name: Run Zig and Loam storage tests on macOS
        run: zig build test loam-lmdb-test loam-sqlite-test loam-storage-crash-test loam-actors-crash-test loam-managed-crash-test loam-references-crash-test loam-collection-crash-test loam-lmdb-compaction-crash-test loam-sqlite-compaction-crash-test --test-timeout 30s -j4 --summary all
