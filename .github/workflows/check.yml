# Pull requests get a short Zig-only check. Main and dev pushes run the full
# gate sequence in the canonical devcontainer image via ci/gates.sh, plus the
# host-side infrastructure and runtime checks on macOS. The sequence itself is
# forge-neutral, so this file is the only thing that would change if glowcap
# moved.
# Topology: CONTRIBUTING.md "Continuous integration".
#
# The devcontainer image is rebuilt from scratch on every run (push: never,
# no registry cache) — a named recurring cost, accepted until image caching
# earns its registry surface.
name: check

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Run the Zig test suite
        run: zig build test --test-timeout 30s --summary all

      - name: Check Zig formatting
        run: zig build fmt-check --summary all

  gates:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # The CI action resolves Compose before it runs initializeCommand, so use
      # the same checkout configurator as a contributor and prepare the two
      # managed external networks it names.
      - name: Prepare the devcontainer's external networks
        run: |
          bash .devcontainer/bin/configure.sh
          docker network create glowcap-rooms-net 2>/dev/null || true
          docker network create glowcap-dev-main-egress 2>/dev/null || true

      - name: Run the gates in the devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: bash ci/gates.sh

  macos-runtime:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Check host-side infrastructure on macOS
        run: zig build infrastructure-check --test-timeout 30s --summary all

      - name: Run Zig and native Loam storage tests on macOS
        run: zig build test loam-lmdb-test loam-lmdb-crash-test loam-actors-crash-test loam-managed-crash-test loam-references-crash-test loam-collection-crash-test loam-compaction-crash-test --test-timeout 30s -j4 --summary all
