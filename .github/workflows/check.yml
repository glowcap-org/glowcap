# Development runs select affected lanes. Full validation runs for main,
# main PRs, CI/build changes, nightly, and manual suite=check. Only full runs
# report the required gates context. Nightly also runs deep fuzzing.
# Topology: CONTRIBUTING.md "Continuous integration".
#
# One preparation job resolves or builds the toolchain before Linux fans out.
name: check

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Full validation or the long fuzz search
        type: choice
        required: true
        default: check
        options: [check, fuzz]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.suite || 'check' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  plan:
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'check')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select validation coverage
        id: select
        run: python3 ci/plan.py

  image:
    needs: plan
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devcontainer-image.yml

  linux:
    needs: [plan, image]
    name: linux (${{ matrix.lane }})
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'check')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # These SDKs belong to the disposable hosted runner. Product tools are
      # supplied by the devcontainer, so they only consume build disk here.
      - name: Reclaim disk space for container builds
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      # Download stores are shared between runs. Installed tools and
      # credentials are never restored.
      - name: Restore dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/glowcap/ci/zig-pkg
            ~/.cache/glowcap/cargo/registry
            ~/.cache/glowcap/cargo/git
            ~/.cache/glowcap/tool/deno/remote
            ~/.cache/glowcap/tool/deno/npm
            ~/.cache/glowcap/tool/uv
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh', '**/Cargo.lock', '**/deno.lock', '**/uv.lock') }}
          restore-keys: downloads-${{ runner.os }}-${{ runner.arch }}-

      # Compile state is restored too, because a hosted runner compiles cold an
      # order of magnitude slower than a workstation. Zig keys every object by
      # its inputs and every process proof always reruns, so a restore saves
      # compile time and skips no proof. Each lane keeps its own entry, and a
      # toolchain change starts a new family. Zig's cache has no collector, so
      # state past the limit, or more than the runner's disk can spare, is
      # dropped and that run saves a fresh one. Full qualification builds cold
      # and saves: its result qualifies main, and it holds the cold build to
      # its budgets.
      - name: Restore build state
        id: build-state
        if: needs.plan.outputs.full != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/glowcap/tool/zig
            ~/.cache/glowcap/ci/zig-local
            ~/.cache/glowcap/ci/cargo-build
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}-

      - name: Bound the restored build state
        if: needs.plan.outputs.full != 'true'
        env:
          LIMIT_GB: 12
          # A cold core lane ends with about 13 GB free after its own build.
          FREE_FLOOR_GB: 30
        run: |
          stores=(~/.cache/glowcap/tool/zig ~/.cache/glowcap/ci/zig-local ~/.cache/glowcap/ci/cargo-build)
          size=$(du -s --block-size=1G "${stores[@]}" 2>/dev/null | awk '{ total += $1 } END { print total + 0 }')
          free=$(df --output=avail --block-size=1G / | tail -1 | tr -d ' ')
          echo "Restored build state: ${size} GB of ${LIMIT_GB} GB, ${free} GB free"
          if [ "$size" -gt "$LIMIT_GB" ] || [ "$free" -lt "$FREE_FLOOR_GB" ]; then
            rm -rf -- "${stores[@]}"
            echo "Dropped it; this run builds cold and saves a fresh state."
          fi

      - name: Install the pinned Dev Containers CLI
        run: npm install -g "@devcontainers/cli@$(cat .devcontainer/ci/cli-version)"

      - name: Authenticate to the image registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Download the unpublished PR image
        if: needs.image.outputs.archive == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devcontainer-image
          path: ${{ runner.temp }}

      - name: Start the prepared devcontainer
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: python3 .devcontainer/ci/image.py start "$IMAGE"

      - name: Fetch pinned Zig dependencies
        id: fetch
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json bash ci/fetch-zig.sh

      # Every phase runs once the container is ready, even after an earlier
      # phase failed, so one run reports every failure in the lane.
      - name: Infrastructure and timeout checks
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && matrix.lane == 'core' }}
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json --remote-env CARGO_INCREMENTAL=0 bash ci/gates.sh infrastructure

      - name: Core, memory, runtime, and TLS checks
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && matrix.lane == 'core' }}
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json --remote-env CARGO_INCREMENTAL=0 bash ci/gates.sh core

      - name: ReleaseSafe tests in bounded compile groups
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && matrix.lane == 'shipped' }}
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json --remote-env CARGO_INCREMENTAL=0 bash ci/gates.sh shipped

      - name: Browser and interoperability smoke checks
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && matrix.lane == 'shipped' }}
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json --remote-env CARGO_INCREMENTAL=0 bash ci/gates.sh smoke

      - name: Bounded mutation fuzzing
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && matrix.lane == 'shipped' && needs.plan.outputs.full == 'true' }}
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json --remote-env CARGO_INCREMENTAL=0 bash ci/gates.sh fuzz

      - name: Rust sidecar tests
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && matrix.lane == 'bindings' }}
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json --remote-env CARGO_INCREMENTAL=0 bash ci/gates.sh sidecars

      - name: Bindings and cross-language scenarios
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && matrix.lane == 'bindings' }}
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json --remote-env CARGO_INCREMENTAL=0 bash ci/gates.sh bindings

      - name: Wasm and browser scenarios
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && matrix.lane == 'browser' }}
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json --remote-env CARGO_INCREMENTAL=0 bash ci/gates.sh browser

      - name: Goblins and OCapN interoperability
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && matrix.lane == 'interop' }}
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json --remote-env CARGO_INCREMENTAL=0 bash ci/gates.sh interop

      - name: Iroh providers and relay matrices
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && matrix.lane == 'transports' }}
        run: devcontainer exec --workspace-folder . --config .devcontainer/.ci/devcontainer.json --remote-env CARGO_INCREMENTAL=0 bash ci/gates.sh transports

      # The evidence record is the run's product: what ran, on what, and how
      # each gate ended. It is kept on failure too, since a red run's record
      # is what names the gate that failed. A superseded run can be cancelled
      # before the recorder starts, so cancellation has no required artifact.
      - name: Keep the evidence record
        if: ${{ !cancelled() && hashFiles('zig-out/evidence/**/*.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ github.sha }}-${{ matrix.lane }}
          path: zig-out/evidence/**/*.json
          if-no-files-found: error

      # A fuzz search never repeats, so the input that crashed a target is
      # the only way to replay what this run found. The fuzz runner leaves it
      # in the checkout, outside the build cache.
      - name: Keep a fuzzer finding
        if: ${{ !cancelled() && hashFiles('zig-out/fuzz-finding.bin') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-finding-${{ github.sha }}-${{ matrix.lane }}
          path: zig-out/fuzz-finding.bin
          if-no-files-found: error

      # Pushes and nightly runs keep their compile state, even after a failed
      # gate. Pull requests only read it. A run whose container never started
      # holds no state, and saving it would hand the next run an empty cache.
      - name: Save build state
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/glowcap/tool/zig
            ~/.cache/glowcap/ci/zig-local
            ~/.cache/glowcap/ci/cargo-build
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize gate results
        if: ${{ !cancelled() }}
        run: |
          df -h /
          docker system df
          python3 - <<'PYTHON'
          import glob, json, os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('| Gate | Result | Seconds |\n| --- | --- | ---: |\n')
              for path in sorted(glob.glob('zig-out/evidence/**/*.json', recursive=True)):
                  record = json.load(open(path))
                  for gate in record['gates']:
                      result = 'passed' if gate['exit'] == 0 else f"failed ({gate['exit']})"
                      output.write(f"| `{gate['command']}` | {result} | {gate['seconds']} |\n")
          PYTHON

  # Keep the branch-protection context stable. Missing, skipped, cancelled,
  # or failed matrix work must never produce a successful aggregate.
  gates:
    name: ${{ needs.plan.outputs.full == 'true' && 'gates' || 'dev-gates' }}
    needs: [plan, image, linux]
    if: >-
      always() && (
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'check'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Linux lane to pass
        env:
          IMAGE: ${{ needs.image.result }}
          RESULT: ${{ needs.linux.result }}
          PLAN: ${{ needs.plan.result }}
        run: test "$PLAN" = success && test "$IMAGE" = success && test "$RESULT" = success

  # Full validation searches each fuzz target for 25K runs. This lane searches a
  # ten times longer, on main, and fails on a find; a find is replayed
  # into the layer's regression corpus by hand.
  scheduled-fuzz:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'fuzz')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Restore Zig package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: zig-pkg
          key: zig-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}

      - name: Fetch pinned Zig dependencies
        run: bash ci/fetch-zig.sh

      - name: Deep mutation fuzzing
        run: zig build fuzz -Dfuzz-runs=250K --summary all

  macos-runtime:
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'check')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Restore Zig package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: zig-pkg
          key: zig-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}

      - name: Fetch pinned Zig dependencies
        run: bash ci/fetch-zig.sh

      - name: Read the pinned Deno version
        id: deno
        run: |
          source .devcontainer/pins.sh
          echo "version=$DENO_VERSION" >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.deno.outputs.version }}

      - name: Check host-side infrastructure on macOS
        run: zig build infrastructure-check --test-timeout 30s --summary all

      - name: Run Zig and Loam storage tests on macOS
        run: zig build test loam-lmdb-test loam-sqlite-test loam-storage-crash-test loam-actors-crash-test loam-managed-crash-test loam-references-crash-test loam-collection-crash-test loam-lmdb-compaction-crash-test loam-sqlite-compaction-crash-test --test-timeout 30s -j4 --summary all
