# Pull requests into dev select affected groups. Full validation runs for
# pushes to dev and main, main PRs, CI/build changes, nightly, and manual
# suite=check. Only full runs report the required gates context, and the main
# ruleset reads it from the dev push run. Nightly also runs deep fuzzing.
# Topology: CONTRIBUTING.md "Continuous integration".
#
# One preparation job resolves or builds the toolchain before Linux fans out
# into groups, each of which compiles once and then tests in parallel.
name: check

on:
  # Main is a fast-forward of a dev commit this workflow already validated, so
  # a push to main runs nothing again.
  push:
    branches: [dev]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Full validation or the long fuzz search
        type: choice
        required: true
        default: check
        options: [check, fuzz]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.suite || 'check' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  plan:
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'check')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.select.outputs.groups }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select validation coverage
        id: select
        run: python3 ci/plan.py

  image:
    needs: plan
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devcontainer-image.yml

  # Each group builds once, in shards, and then tests every phase in parallel
  # (check-group.yml). Groups run side by side, so a group's tests wait only
  # for its own build.
  linux:
    needs: [plan, image]
    name: linux (${{ matrix.group.name }})
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'check')
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    uses: ./.github/workflows/check-group.yml
    with:
      group: ${{ matrix.group.name }}
      phases: ${{ toJSON(matrix.group.phases) }}
      shards: ${{ toJSON(matrix.group.shards) }}
      full: ${{ needs.plan.outputs.full }}
      image: ${{ needs.image.outputs.image }}
      archive: ${{ needs.image.outputs.archive }}

  # Keep the branch-protection context stable. Missing, skipped, cancelled,
  # or failed matrix work must never produce a successful aggregate.
  gates:
    name: ${{ needs.plan.outputs.full == 'true' && 'gates' || 'dev-gates' }}
    needs: [plan, image, linux]
    if: >-
      always() && (
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'check'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Linux group to pass
        env:
          IMAGE: ${{ needs.image.result }}
          RESULT: ${{ needs.linux.result }}
          PLAN: ${{ needs.plan.result }}
        run: test "$PLAN" = success && test "$IMAGE" = success && test "$RESULT" = success

  # Full validation searches each fuzz target for 25K runs. This job searches
  # ten times longer, on main, and fails on a find; a find is replayed
  # into the layer's regression corpus by hand.
  scheduled-fuzz:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'fuzz')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Restore Zig package downloads
        timeout-minutes: 5
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: zig-pkg
          key: zig-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}

      - name: Fetch pinned Zig dependencies
        run: bash ci/fetch-zig.sh

      - name: Deep mutation fuzzing
        run: zig build fuzz -Dfuzz-runs=250K --summary all

      - name: Keep a fuzzer finding
        if: ${{ !cancelled() && hashFiles('zig-out/fuzz-finding.bin') != '' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-finding-${{ github.sha }}-nightly-${{ github.run_attempt }}
          path: zig-out/fuzz-finding.bin
          if-no-files-found: error

  macos-runtime:
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'check')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install the pinned Zig
        run: |
          ZIG_INSTALL_DIR="$RUNNER_TEMP/zig" bash .devcontainer/image/zig.sh
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Restore Zig package downloads
        timeout-minutes: 5
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: zig-pkg
          key: zig-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon', '.devcontainer/pins.sh', '.devcontainer/checksums.sh') }}

      - name: Fetch pinned Zig dependencies
        run: bash ci/fetch-zig.sh

      - name: Read the pinned Deno version
        id: deno
        run: |
          source .devcontainer/pins.sh
          echo "version=$DENO_VERSION" >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.deno.outputs.version }}

      - name: Check host-side infrastructure on macOS
        run: zig build infrastructure-check --test-timeout 30s --summary all

      - name: Run Zig and Loam storage tests on macOS
        run: zig build test loam-lmdb-test loam-sqlite-test loam-storage-crash-test loam-actors-crash-test loam-managed-crash-test loam-references-crash-test loam-collection-crash-test loam-lmdb-compaction-crash-test loam-sqlite-compaction-crash-test --test-timeout 30s -j4 --summary all
