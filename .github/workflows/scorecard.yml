# OpenSSF Scorecard reads this repository's supply chain posture from the
# outside: pinned dependencies, token permissions, branch protection, dangerous
# workflow patterns, signed releases, dependency updates, static analysis, and
# the security policy. Each finding lands in code scanning, and the published
# score is public at https://scorecard.dev/viewer/?uri=github.com/glowcap-org/glowcap
# with the badge in README.md. The action publishes only from the default
# branch, so the workflow runs weekly on dev, on a change to the files it
# scores, and on demand.
name: scorecard

on:
  schedule:
    - cron: "23 7 * * 1"
  push:
    branches: [dev]
    paths:
      - ".github/**"
      - "SECURITY.md"
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
