# zizmor's static audit of every workflow and action runs in check.yml (the
# workflows job) and locally with `uvx zizmor .`. It is the one authority for
# action pinning, credential persistence, template injection, release cache
# poisoning, and the Dependabot cooldown, so no test in ci/ repeats them. A
# finding is fixed in the workflow. The exceptions below are the designs the
# audit cannot read, each with the reason it is safe.
rules:
  unpinned-uses:
    config:
      policies:
        # Every third-party action is pinned to a commit, first party included.
        "*": hash-pin
  dangerous-triggers:
    ignore:
      # promote.yml fast-forwards main to a dev commit whose check run passed.
      # It checks out nothing and runs no repository code: its steps are API
      # calls naming the commit the run validated, and the main ruleset refuses
      # any move that is not a signed, checked fast-forward (ADR-0073).
      - promote.yml
  adhoc-packages:
    ignore:
      # The composite actions under .github/actions install the devcontainer
      # CLI at the version .devcontainer/pins.sh states, so the install is
      # pinned without an npm lockfile.
      - action.yml
  self-repository:
    # Local actions and reusable workflows are referenced by path, which runs
    # the checked-out commit's copy. The repository-qualified form would pin
    # them to a SHA the same push produced.
    disable: true
