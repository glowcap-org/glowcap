# zizmor's static audit of every workflow runs in check.yml (the workflows job)
# and locally with `uvx zizmor .github/workflows`. A finding is fixed in the
# workflow. The entries below are the two designs the audit cannot read, each
# with the reason it is safe.
rules:
  dangerous-triggers:
    ignore:
      # promote.yml fast-forwards main to a dev commit whose check run passed.
      # It checks out nothing and runs no repository code: its steps are API
      # calls naming the commit the run validated, and the main ruleset refuses
      # any move that is not a signed, checked fast-forward (ADR-0073).
      - promote.yml
  adhoc-packages:
    ignore:
      # Both install the devcontainer CLI at the version .devcontainer/ci/cli-version
      # states, so the install is pinned without an npm lockfile.
      - agent-tools.yml
      - pages.yml
  self-repository:
    # Local actions and reusable workflows are referenced by path, which runs
    # the checked-out commit's copy. The repository-qualified form would pin
    # them to a SHA the same push produced.
    disable: true
