# Runtime plumbing the two Rust transport sidecars share: transports/iroh
# (ADR-0021) and transports/webrtc (ADR-0035). Each wraps an async crate behind
# a synchronous C ABI, and this crate owns the three pieces that shape needs no
# matter which crate sits behind it: the private Tokio runtime a C call runs on,
# the endpoint-release barrier for tasks that outlive their handle, and the
# self-pipe readiness channel behind each sidecar's readiness fd. It exports no
# C symbol; every sidecar keeps its own `#[repr(C)]` event layout and its own
# `glowcap_*_sidecar_*` family.
#
# The transport workspace commits Cargo.lock. `zig build sidecar-common-test`
# runs this crate's own tests with `--locked`, and the tokio pin below is the
# one both sidecars carry.
[package]
repository = "https://github.com/glowcap-org/glowcap"
homepage = "https://glowcap.org"
documentation = "https://glowcap.org"
name = "glowcap-sidecar-common"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[lib]
name = "glowcap_sidecar_common"

[features]
# Helpers the sidecars' own unit tests reach for (queue length, filling the
# wake pipe). Each sidecar enables it from `[dev-dependencies]` only, so the
# shipped staticlibs never carry them.
test-support = []

[dependencies]
# dep tokio: The runtime owner both transport libraries share.
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
