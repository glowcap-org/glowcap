# The iroh netlayer sidecar (ADR-0055): a staticlib wrapping the iroh endpoint
# behind the narrow C ABI in include/glowcap_iroh_sidecar.h. libglowcap stays
# pure Zig; only the `iroh-*` build steps need cargo on PATH.
#
# Cargo.lock is committed, unlike bindings/rust's: this crate pulls an external
# network stack with a large transitive tree, and the lockfile is what makes
# `zig build iroh-interop` resolve the same dependencies on every machine. The
# direct dependencies are pinned exactly below as well, so an intentional bump
# is visible here, not only in the lockfile.
[package]
name = "glowcap-iroh"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Every unsafe block names the handle, owner, and pointer source it relies on.
# `clippy.toml` lets one comment above a statement cover the blocks inside it.
undocumented_unsafe_blocks = "deny"

[lib]
# The staticlib is named `glowcap_iroh_sidecar` so it emits
# `libglowcap_iroh_sidecar.a`: the private byte-level seam, distinct from the
# public frame-level artifact `libglowcap_net_transport_iroh` that the `iroh-abi` build step
# produces (ADR-0055).
name = "glowcap_iroh_sidecar"
crate-type = ["staticlib"]

[dependencies]
# The runtime owner, task barrier, and readiness channel both sidecars share
# (transports/sidecar-common). A path dependency still names its version so the
# exact-pin check reads it like every other row.
glowcap-sidecar-common = { path = "../sidecar-common", version = "=0.1.0" }
# 1.1.0 is the first release whose relay shutdown drains cancelled tasks
# without `JoinSet::join_all` panicking (n0-computer/iroh#4460). glowcap drops
# one private runtime per endpoint, so that shutdown path is part of our
# ordinary endpoint lifecycle rather than an upstream implementation detail.
iroh = "=1.2.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread"] }

[dev-dependencies]
# The same crate with its test helpers switched on for this crate's own tests.
glowcap-sidecar-common = { path = "../sidecar-common", version = "=0.1.0", features = ["test-support"] }

[profile.release]
# The staticlib links into Zig-built gate executables; thin LTO keeps the
# archive lean without cross-language LTO assumptions.
lto = "thin"
