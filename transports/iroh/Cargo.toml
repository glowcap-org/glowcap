# The iroh netlayer sidecar (ADR-0055): a staticlib wrapping the iroh endpoint
# behind the narrow blocking C ABI in include/pancake_iroh_sidecar.h. libpancake stays
# pure Zig; only the `iroh-*` build steps need cargo on PATH.
#
# Cargo.lock is committed, unlike bindings/rust's: this crate pulls an external
# network stack with a large transitive tree, and the lockfile is what makes
# `zig build iroh-interop` resolve the same dependencies on every machine. The
# direct dependencies are pinned exactly below as well, so an intentional bump
# is visible here, not only in the lockfile.
[package]
name = "pancake-iroh"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# The staticlib is named `pancake_iroh_sidecar` so it emits
# `libpancake_iroh_sidecar.a`: the private byte-level seam, distinct from the
# public frame-level artifact `libpancake_net_transport_iroh` that the `iroh-abi` build step
# produces (ADR-0055).
name = "pancake_iroh_sidecar"
crate-type = ["staticlib"]

[dependencies]
iroh = "=1.0.2"
tokio = { version = "=1.52.3", features = ["rt-multi-thread"] }

[profile.release]
# The staticlib links into Zig-built gate executables; thin LTO keeps the
# archive lean without cross-language LTO assumptions.
lto = "thin"
