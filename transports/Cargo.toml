# One static link unit for the Rust transports selected by a Zig consumer.
[package]
name = "glowcap-sidecars"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[workspace]
members = ["iroh", "webrtc", "sidecar-runtime"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/glowcap-org/glowcap"
homepage = "https://glowcap.org"
documentation = "https://glowcap.org"

[workspace.dependencies]
# dep tokio: The async runtime shared by the Rust iroh and WebRTC transports.
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
glowcap-sidecar-runtime = { path = "sidecar-runtime", version = "=0.1.6" }

[lib]
name = "glowcap_sidecars"
crate-type = ["staticlib"]
path = "sidecars.rs"

[features]
iroh = ["dep:iroh-sidecar"]
webrtc = ["dep:webrtc-sidecar"]

[dependencies]
iroh-sidecar = { package = "glowcap-iroh", path = "iroh", version = "=0.1.6", optional = true }
webrtc-sidecar = { package = "glowcap-webrtc", path = "webrtc", version = "=0.1.6", optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
