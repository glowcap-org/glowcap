# The WebRTC DataChannel netlayer sidecar (ADR-0035): the staticlib C ABI
# `libglowcap_webrtc_sidecar.a` that the Zig resident
# (`src/net/transport/webrtc.zig`) drives, the same private byte-level seam the
# iroh sidecar ships, plus the probe binary below that the datachannel gate runs.
#
# The transport workspace's Cargo.lock pins the DTLS, SCTP, ICE, STUN, and
# SDP dependency tree for reproducible builds.
[package]
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
name = "glowcap-webrtc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The sidecar's whole surface is a C ABI over caller pointers, so every entry
# point is an `unsafe fn`. At edition 2024 those bodies are not implicitly
# unsafe, and Rust only warns when one has not caught up. Denied, so the
# marking stays where the operation is instead of decaying back into a blanket
# claim on the signature.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Every unsafe block names the handle, owner, and pointer source it relies on.
# `clippy.toml` lets one comment above a statement cover the blocks inside it.
undocumented_unsafe_blocks = "deny"

[lib]
# The staticlib is named `glowcap_webrtc_sidecar` so it emits
# `libglowcap_webrtc_sidecar.a`: the private byte-level seam the Zig resident
# links, distinct from the public frame-level archive
# `libglowcap_net_transport_webrtc` (ADR-0022).
name = "glowcap_webrtc_sidecar"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
# The native answerer the browser peer connects to. Named
# `glowcap-webrtc-datachannel-probe` so the build step and the harness address
# it unambiguously.
name = "glowcap-webrtc-datachannel-probe"
path = "src/probe.rs"

[dependencies]
# The runtime owner, task barrier, and readiness channel both sidecars share
# (transports/sidecar-runtime).
glowcap-sidecar-runtime.workspace = true
# dep webrtc: Data channels behind the `webrtc` transport.
webrtc = "=0.21.1"
tokio = { workspace = true, features = ["macros", "io-std", "io-util", "sync", "time"] }
# dep async-trait: Async methods on the peer's traits.
async-trait = "=0.1.92"
# dep serde_json: JSON signaling messages.
serde_json = "=1.0.154"
# dep bytes: Byte buffers for data channel messages.
bytes = "=1.12.1"

[dev-dependencies]
# The same crate with its test helpers switched on for this crate's own tests.
glowcap-sidecar-runtime = { workspace = true, features = ["test-support"] }
