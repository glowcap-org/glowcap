# The WebRTC DataChannel netlayer sidecar (ADR-0089). Phase 1 shipped the
# de-risk probe binary below; phase 2 adds the staticlib C ABI
# `libglowcap_webrtc_sidecar.a` that the Zig resident
# (`src/net/transport/webrtc.zig`) drives, the same private byte-level seam the
# iroh sidecar ships. The probe binary stays for the phase-1 datachannel gate.
#
# Cargo.lock is committed, like transports/iroh's: the webrtc crate pulls a
# large transitive tree (DTLS, SCTP, ICE, STUN, SDP), and the lockfile is what
# makes `zig build webrtc-datachannel-test` resolve the same dependencies on
# every machine. The direct dependencies are pinned exactly below so an
# intentional bump is visible here, not only in the lockfile.
[package]
name = "glowcap-webrtc"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# The sidecar's whole surface is a C ABI over caller pointers, so every entry
# point is an `unsafe fn`. At edition 2024 those bodies are not implicitly
# unsafe, and Rust only warns when one has not caught up. Denied, so the
# marking stays where the operation is instead of decaying back into a blanket
# claim on the signature.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[lib]
# The staticlib is named `glowcap_webrtc_sidecar` so it emits
# `libglowcap_webrtc_sidecar.a`: the private byte-level seam the Zig resident
# links, distinct from the public frame-level archive
# `libglowcap_net_transport_webrtc` (ADR-0059, phase 3).
name = "glowcap_webrtc_sidecar"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
# The native answerer the browser peer connects to. Named
# `glowcap-webrtc-datachannel-probe` so the build step and the harness address
# it unambiguously.
name = "glowcap-webrtc-datachannel-probe"
path = "src/probe.rs"

[dependencies]
# The runtime owner, task barrier, and readiness channel both sidecars share
# (transports/sidecar-common).
glowcap-sidecar-common = { path = "../sidecar-common", version = "=0.1.0" }
webrtc = "=0.20.5"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
async-trait = "0.1"
serde_json = "1"
bytes = "1"

[dev-dependencies]
# The same crate with its test helpers switched on for this crate's own tests.
glowcap-sidecar-common = { path = "../sidecar-common", version = "=0.1.0", features = ["test-support"] }

[profile.release]
# Matches the iroh sidecar's posture: thin LTO keeps the binary lean without
# cross-language LTO assumptions.
lto = "thin"
